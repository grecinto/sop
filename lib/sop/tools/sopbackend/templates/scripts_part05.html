{{define "scripts_part05"}}
<script>
    function saveChatState() {
        const widget = document.getElementById('chat-widget');
        if (!widget) return;
        
        const state = {
            width: widget.style.width,
            height: widget.style.height,
            left: widget.style.left,
            top: widget.style.top
        };
        localStorage.setItem('sop_chat_state', JSON.stringify(state));
    }

    function isMobileViewport() {
        return window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    const RUNTIME_SWITCH_ENABLED = {{ .RuntimeSwitchEnabled }};
    const DEFAULT_RUNTIME_MODE = "{{ .DefaultRuntimeMode }}";

    function getUserSubscriptionFeatures() {
        try {
            const stored = localStorage.getItem('sop_subscription_features');
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function hasFeature(featureName) {
        const features = getUserSubscriptionFeatures();
        return features.some(f => String(f).toLowerCase().trim() === featureName.toLowerCase().trim());
    }

    function shouldLocalDaemonOnly() {
        return !RUNTIME_SWITCH_ENABLED;
    }

    function syncRuntimeControlsVisibility() {
        const controls = document.getElementById('chat-runtime-controls');
        if (!controls) return;
        const shouldShow = !shouldLocalDaemonOnly();
        controls.style.display = shouldShow ? 'flex' : 'none';
    }

    function getChatRuntimeMode() {
        const saved = localStorage.getItem('sop_chat_runtime');
        const trimmed = saved ? saved.trim() : '';
        if (shouldLocalDaemonOnly()) {
            return 'local';
        }
        if (trimmed === 'local' || trimmed === 'hq') {
            return trimmed;
        }
        return DEFAULT_RUNTIME_MODE;
    }

    // DEFAULT_DAEMON_URL constant is defined in scripts_part01.html

    function normalizeDaemonBaseURL(url) {
        const value = (url || '').trim();
        if (!value) {
            return DEFAULT_DAEMON_URL;
        }
        return value.replace(/\/$/, '');
    }

    function getDaemonBaseURL() {
        const configured = window.SOP_DAEMON_BASE_URL || localStorage.getItem('sop_daemon_url') || DEFAULT_DAEMON_URL;
        const value = normalizeDaemonBaseURL(configured);
        window.SOP_DAEMON_BASE_URL = value;
        return value;
    }

    function setDaemonBaseURL(url) {
        const value = normalizeDaemonBaseURL(url);
        window.SOP_DAEMON_BASE_URL = value;
        localStorage.setItem('sop_daemon_url', value);
        return value;
    }

    function persistChatRuntimeLocalURL() {
        const input = document.getElementById('chat-runtime-local-url');
        if (!input) return;
        setDaemonBaseURL(input.value);
    }

    function handleRuntimeSwitchReloadError(err, runtime) {
        console.error('[RuntimeToggle] reloadDatabases failed:', err);
        const message = err && err.message ? err.message : 'Unknown error';
        if (runtime === 'local' && message.includes('Cannot connect to local daemon')) {
            const select = document.getElementById('database-select');
            if (select) {
                select.innerHTML = '<option>Local daemon offline</option>';
            }
            return;
        }
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'position: fixed; top: 10px; right: 10px; background: #f44336; color: white; padding: 12px 20px; border-radius: 4px; z-index: 10000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);';
        errorDiv.textContent = `Runtime switch failed: ${message}`;
        document.body.appendChild(errorDiv);
        setTimeout(() => errorDiv.remove(), 4000);
    }

    function setChatRuntimeMode(mode) {
        const runtime = shouldLocalDaemonOnly() ? 'local' : (mode === 'local' ? 'local' : 'hq');
        localStorage.setItem('sop_chat_runtime', runtime);
        const checkbox = document.getElementById('chat-runtime-hq');
        const input = document.getElementById('chat-runtime-local-url');
        const domainSelect = document.getElementById('domain-select');
        const formatSelect = document.getElementById('format-select');
        if (checkbox) checkbox.checked = runtime === 'hq';
        if (input) {
            input.style.display = (!shouldLocalDaemonOnly() || runtime === 'hq') ? 'none' : 'inline-block';
            if (runtime === 'local' && !input.value) {
                input.value = getDaemonBaseURL();
            }
        }
        if (domainSelect) {
            const hasOptions = Array.from(domainSelect.options).some(option => option.value && option.value !== '' && option.getAttribute('data-dynamic') === 'true');
            domainSelect.style.display = hasOptions ? 'inline-block' : 'none';
            if (hasOptions) {
                domainSelect.removeAttribute('aria-hidden');
            } else {
                domainSelect.setAttribute('aria-hidden', 'true');
            }
        }
        if (formatSelect) {
            formatSelect.style.display = 'inline-block';
        }
        updateLocalAgentControls();
        updateChatFloaterButton();
        if (typeof window.syncEnvironmentManagerVisibility === 'function') {
            window.syncEnvironmentManagerVisibility();
        }
        localStorage.removeItem('sop_current_database');
        localStorage.removeItem('sop_current_store');
        if (typeof window !== 'undefined') {
            window.currentDatabase = null;
            window.currentStore = null;
        }

        // Reload dashboard to reflect new runtime
        if (typeof window.reloadDatabases === 'function') {
            window.reloadDatabases(true, runtime).catch(err => {
                handleRuntimeSwitchReloadError(err, runtime);
            });
        }

        void requestRuntimeWelcomeContext(runtime);

        return runtime;
    }

    function applyChatRuntimeSelection() {
        const checkbox = document.getElementById('chat-runtime-hq');
        const input = document.getElementById('chat-runtime-local-url');
        const domainSelect = document.getElementById('domain-select');
        const formatSelect = document.getElementById('format-select');
        const runtime = getChatRuntimeMode();
        if (checkbox) checkbox.checked = runtime === 'hq';
        if (input) {
            input.value = getDaemonBaseURL();
            input.style.display = (!shouldLocalDaemonOnly() || runtime === 'hq') ? 'none' : 'inline-block';
        }
        if (domainSelect) {
            const hasOptions = Array.from(domainSelect.options).some(option => option.value && option.value !== '' && option.getAttribute('data-dynamic') === 'true');
            domainSelect.style.display = hasOptions ? 'inline-block' : 'none';
            if (hasOptions) {
                domainSelect.removeAttribute('aria-hidden');
            } else {
                domainSelect.setAttribute('aria-hidden', 'true');
            }
        }
        if (formatSelect) {
            formatSelect.style.display = 'inline-block';
        }
        updateLocalAgentControls();
        updateChatFloaterButton();
        if (typeof window.syncEnvironmentManagerVisibility === 'function') {
            window.syncEnvironmentManagerVisibility();
        }
        return runtime;
    }

    function updateChatFloaterButton() {
        const button = document.getElementById('chat-floater-btn');
        const resetButton = document.getElementById('chat-reset-btn');
        const minimizeButton = document.getElementById('chat-minimize-btn');
        if (!button) return;
        const isFloaterMode = isChatFloaterMode();
        const isLocalRuntime = getChatRuntimeMode() === 'local';
        button.style.display = isFloaterMode ? 'none' : (isLocalRuntime ? 'inline-flex' : 'none');
        button.disabled = false;
        button.title = 'Open AI chat in a floating window';
        button.style.opacity = '1';
        button.textContent = '⧉';
        if (resetButton) {
            resetButton.style.display = isFloaterMode ? 'none' : 'inline-flex';
        }
        if (minimizeButton) {
            minimizeButton.style.display = isFloaterMode ? 'none' : 'inline-flex';
        }
    }

    function getDaemonAskURL() {
        return getDaemonBaseURL().replace(/\/$/, '') + '/api/ask';
    }

    function getDaemonHandoffURL() {
        return getDaemonBaseURL().replace(/\/$/, '') + '/api/handoff';
    }

    async function daemonFetch(endpoint, options = {}) {
        if (window.daemonAuth && typeof window.daemonAuth.request === 'function') {
            return window.daemonAuth.request(endpoint, options);
        }

        return fetch(endpoint, options);
    }

    async function requestRuntimeWelcomeContext(runtimeMode) {
        try {
            if (runtimeMode === 'local') {
                const response = await daemonFetch('/api/handoff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildLocalDaemonHandoffPayload('connect'))
                });
                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    throw new Error(text || 'Unable to connect to local daemon');
                }
                const data = await response.json().catch(() => null);
                if (data && data.welcome_context) {
                    replaceWelcomeContextMessage(data.welcome_context);
                }
                return data;
            }

            const response = await authFetch('/api/ai/test-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider: 'openai', model: 'gpt-4o-mini', handshake: true })
            });
            if (!response.ok) {
                const text = await response.text().catch(() => '');
                throw new Error(text || 'Unable to connect to HQ');
            }
            const data = await response.json().catch(() => null);
            if (data && data.welcome_context) {
                replaceWelcomeContextMessage(data.welcome_context);
            }
            return data;
        } catch (err) {
            console.warn(`[requestRuntimeWelcomeContext] Failed to get welcome context for ${runtimeMode === 'local' ? 'local daemon' : 'HQ'} runtime:`, err.message || err);
            // Don't show error in chat for local daemon - auth failures are handled gracefully
            if (runtimeMode !== 'local') {
                appendChatMessage('ai', `Welcome context unavailable for ${runtimeMode === 'local' ? 'local daemon' : 'HQ'} runtime: ${err.message || 'unknown error'}`);
            }
            return null;
        }
    }

    function replaceWelcomeContextMessage(text) {
        console.debug('[replaceWelcomeContextMessage] Called from:', new Error().stack);
        const history = document.getElementById('chat-history');
        if (!history) return;

        // Check if there are any real messages (non-welcome) in the history
        const messageCount = history.children.length;
        const messages = Array.from(history.children);
        const realMessages = messages.filter(el => 
            !el.dataset || !el.dataset.welcomeContext || el.dataset.welcomeContext !== 'true'
        );
        
        console.debug('[replaceWelcomeContextMessage] History check:', {
            totalMessages: messageCount,
            realMessages: realMessages.length,
            messageDetails: messages.map(el => ({
                class: el.className,
                hasDataset: !!el.dataset,
                welcomeContext: el.dataset?.welcomeContext,
                textPreview: el.textContent.substring(0, 50)
            })),
            willSkip: realMessages.length > 0
        });
        
        // Don't clear history if there are real user/AI messages
        if (realMessages.length > 0) {
            console.debug('[replaceWelcomeContextMessage] Skipping - real messages exist in history');
            return;
        }

        console.debug('[replaceWelcomeContextMessage] Clearing history and adding welcome message');
        history.innerHTML = '';
        currentAiMsgId = null;

        const div = document.createElement('div');
        div.className = 'chat-message ai';
        div.dataset.welcomeContext = 'true';
        div.innerHTML = text.replace(/\n/g, '<br>');
        history.appendChild(div);

        div.querySelectorAll('.recovery-action-button').forEach((button) => {
            button.addEventListener('click', async (event) => {
                event.preventDefault();
                const action = button.getAttribute('data-action');
                const kbName = button.getAttribute('data-kb-name') || '';
                const targetType = button.getAttribute('data-target-type') || '';
                const targetID = button.getAttribute('data-target-id') || '';
                if (!action || !targetType || !targetID) return;

                try {
                    const response = await daemonFetch('/api/daemon/vectorization/recovery', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, kb_name: kbName, target_type: targetType, target_id: targetID })
                    });
                    if (!response.ok) {
                        const text = await response.text().catch(() => '');
                        throw new Error(text || 'Unable to update recovery state');
                    }
                    const data = await response.json().catch(() => null);
                    const statusText = data?.latest?.status || 'updated';
                    const message = data?.message || (data?.error ? `Recovery failed: ${data.error}` : '');
                    button.textContent = message ? `${message}` : `Recovery ${statusText}`;
                    if (data?.updated) {
                        button.disabled = true;
                        button.classList.add('is-processed');
                    } else {
                        button.disabled = false;
                        button.classList.remove('is-processed');
                    }
                } catch (err) {
                    console.warn('[recovery-action-button] failed to update recovery state', err);
                    button.textContent = 'Recovery failed';
                    button.disabled = true;
                }
            });
        });

        requestAnimationFrame(() => {
            history.scrollTop = history.scrollHeight;
        });
    }

    function clearChatHistory() {
        const history = document.getElementById('chat-history');
        if (!history) return;

        history.innerHTML = '';
        currentAiMsgId = null;

        const input = document.getElementById('chat-input');
        if (input) {
            input.value = '';
        }

        requestAnimationFrame(() => {
            history.scrollTop = 0;
        });
    }

    // AI Terminal Management
    let aiTerminalPollInterval = null;
    let aiTerminalHeight = 250;
    let isTerminalPolling = false; // Track polling state to avoid loops
    
    // Cross-window communication for terminal polling (main window ↔ floating AI window)
    let terminalBroadcast = null;
    if (typeof BroadcastChannel !== 'undefined') {
        terminalBroadcast = new BroadcastChannel('sop_terminal_polling');
        terminalBroadcast.onmessage = (event) => {
            if (event.data === 'start' && !isChatFloaterMode() && !isTerminalPolling) {
                // Main window receives start signal from floating window
                startAITerminalPollingInternal();
            } else if (event.data === 'stop' && !isChatFloaterMode() && isTerminalPolling) {
                // Main window receives stop signal from floating window
                stopAITerminalPollingInternal();
            }
        };
    }

    // Cross-window communication for chat floater visibility (main window ↔ floating AI window)
    let chatFloaterBroadcast = null;
    if (typeof BroadcastChannel !== 'undefined') {
        chatFloaterBroadcast = new BroadcastChannel('sop_chat_floater_state');
        chatFloaterBroadcast.onmessage = (event) => {
            if (!isChatFloaterMode()) {
                // Main window receives state changes from floating window
                if (event.data === 'floater_opened') {
                    hideChatToggleButton();
                } else if (event.data === 'floater_closed') {
                    showChatToggleButton();
                }
            }
        };
    }

    function hideChatToggleButton() {
        const btn = document.getElementById('chat-toggle-btn');
        if (btn) {
            btn.style.display = 'none';
        }
    }

    function showChatToggleButton() {
        const btn = document.getElementById('chat-toggle-btn');
        if (btn) {
            btn.style.display = 'flex';
        }
    }

    function broadcastFloaterState(state) {
        if (chatFloaterBroadcast) {
            chatFloaterBroadcast.postMessage(state);
        }
    }

    function syncChatToggleButtonVisibility() {
        const widget = document.getElementById('chat-widget');
        const btn = document.getElementById('chat-toggle-btn');
        if (!widget || !btn) return;
        
        // Hide button if widget is active, show if inactive
        if (widget.classList.contains('active') || widget.style.display === 'flex') {
            btn.style.display = 'none';
        } else {
            btn.style.display = 'flex';
        }
    }

    function toggleAITerminal() {
        const pane = document.getElementById('ai-terminal-pane');
        if (!pane) return;
        
        if (pane.style.display === 'none') {
            openAITerminal();
        } else {
            closeAITerminal();
        }
    }

    function openAITerminal() {
        const pane = document.getElementById('ai-terminal-pane');
        if (!pane) return;
        
        pane.style.display = 'block';
        refreshAITerminal();
        startAITerminalPollingInternal(); // Direct call, no broadcast needed
    }

    function closeAITerminal() {
        const pane = document.getElementById('ai-terminal-pane');
        if (!pane) return;
        
        pane.style.display = 'none';
        stopAITerminalPollingInternal(); // Direct call, no broadcast needed
    }

    let lastTerminalOutput = '';

    // Truncate terminal output to prevent UI performance issues with massive logs
    function truncateTerminalOutput(text, maxLines = 2500) {
        if (!text) return text;
        
        const lines = text.split('\n');
        if (lines.length <= maxLines) {
            return text;
        }
        
        // Keep the most recent lines (like tail command)
        const keptLines = lines.slice(-maxLines);
        const omittedCount = lines.length - maxLines;
        
        // Add a header indicating truncation
        return `... [${omittedCount.toLocaleString()} earlier lines omitted for UI performance] ...\n\n` + keptLines.join('\n');
    }

    async function refreshAITerminal() {
        const output = document.getElementById('ai-terminal-output');
        if (!output) return;

        try {
            // Use the same session ID that AI commands use
            // Default to 'local-daemon' to match backend default (not 'default')
            const sessionID = (typeof currentSessionID !== 'undefined' && currentSessionID) ? currentSessionID : 'local-daemon';
            
            const response = await daemonFetch('/api/terminal/status?session_id=' + encodeURIComponent(sessionID), {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });

            if (!response.ok) {
                throw new Error('Terminal endpoint not available');
            }

            const data = await response.json();
            
            // Only update UI if:
            // 1. A command is currently running (data.running === true), OR
            // 2. The output has changed from what we last displayed
            const newOutput = (data && data.output) ? data.output : '';
            const isRunning = data && data.running === true;
            
            if (isRunning || newOutput !== lastTerminalOutput) {
                if (data && data.output && data.output.trim()) {
                    // Truncate output to prevent UI performance issues
                    const truncatedOutput = truncateTerminalOutput(data.output);
                    output.textContent = truncatedOutput;
                    output.dataset.hasOutput = 'true'; // Mark that we have real output
                    lastTerminalOutput = data.output;
                    // Always scroll to bottom to show latest output
                    output.scrollTop = output.scrollHeight;
                } else if (isRunning) {
                    if (output.textContent !== 'Thinking...') {
                        output.textContent = 'Thinking...';
                    }
                    output.dataset.hasOutput = ''; // Keep the terminal in a pending state
                    lastTerminalOutput = 'Thinking...';
                } else if (lastTerminalOutput !== 'Thinking...') {
                    const defaultMsg = 'No commands run yet. When the AI executes shell commands, the output will appear here.';
                    output.textContent = defaultMsg;
                    output.dataset.hasOutput = ''; // Clear flag so spinner shows on next command
                    lastTerminalOutput = defaultMsg;
                }
            }
            // If no command is running and output hasn't changed, preserve current display
        } catch (err) {
            console.error('Terminal refresh error:', err);
            output.textContent = 'Terminal monitoring unavailable. Ensure the daemon is running.';
            lastTerminalOutput = '';
        }
    }

    function startAITerminalPolling() {
        // Notify other windows (e.g., floating AI window → main window)
        if (terminalBroadcast && isChatFloaterMode()) {
            terminalBroadcast.postMessage('start');
        }
        
        // Start polling in this window if not in floater mode
        if (!isChatFloaterMode()) {
            startAITerminalPollingInternal();
        }
    }

    function startAITerminalPollingInternal() {
        if (isTerminalPolling) return; // Already polling
        isTerminalPolling = true;
        
        if (aiTerminalPollInterval) {
            clearInterval(aiTerminalPollInterval);
        }
        aiTerminalPollInterval = setInterval(() => {
            refreshAITerminal();
        }, 2000);
    }

    function stopAITerminalPolling() {
        // Notify other windows (e.g., floating AI window → main window)
        if (terminalBroadcast && isChatFloaterMode()) {
            terminalBroadcast.postMessage('stop');
        }
        
        // Stop polling in this window if not in floater mode
        if (!isChatFloaterMode()) {
            stopAITerminalPollingInternal();
        }
    }

    function stopAITerminalPollingInternal() {
        isTerminalPolling = false;
        if (aiTerminalPollInterval) {
            clearInterval(aiTerminalPollInterval);
            aiTerminalPollInterval = null;
        }
    }

    async function stopAITerminalCommand() {
        try {
            const sessionID = (typeof currentSessionID !== 'undefined' && currentSessionID) ? currentSessionID : 'local-daemon';
            const response = await daemonFetch('/api/terminal/stop?session_id=' + encodeURIComponent(sessionID), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            if (!response.ok) {
                throw new Error('Failed to stop command');
            }
            
            const result = await response.json();
            console.log('[Terminal] Stop command result:', result);
        } catch (err) {
            console.error('[Terminal] Failed to stop command:', err);
        }
    }

    // Terminal resize functionality
    (function() {
        const handle = document.getElementById('terminal-resize-handle');
        const pane = document.getElementById('ai-terminal-pane');
        if (!handle || !pane) return;

        let isResizing = false;
        let startY = 0;
        let startHeight = 0;

        handle.addEventListener('mousedown', (e) => {
            isResizing = true;
            startY = e.clientY;
            startHeight = parseInt(pane.style.height || '250', 10);
            document.body.style.cursor = 'ns-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const deltaY = startY - e.clientY;
            const newHeight = Math.max(100, Math.min(600, startHeight + deltaY));
            pane.style.height = newHeight + 'px';
            aiTerminalHeight = newHeight;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
            }
        });
    })();

    function getDefaultThinkingLevelForCurrentConfig() {
        const chatAIConfig = typeof getStoredAIConfig === 'function' ? getStoredAIConfig() : {};
        const providerConfig = typeof normalizeProviderConfig === 'function'
            ? normalizeProviderConfig(chatAIConfig.brain_provider || '', chatAIConfig.brain_model || '')
            : { provider: chatAIConfig.brain_provider || '', model: (chatAIConfig.brain_model || '').trim() };

        const provider = (providerConfig.provider || '').trim().toLowerCase();
        const model = (providerConfig.model || '').trim().toLowerCase();
        const normalizedProvider = provider === 'openai' ? 'chatgpt' : provider;

        if (normalizedProvider === 'anthropic') {
            if (model.includes('opus') || model.includes('sonnet')) return 'high';
            if (model.includes('haiku')) return 'medium';
        } else if (normalizedProvider === 'gemini') {
            if (model.includes('flash-lite')) return 'low';
            if (model.includes('flash')) return 'medium';
            if (model.includes('pro')) return 'high';
        } else if (normalizedProvider === 'chatgpt') {
            if (model.includes('mini') || model.includes('nano')) return 'low';
            if (model.includes('pro')) return 'high';
            return 'medium';
        }

        return '';
    }

    function syncChatThinkingMenuSelection(selectedValue) {
        const menu = document.getElementById('chat-thinking-menu');
        if (!menu) return;

        const input = document.getElementById('chat-thinking-select');
        const trigger = document.getElementById('chat-thinking-trigger');
        const currentValue = (selectedValue ?? input?.value ?? '').trim().toLowerCase();
        const resolvedValue = currentValue && currentValue !== 'auto' ? currentValue : getDefaultThinkingLevelForCurrentConfig();

        menu.querySelectorAll('.chat-thinking-option').forEach((button) => {
            const value = (button.getAttribute('data-value') || '').trim().toLowerCase();
            const isActive = value === (resolvedValue || '');
            button.classList.toggle('active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        if (trigger) {
            if (resolvedValue) {
                trigger.title = `Reasoning level: ${resolvedValue}`;
                trigger.setAttribute('data-level', resolvedValue);
            } else {
                trigger.title = 'Reasoning level override';
                trigger.setAttribute('data-level', 'auto');
            }
        }
    }

    function closeChatThinkingMenu() {
        const menu = document.getElementById('chat-thinking-menu');
        if (menu) {
            menu.classList.remove('show');
        }
    }

    function toggleChatThinkingMenu(event) {
        event?.preventDefault();
        event?.stopPropagation();
        const menu = document.getElementById('chat-thinking-menu');
        if (!menu) return;

        const shouldOpen = !menu.classList.contains('show');
        closeChatThinkingMenu();
        if (shouldOpen) {
            syncChatThinkingMenuSelection();
            menu.classList.add('show');
        }

        if (!window.__sopChatThinkingMenuBound) {
            document.addEventListener('click', (clickEvent) => {
                if (!clickEvent.target.closest('.chat-thinking-dropdown')) {
                    closeChatThinkingMenu();
                }
            });
            window.__sopChatThinkingMenuBound = true;
        }
    }

    function selectChatThinkingLevel(value) {
        const input = document.getElementById('chat-thinking-select');
        const trigger = document.getElementById('chat-thinking-trigger');
        if (input) {
            input.value = value || '';
        }
        syncChatThinkingMenuSelection(value || '');
        closeChatThinkingMenu();
        updateComposerState();
    }

    function getSelectedThinkingLevel() {
        const input = document.getElementById('chat-thinking-select');
        const value = (input?.value || '').trim().toLowerCase();
        return value === 'auto' || value === '' ? '' : value;
    }

    let pendingChatAttachments = [];

    function shouldShowVisionAttachmentControl(provider, model) {
        const normalizedProvider = String(provider || '').trim().toLowerCase();
        const normalizedModel = String(model || '').trim().toLowerCase();
        if (!normalizedProvider && !normalizedModel) {
            return false;
        }
        if (normalizedProvider === 'openai') {
            return normalizedModel.includes('gpt-4o') || normalizedModel.includes('gpt-4.1') || normalizedModel.includes('gpt-4') || normalizedModel.includes('gpt-5') || normalizedModel.includes('o3') || normalizedModel.includes('o4');
        }
        if (normalizedProvider === 'gemini') {
            return normalizedModel.includes('gemini') || normalizedModel.includes('vision') || normalizedModel.includes('flash') || normalizedModel.includes('pro');
        }
        if (normalizedProvider === 'anthropic') {
            return normalizedModel.includes('claude-3') || normalizedModel.includes('claude-4') || normalizedModel.includes('sonnet') || normalizedModel.includes('haiku') || normalizedModel.includes('vision');
        }
        return normalizedModel.includes('vision') || normalizedModel.includes('multimodal') || normalizedModel.includes('image');
    }

    async function handleChatAttachmentSelection(event) {
        const input = event && event.target ? event.target : document.getElementById('chat-attachment-input');
        const files = input && input.files ? Array.from(input.files) : [];
        if (!files.length) {
            return;
        }
        const nextAttachments = [];
        const rejectedFiles = [];
        const codeFiles = [];
        
        for (const file of files) {
            if (!file) {
                rejectedFiles.push('unknown file');
                continue;
            }
            
            // Check if it's a code file (text-based)
            const isCodeFile = /^(text\/|application\/(javascript|json|xml|x-sh))/.test(file.type) || 
                /\.(js|jsx|ts|tsx|py|go|java|c|cpp|h|hpp|cs|rb|php|rs|swift|kt|scala|sql|sh|bash|yml|yaml|json|xml|html|css|scss|sass|md|txt|log|conf|cfg|ini|toml|env)$/i.test(file.name);
            
            if (isCodeFile) {
                codeFiles.push(file);
                continue;
            }
            
            // Handle image files
            if (!file || !/^image\//i.test(file.type)) {
                rejectedFiles.push(file && file.name ? file.name : 'unknown file');
                continue;
            }
            try {
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result || '');
                    reader.onerror = () => reject(new Error('Unable to read selected image'));
                    reader.readAsDataURL(file);
                });
                if (!dataUrl) {
                    rejectedFiles.push(file.name || 'image');
                    continue;
                }
                nextAttachments.push({ fileName: file.name, mimeType: file.type || 'image/png', dataUrl });
            } catch (err) {
                rejectedFiles.push(file.name || 'image');
            }
        }
        // Handle code files by injecting into chat input
        if (codeFiles.length > 0) {
            const chatInput = document.getElementById('chat-input');
            if (chatInput) {
                for (const file of codeFiles) {
                    try {
                        const content = await file.text();
                        const ext = file.name.split('.').pop() || 'txt';
                        const langMap = {
                            'js': 'javascript', 'jsx': 'javascript', 'ts': 'typescript', 'tsx': 'typescript',
                            'py': 'python', 'rb': 'ruby', 'php': 'php', 'java': 'java', 'c': 'c', 'cpp': 'cpp',
                            'cs': 'csharp', 'go': 'go', 'rs': 'rust', 'swift': 'swift', 'kt': 'kotlin',
                            'sh': 'bash', 'bash': 'bash', 'yml': 'yaml', 'yaml': 'yaml', 'json': 'json',
                            'xml': 'xml', 'html': 'html', 'css': 'css', 'scss': 'scss', 'sql': 'sql',
                            'md': 'markdown', 'txt': 'text', 'log': 'text'
                        };
                        const lang = langMap[ext.toLowerCase()] || ext.toLowerCase();
                        const existingText = chatInput.value;
                        const separator = existingText && !existingText.endsWith('\n') ? '\n\n' : '';
                        chatInput.value = existingText + separator + `File: ${file.name}\n\`\`\`${lang}\n${content}\n\`\`\`\n`;
                        showChatAttachmentFeedback(`Added code file: ${file.name}`, 'success');
                    } catch (err) {
                        rejectedFiles.push(file.name);
                    }
                }
            }
        }
        
        if (nextAttachments.length > 0) {
            pendingChatAttachments = pendingChatAttachments.concat(nextAttachments);
            renderChatAttachmentPreview();
            setChatAttachmentControlsOpen(true);
            updateComposerState();
            showChatAttachmentFeedback(`Added ${nextAttachments.length} image attachment${nextAttachments.length === 1 ? '' : 's'}.`, 'success');
        }
        if (rejectedFiles.length > 0) {
            showChatAttachmentFeedback(`Skipped unsupported file${rejectedFiles.length === 1 ? '' : 's'}: ${rejectedFiles.join(', ')}`, 'error');
        }
        if (input) {
            input.value = '';
        }
    }

    function buildLocalDaemonHandoffPayload(query) {
        const token = typeof getStoredSessionToken === 'function' ? getStoredSessionToken() : '';
        const refreshToken = typeof getStoredRefreshToken === 'function' ? getStoredRefreshToken() : '';
        const chatAIConfig = typeof getStoredAIConfig === 'function' ? getStoredAIConfig() : {};
        const providerConfig = typeof normalizeProviderConfig === 'function'
            ? normalizeProviderConfig(chatAIConfig.brain_provider || '', chatAIConfig.brain_model || '')
            : { provider: chatAIConfig.brain_provider || '', model: (chatAIConfig.brain_model || '').trim() };
        const provider = providerConfig.provider || '';
        const model = providerConfig.model || '';
        const apiKey = chatAIConfig.brain_api_key || '';
        const baseURL = chatAIConfig.brain_url || '';
        const hqPort = (window.location.port || '').trim();
        
        const effectiveSessionID = currentSessionID || 'local-daemon';
        console.log('[buildLocalDaemonHandoffPayload] Using session_id:', effectiveSessionID, '(currentSessionID:', currentSessionID, ')');
        
        return {
            query: query || 'connect',
            auth: {
                access_token: token,
                refresh_token: refreshToken
            },
            hq: {
                base_url: window.location.origin || 'http://127.0.0.1:3000',
                port: hqPort,

            },

        };
    }

    function isAuthenticationError(error) {
        if (!error) return false;
        const message = error.message || String(error);
        return message.includes('Invalid or expired token') ||
               message.includes('Failed to authenticate with daemon') ||
               message.includes('Auth required') ||
               message.includes('401') ||
               message.includes('403');
    }

    function handleAuthenticationError() {
        // Clear any stored tokens
        if (typeof clearStoredSessionToken === 'function') {
            clearStoredSessionToken();
        }
        if (typeof clearCachedAppState === 'function') {
            clearCachedAppState();
        }
        // Clear daemon auth tokens
        if (window.daemonAuth && typeof window.daemonAuth.clearTokens === 'function') {
            window.daemonAuth.clearTokens();
        }
        // Redirect to login if not already there
        if (window.location.pathname !== '/login') {
            console.log('[Auth] Redirecting to login due to authentication failure');
            // Save current URL to return after login
            const returnUrl = encodeURIComponent(window.location.pathname + window.location.search + window.location.hash);
            window.location.assign('/login?return=' + returnUrl);
        }
    }

    async function ensureLocalAgentReachable() {
        const response = await daemonFetch('/api/handoff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildLocalDaemonHandoffPayload('connect'))
        });
        if (!response.ok) {
            const text = await response.text().catch(() => '');
            let errorMessage = text || 'Local agent is unavailable';
            
            // Try to parse JSON error response
            try {
                const errorData = JSON.parse(text);
                if (errorData.error) {
                    errorMessage = errorData.error;
                }
            } catch (e) {
                // Not JSON, use text as-is
            }
            
            throw new Error(errorMessage);
        }
        const data = await response.json().catch(() => null);
        
        // Capture session ID from handoff response for terminal polling
        // BUT: Don't overwrite if we're in floater mode and inherited session ID from URL
        // Floater must maintain the same session ID as main window
        const params = new URLSearchParams(window.location.search);
        const hasInheritedSession = params.get('sessionID');
        
        if (data && data.session_id && typeof currentSessionID !== 'undefined') {
            if (!hasInheritedSession || !currentSessionID) {
                // Only update if we didn't inherit from URL or don't have one yet
                currentSessionID = data.session_id;
                console.log('[Terminal] Using session ID:', currentSessionID);
            } else {
                console.log('[Terminal] Preserving inherited session ID:', currentSessionID, '(ignoring response session:', data.session_id + ')');
            }
        }
        
        if (data && data.welcome_context && !window.__sopLocalWelcomeShown) {
            window.__sopLocalWelcomeShown = true;
            replaceWelcomeContextMessage(data.welcome_context);
        }
        return true;
    }

    function resetChatPosition(forceDefault) {
        const widget = document.getElementById('chat-widget');
        if (!widget) return;

        widget.classList.remove('pinned');
        document.body.classList.remove('sop-chat-dashboard-hidden');

        if (isChatFloaterMode() && window.location.search.includes('chatFloater=1')) {
            widget.style.width = '100%';
            widget.style.height = '100%';
            widget.style.left = '0';
            widget.style.top = '0';
            widget.style.right = '0';
            widget.style.bottom = '0';
            widget.style.borderRadius = '0';
            widget.style.margin = '0';
            return;
        }

        const isMobile = isMobileViewport();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        if (isMobile) {
            widget.style.width = '';
            widget.style.height = '';
            widget.style.left = '';
            widget.style.top = '';
            widget.style.right = '';
            widget.style.bottom = '';
            widget.style.borderRadius = '';
            widget.style.margin = '';
            return;
        }

        if (forceDefault) {
            localStorage.removeItem('sop_chat_state');
        }

        if (!forceDefault) {
            const savedStateJson = localStorage.getItem('sop_chat_state');
            if (savedStateJson) {
                try {
                    const state = JSON.parse(savedStateJson);
                    const maxWidth = viewportWidth * 0.9;
                    const maxHeight = viewportHeight * 0.9;
                    const isValidPixelValue = (value) => {
                        if (value === null || value === undefined || value === '') return false;
                        if (typeof value === 'number') return Number.isFinite(value) && value >= 0;
                        const str = String(value).trim();
                        if (!str || /%|vw|vh|em|rem|calc/i.test(str)) return false;
                        return /^-?\d+(?:\.\d+)?(?:px)?$/i.test(str);
                    };
                    const widthNum = parseFloat(state.width);
                    const heightNum = parseFloat(state.height);
                    const leftNum = parseFloat(state.left);
                    const topNum = parseFloat(state.top);
                    const hasValidSavedState = isValidPixelValue(state.width) &&
                        isValidPixelValue(state.height) &&
                        isValidPixelValue(state.left) &&
                        isValidPixelValue(state.top) &&
                        Number.isFinite(widthNum) && Number.isFinite(heightNum) &&
                        Number.isFinite(leftNum) && Number.isFinite(topNum) &&
                        widthNum < maxWidth && heightNum < maxHeight;

                    if (hasValidSavedState) {
                        widget.style.width = state.width;
                        widget.style.height = state.height;
                        widget.style.left = state.left;
                        widget.style.top = state.top;
                        widget.style.right = 'auto';
                        widget.style.bottom = 'auto';

                        const rect = widget.getBoundingClientRect();
                        if (rect.left > viewportWidth - 50) widget.style.left = (viewportWidth - rect.width - 20) + 'px';
                        if (rect.top > viewportHeight - 50) widget.style.top = (viewportHeight - rect.height - 20) + 'px';

                        return;
                    }

                    localStorage.removeItem('sop_chat_state');
                } catch (e) {
                    console.error('Failed to load chat state', e);
                    localStorage.removeItem('sop_chat_state');
                }
            }
        }

        const width = 550;
        const height = 555;
        widget.style.width = width + 'px';
        widget.style.height = height + 'px';
        widget.style.left = '57px';
        widget.style.top = (viewportHeight - height + 2) + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
        widget.style.borderRadius = '8px';
        widget.style.margin = '';
    }

    function requestMainWindowRefreshOnClose() {
        const cleanupSignal = 'sop_chat_floater_cleanup';

            try {
                localStorage.setItem(cleanupSignal, String(Date.now()));
            } catch (err) {
                console.warn('[chatFloater] Unable to persist the cleanup signal:', err);
            }
        };

        const cleanupAndRefresh = () => {
            persistCleanupSignal();

            broadcastFloaterState('floater_closed');

        window.addEventListener('beforeunload', cleanupAndRefresh);

                return;
            }
            try {
                localStorage.removeItem(cleanupSignal);

                console.warn('[chatFloater] Unable to clear the cleanup signal:', err);

    async function openChatPiP() {
        if (getChatRuntimeMode() !== 'local') {
            console.warn('[openChatPiP] Floater is only available in local runtime');
            return;
        }

        const widget = document.getElementById('chat-widget');
        if (widget) {
            widget.classList.remove('active');
            widget.style.display = 'none';
        }

        // Hide the toggle button immediately (BroadcastChannel doesn't send to self)
        hideChatToggleButton();
        
        // Broadcast that floater is opening (for other windows)
        broadcastFloaterState('floater_opened');

        const floaterUrl = new URL('/app', window.location.origin);
        floaterUrl.searchParams.set('chatFloater', '1');
        // Include mode=daemon so the floater window gets properly initialized with daemon auth
        floaterUrl.searchParams.set('mode', 'daemon');
        // Pass current session ID to floater so it uses the same session
        const sessionToPass = currentSessionID || 'local-daemon';
        floaterUrl.searchParams.set('sessionID', sessionToPass);
        console.log('[openChatPiP] Passing session ID to floater:', sessionToPass);

        if (window && window.documentPictureInPicture && typeof window.documentPictureInPicture.requestWindow === 'function') {
            try {
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 420,
                    height: 650
                });
                const targetDocument = pipWindow.document;
                targetDocument.open();
                targetDocument.write(`<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>SOP AI Chat</title><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1f1f1f;overflow:hidden;}iframe{border:0;width:100%;height:100%;}</style></head><body><iframe src="${floaterUrl.toString()}" allow="clipboard-write"></iframe></body></html>`);
                targetDocument.close();
                
                // Detect when PiP window closes
                pipWindow.addEventListener('pagehide', () => {
                    showChatToggleButton();
                    broadcastFloaterState('floater_closed');
                });
                
                return;
            } catch (err) {
                console.warn('[openChatPiP] PiP failed, falling back to the current tab:', err);
                // Restore toggle button if PiP failed
                showChatToggleButton();
                broadcastFloaterState('floater_closed');
            }
        }

        console.warn('[openChatPiP] Opening the chat route in a fresh tab instead.');
        const newWindow = window.open(floaterUrl.toString(), '_blank', 'noopener,noreferrer');
        
        // For popup windows, we need to poll to detect closure
        if (newWindow) {
            const checkWindowClosed = setInterval(() => {
                if (newWindow.closed) {
                    clearInterval(checkWindowClosed);
                    showChatToggleButton();
                    broadcastFloaterState('floater_closed');
                }
            }, 500);
        } else {
            // Failed to open popup, restore button
            showChatToggleButton();
            broadcastFloaterState('floater_closed');
        }
    }

    function toggleChatWidget(forceOpen) {
        const widget = document.getElementById('chat-widget');
        const btn = document.getElementById('chat-toggle-btn');
        const input = document.getElementById('chat-input');
        
        if (isChatFloaterMode() && window.location.search.includes('chatFloater=1')) {
            widget.classList.add('active');
            widget.style.display = 'flex';
            hideChatToggleButton(); // Hide button when chat is active
            handleChatInput();
            if (input) {
                setTimeout(() => input.focus(), 100);
            }
            return;
        }

        if (widget.classList.contains('active') && !forceOpen) {
            widget.classList.remove('active');
            showChatToggleButton(); // Show button when chat is closed
        } else {
            // Always reset position when opening to ensure it is visible and accessible
            resetChatPosition();
            
            widget.classList.add('active');
            hideChatToggleButton(); // Hide button when chat is opened

            // Mobile-specific input optimization
            if (window.innerWidth <= 768) {
                if (input) {
                    input.setAttribute('inputmode', 'search');
                    input.setAttribute('enterkeyhint', 'send');
                    input.name = 'sop_ai_chat_prompt_unique_id'; // Prevent history
                }
            } else {
                // Reset for desktop
                if (input) {

    document.addEventListener('DOMContentLoaded', function() {
        const widget = document.getElementById('chat-widget');
        const header = widget.querySelector('.chat-header');
        registerMainWindowFloaterCleanupListener();
        applyChatRuntimeSelection();
        
        // Sync chat toggle button visibility based on widget state
        syncChatToggleButtonVisibility();

        }
        if (window.location.search.includes('chatFloater=1')) {
            initializeChatFloaterMode();
        }
        void hydrateRuntimeWelcomeContext();
        let isDragging = false;
        let dragStartX, dragStartY;

        header.addEventListener('mousedown', function(e) {
            // Ignore if clicking controls or select
            if (e.target.closest('.chat-controls') || e.target.closest('select')) return;
            
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            
            // Change cursor style globally to indicate dragging
            document.body.style.cursor = 'move';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;
            
            // Use top/left for positioning
            const rect = widget.getBoundingClientRect();
            let newLeft = rect.left + deltaX;
            let newTop = rect.top + deltaY;
            
            // Constrain to viewport - keep header always visible
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const minVisibleWidth = 100; // Keep at least 100px visible on sides
            const headerHeight = 50; // Approximate header height
            
            // Keep header always visible at top
            newTop = Math.max(0, newTop);
            
            // Keep left edge from going too far right (allow dragging mostly off-screen but keep some visible)
            newLeft = Math.min(newLeft, viewportWidth - minVisibleWidth);
            
            // Keep right edge from going too far left
            newLeft = Math.max(-rect.width + minVisibleWidth, newLeft);
            
            // Keep bottom from going above viewport top (header must be visible)
            newTop = Math.min(newTop, viewportHeight - headerHeight);
            
            widget.style.left = newLeft + 'px';
            widget.style.top = newTop + 'px';
            
            // Clear right/bottom if they exist to avoid conflicts
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
            
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = 'default';
                saveChatState();
            }
        });

        // --- Resize Logic ---
        let isResizing = false;
        let resizeDir = '';
        let resizeStartX, resizeStartY, startWidth, startHeight, startLeft, startTop;

        const handles = widget.querySelectorAll('.resize-handle');
        handles.forEach(handle => {
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation(); // Prevent drag
                e.preventDefault(); // Prevent selection
                isResizing = true;
                resizeDir = handle.getAttribute('data-dir');
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                
                const rect = widget.getBoundingClientRect();
                startWidth = rect.width;
                startHeight = rect.height;
                startLeft = rect.left;
                startTop = rect.top;
                
                document.body.style.cursor = window.getComputedStyle(handle).cursor;
            });
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            e.preventDefault();
            
            const deltaX = e.clientX - resizeStartX;
            const deltaY = e.clientY - resizeStartY;
            const minW = 300;
            const minH = 300;
            
            if (resizeDir.includes('e')) {
                widget.style.width = Math.max(minW, startWidth + deltaX) + 'px';
            }
            if (resizeDir.includes('s')) {
                widget.style.height = Math.max(minH, startHeight + deltaY) + 'px';
            }
            if (resizeDir.includes('w')) {
                let newWidth = startWidth - deltaX;
                let newLeft = startLeft + deltaX;
                
                // Prevent left edge from going off-screen too much
                const minVisibleWidth = 100;
                const maxLeft = window.innerWidth - minVisibleWidth;
                if (newLeft > maxLeft) {
                    newLeft = maxLeft;
                    newWidth = startWidth + (startLeft - maxLeft);
                }
                
                if (newWidth < minW) {
                    newWidth = minW;
                    newLeft = startLeft + startWidth - minW;
                }
                
                widget.style.left = newLeft + 'px';
                widget.style.width = newWidth + 'px';
            }
            if (resizeDir.includes('n')) {
                let newHeight = startHeight - deltaY;
                let newTop = startTop + deltaY;
                
                // Prevent top from going above viewport (keep header visible)
                if (newTop < 0) {
                    newTop = 0;
                    newHeight = startHeight + startTop;
                }
                
                if (newHeight < minH) {
                    newHeight = minH;
                    newTop = startTop + startHeight - minH;
                }
                
                widget.style.top = newTop + 'px';
                widget.style.height = newHeight + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                saveChatState();
            }
        });
    });

    function jsonToCSV(input) {
        try {
            let items;
            if (typeof input === 'string') {
                items = JSON.parse(input);
            } else {
                items = input;
            }

            if (!Array.isArray(items) || items.length === 0) {
                return typeof input === 'string' ? input : JSON.stringify(input);
            }

            // Check if items have the specific SOP 'key'/'value' structure
            const isSopStructure = items.some(item => 
                (item && typeof item === 'object') && ('key' in item || 'value' in item));

            let headers = [];
            let csv = "";

            if (!isSopStructure) {
                // Handle generic JSON array (e.g. Script steps)
                let fields = new Set();
                items.forEach(item => {
                    if (item && typeof item === 'object') {
                        Object.keys(item).forEach(k => fields.add(k));
                    }
                });
                headers = Array.from(fields);
                csv = headers.join(", ") + "\n";
                
                items.forEach(item => {
                    let row = [];
                    headers.forEach(h => {
                        let val = item[h];
                         if (typeof val === 'object' && val !== null) {
                            val = JSON.stringify(val).replace(/"/g, '""'); 
                            val = `"${val}"`;
                        } else if (typeof val === 'string') {
                             if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                                val = val.replace(/"/g, '""');
                                val = `"${val}"`;
                             }
                        } else if (val === undefined || val === null) {
                            val = "";
                        }
                        row.push(val);
                    });
                    csv += row.join(", ") + "\n";
                });
                return csv;
            }

            // Existing SOP Structure Logic
            let keyIsMap = false;
            let valueIsMap = false;
            let keyFields = new Set();
            let valueFields = new Set();

            // Check if all keys are null (e.g. projection query)
            const allKeysNull = items.every(item => item.key == null);
            // Check if all values are null (e.g. key-only query)
            const allValuesNull = items.every(item => item.value == null);

            items.forEach(item => {
                if (typeof item.key === 'object' && item.key !== null) {
                    keyIsMap = true;
                    Object.keys(item.key).forEach(k => keyFields.add(k));
                }
                if (typeof item.value === 'object' && item.value !== null) {
                    valueIsMap = true;
                    Object.keys(item.value).forEach(k => valueFields.add(k));
                }
            });

            // Use Set insertion order (which matches server order), do NOT sort.
            let kFieldsArr = Array.from(keyFields);
            let vFieldsArr = Array.from(valueFields);

            if (keyIsMap) {
                kFieldsArr.forEach(k => headers.push(k.charAt(0).toUpperCase() + k.slice(1)));
            } else if (!allKeysNull) {
                headers.push("Key");
            }

            if (valueIsMap) {
                vFieldsArr.forEach(v => headers.push(v.charAt(0).toUpperCase() + v.slice(1)));
            } else if (!allValuesNull) {
                headers.push("Value");
            }

            csv = headers.join(", ") + "\n";

            items.forEach(item => {
                let row = [];
                if (keyIsMap) {
                    kFieldsArr.forEach(k => {
                        let val = "";
                        if (item.key && typeof item.key === 'object') {
                            val = item.key[k] !== undefined ? item.key[k] : "";
                        }
                        row.push(val);
                    });
                } else if (!allKeysNull) {
                    row.push(item.key !== null && item.key !== undefined ? item.key : "");
                }

                if (valueIsMap) {
                    vFieldsArr.forEach(v => {
                        let val = "";
                        if (item.value && typeof item.value === 'object') {
                            val = item.value[v] !== undefined ? item.value[v] : "";
                        }
                        row.push(val);
                    });
                } else if (!allValuesNull) {
                    row.push(item.value !== null && item.value !== undefined ? item.value : "");
                }
                csv += row.join(", ") + "\n";
            });

            return csv;
        } catch (e) {
            console.error("Failed to convert JSON to CSV", e);
            return typeof input === 'string' ? input : JSON.stringify(input);
        }
    }

    function processMacroTrace(trace, format) {
        let output = "";
        
        trace.forEach((step, index) => {
            if (step.type === 'command') {
                // Optionally show the command being executed
                // output += `> ${step.command}\n`;
                
                if (step.result) {
                    let resultDisplay = step.result;
                    
                    // Handle object/array results (from new streaming logic)
                    let parsedResult = step.result;
                    let isObject = typeof step.result === 'object' && step.result !== null;

                    if (!isObject && typeof step.result === 'string') {
                        try {
                            // Try to parse if it's a string
                            if (step.result.trim().startsWith('[') || step.result.trim().startsWith('{')) {
                                parsedResult = JSON.parse(step.result);
                                isObject = true;
                            }
                        } catch (e) {
                            // Not JSON
                        }
                    }

                    if (format === 'csv') {
                        try {
                            if (isObject && Array.isArray(parsedResult)) {
                                const csv = jsonToCSV(parsedResult);
                                if (csv.includes(',')) {
                                    resultDisplay = csv;
                                }
                            }
                        } catch (e) {
                            console.error(`Step ${index} CSV conversion error:`, e);
                        }
                    } else {
                        // JSON format
                        if (isObject) {
                            resultDisplay = JSON.stringify(parsedResult, null, 2);
                        }
                    }
                    
                    // Ensure we don't print [object Object]
                    if (typeof resultDisplay === 'object') {
                        resultDisplay = JSON.stringify(resultDisplay, null, 2);
                    }

                    output += resultDisplay + "\n";
                }
            } else if (step.type === 'say') {
                output += step.result + "\n";
            } else if (step.type === 'error') {
                output += `Error: ${step.error}\n`;
            } else if (step.type === 'ask') {
                output += `${step.prompt}\n`;
            }
        });
        
        return output.trim();
    }

    function looksLikeLocalCommandListing(text) {
        const normalized = String(text ?? '').trim();
        if (!normalized) {
            return false;
        }

        const match = normalized.match(/^🛠️ Result from local_command:\s*```(?:\r?\n)?([\s\S]*?)```$/);
        if (!match) {
            return false;
        }

        const body = match[1].trim();
        if (!body || body.includes('\n') || body.includes('\r')) {
            return false;
        }

        const tokens = body.split(/\s+/).filter(Boolean);
        if (tokens.length < 3) {
            return false;
        }

        return tokens.every(token => !token.includes('://') && !token.includes('**') && !token.includes('[') && !token.includes(']') && !token.includes('{') && !token.includes('}') && !token.includes('(') && !token.includes(')') && !token.includes(':') && !token.includes('/') && !token.includes('\\') && !token.includes(',') && !token.includes('|') && !token.includes('&'));
    }

    function buildLocalCommandOutputHtml(text) {
        const normalized = String(text ?? '');
        if (!normalized) {
            return '';
        }

        const match = normalized.match(/^🛠️ Result from local_command:\s*```(?:\r?\n)?([\s\S]*?)```$/);
        if (!match) {
            return '';
        }

        const body = match[1].trim();
        if (!body) {
            return '';
        }

        const lines = body.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        if (lines.length === 0) {
            return '';
        }

        const items = lines.flatMap(line => line.split(/\s+/).filter(Boolean));
        if (items.length < 4) {
            return '';
        }

        const maxItemsPerColumn = Math.ceil(items.length / 2);
        const leftColumn = items.slice(0, maxItemsPerColumn);
        const rightColumn = items.slice(maxItemsPerColumn);
        const columnWidth = Math.max(1, Math.ceil(100 / 2));

        const rows = [];
        const rowCount = Math.max(leftColumn.length, rightColumn.length);
        for (let index = 0; index < rowCount; index += 1) {
            const left = leftColumn[index] || '';
            const right = rightColumn[index] || '';
            rows.push(`<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; align-items: start; margin-bottom: 4px;">` +
                `<div style="font-family: var(--chat-font-family); color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(left)}</div>` +
                `<div style="font-family: var(--chat-font-family); color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(right)}</div>` +
                `</div>`);
        }

        return `<div class="chat-command-output-grid" style="display: flex; flex-direction: column; min-width: 0;">${rows.join('')}</div>`;
    }

    function formatDisplayText(text) {
        const normalized = String(text ?? '');
        if (!normalized) {
            return '';
        }

        const twoColumnHtml = buildLocalCommandOutputHtml(normalized);
        if (twoColumnHtml) {
            return twoColumnHtml;
        }

        const match = normalized.match(/^🛠️ Result from local_command:\s*```(?:\r?\n)?([\s\S]*?)```$/);
        if (match) {
            const body = match[1].trim();
            if (body && !body.includes('\n') && !body.includes('\r')) {
                const tokens = body.split(/\s+/).filter(Boolean);
                if (tokens.length >= 3 && tokens.every(token => !token.includes('://') && !token.includes('**') && !token.includes('[') && !token.includes(']') && !token.includes('{') && !token.includes('}') && !token.includes('(') && !token.includes(')') && !token.includes(':') && !token.includes('/') && !token.includes('\\') && !token.includes(',') && !token.includes('|') && !token.includes('&'))) {
                    return normalized.replace(body, tokens.join('\n'));
                }
            }
        }

        return normalized;
    }

    // Code diff view helper
    function detectAndRenderCodeDiff(contentSpan) {
        if (!contentSpan) return;
        
        // Look for consecutive code blocks that might be before/after
        const codeBlocks = contentSpan.querySelectorAll('pre code');
        if (codeBlocks.length < 2) return;
        
        // Detect patterns like "Before:" and "After:" or "Original:" and "Modified:"
        const beforeKeywords = ['before', 'original', 'old', 'current'];
        const afterKeywords = ['after', 'modified', 'new', 'updated', 'fixed'];
        
        for (let i = 0; i < codeBlocks.length - 1; i++) {
            const firstBlock = codeBlocks[i];
            const secondBlock = codeBlocks[i + 1];
            
            // Check if there's text between them indicating before/after
            const textBetween = getTextBetweenElements(firstBlock.parentElement, secondBlock.parentElement);
            const lowerText = textBetween.toLowerCase();
            
            const hasBefore = beforeKeywords.some(kw => lowerText.includes(kw));
            const hasAfter = afterKeywords.some(kw => lowerText.includes(kw));
            
            if (hasBefore && hasAfter) {
                // Create diff view
                createDiffView(firstBlock, secondBlock);
                i++; // Skip next block since we've already processed it
            }
        }
    }
    
    function getTextBetweenElements(elem1, elem2) {
        let text = '';
        let current = elem1.nextSibling;
        while (current && current !== elem2) {
            if (current.nodeType === Node.TEXT_NODE) {
                text += current.textContent;
            } else if (current.textContent) {
                text += current.textContent;
            }
            current = current.nextSibling;
        }
        return text;
    }
    
    function createDiffView(beforeBlock, afterBlock) {
        const beforeCode = beforeBlock.textContent || beforeBlock.innerText;
        const afterCode = afterBlock.textContent || afterBlock.innerText;
        
        // Create diff container
        const diffContainer = document.createElement('div');
        diffContainer.className = 'code-diff-container';
        diffContainer.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden;';
        
        // Before section
        const beforeSection = document.createElement('div');
        beforeSection.className = 'diff-before';
        beforeSection.style.cssText = 'background: var(--pre-bg); padding: 10px; border-right: 1px solid var(--border-color);';
        beforeSection.innerHTML = `
            <div style="font-size: 11px; font-weight: bold; color: #f14c4c; margin-bottom: 5px; text-transform: uppercase;">❌ Before</div>

    async function appendAssistantTextPayload(contentSpan, textPayload) {
        if (!contentSpan || textPayload === undefined || textPayload === null) {
            return;
        }

        let payload = String(textPayload);

        const avatarRegex = /^Avatar\s+([a-zA-Z0-9_-]+)\s+completed task:\s*([\s\S]*)/i;
        const avatarMatch = payload.match(avatarRegex);
        if (avatarMatch && contentSpan) {
            const subAvatarName = avatarMatch[1];
            payload = avatarMatch[2] || (payload.replace(avatarMatch[0], ''));

            const parentDiv = contentSpan.parentElement;
            if (parentDiv && !parentDiv.classList.contains('avatar-handoff-applied')) {
                parentDiv.classList.add('avatar-handoff-applied');
                const badge = document.createElement('div');
                badge.innerHTML = `<span style="display: inline-block; font-size: 0.75rem; background: #6366f1; color: white; padding: 3px 8px; border-radius: 12px; font-weight: bold; margin-bottom: 8px; font-family: monospace; box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);">🔀 Routed to specialised agent: ${subAvatarName}</span>`;
                parentDiv.insertBefore(badge, contentSpan);
                parentDiv.style.borderLeft = "4px solid #6366f1";
            }
        }

        const kbResultsRegex = /===\s*Results from KB:\s*([a-zA-Z0-9_-]+)\s*===/gi;
        if (kbResultsRegex.test(payload) && contentSpan) {
            payload = payload.replace(/===\s*Results from KB:\s*([a-zA-Z0-9_-]+)\s*===/gi,
                '<div style="margin-top: 10px; margin-bottom: 5px; font-size: 0.8rem; background: #10b981; color: white; padding: 3px 8px; border-radius: 4px; display: inline-block; font-weight: bold; font-family: monospace;">📚 Searched Knowledge Base: $1</div>\n'
            );
        }

        const switchDbRegex = /\[\[SWITCH_DATABASE:\s*([a-zA-Z0-9_-]+)\]\]/;
        const match = payload.match(switchDbRegex);

        if (match) {
            const newDbName = match[1];
            if (typeof reloadDatabases === 'function') {
                await reloadDatabases(false);
            }
            await selectDatabase(newDbName, true);

            const dbSelect = document.getElementById('database-select');
            if (dbSelect) dbSelect.value = newDbName;

            const chipLabel = document.getElementById('db-chip-label');
            if (chipLabel) chipLabel.textContent = newDbName;

            const dbObj = availableDatabases.find(d => d.name === newDbName);
            const icon = document.getElementById('db-chip-icon');
            if (icon) {
                icon.style.display = (dbObj && dbObj.is_system) ? 'inline' : 'none';
            }

            payload = payload.replace(match[0], '');
            if (!payload.trim()) {
                payload = `Switched database context to **${newDbName}**.`;
            }
        }

        const refreshSpacesRegex = /\[\[REFRESH_SPACES(?::\s*([^\]]+))?\]\]/;
        const refreshSpacesMatch = payload.match(refreshSpacesRegex);
        if (refreshSpacesMatch) {
            const targetSpaceName = refreshSpacesMatch[1] ? refreshSpacesMatch[1].trim() : currentStore;
            if (typeof refreshSpacesList === 'function' && currentDatabase) {
                await refreshSpacesList(currentDatabase, targetSpaceName);
            } else if (typeof selectDatabase === 'function' && currentDatabase) {
                await selectDatabase(currentDatabase, true, targetSpaceName);
            }
            payload = payload.replace(refreshSpacesRegex, '');
        }

        const clearPendingConfirmationRegex = /\[\[CLEAR_PENDING_CONFIRMATION\]\]/;
        if (clearPendingConfirmationRegex.test(payload)) {
            removePendingConfirmationPrompt();
            payload = payload.replace(clearPendingConfirmationRegex, '');
        }

        const refreshSpaceViewRegex = /\[\[REFRESH_SPACE_VIEW:\s*([a-zA-Z0-9_-]+)\s*\]\]/;
        const refreshSpaceViewMatch = payload.match(refreshSpaceViewRegex);
        if (refreshSpaceViewMatch) {
            const targetSpaceName = refreshSpaceViewMatch[1];
            const activeSpaceName = currentStore ? currentStore.replace('/data', '') : '';
            if (activeSpaceName === targetSpaceName && typeof selectSpace === 'function') {
                const targetLi = Array.from(document.querySelectorAll('#kb-list li')).find(li => li.title === targetSpaceName);
                await selectSpace(targetSpaceName, targetLi || document.querySelector('#sidebar li.active'), true);
            }
            payload = payload.replace(refreshSpaceViewRegex, '');
        }

        contentSpan.innerHTML += renderStreamContent(payload);

        const parentDiv = contentSpan.parentElement;
        if (parentDiv) {
            const accumulatedText = contentSpan.textContent || contentSpan.innerText || '';
            if (isPendingDeleteConfirmationText(accumulatedText)) {
                parentDiv.classList.add('pending-confirmation-message');
            } else {
                parentDiv.classList.remove('pending-confirmation-message');
            }
        }

        const preBlocks = contentSpan.querySelectorAll('pre code.language-json');
        preBlocks.forEach(codeBlock => {
            if (codeBlock.parentElement.nextElementSibling && codeBlock.parentElement.nextElementSibling.classList.contains('import-ai-btn')) {
                return;
            }

            try {
                const jsonText = codeBlock.innerText || codeBlock.textContent;
                const parsed = JSON.parse(jsonText);

                if (parsed && typeof parsed === 'object' && Array.isArray(parsed.categories) && Array.isArray(parsed.items) && !codeBlock.classList.contains('auto-imported')) {
                    codeBlock.classList.add('auto-imported');
                    const buttonContainer = document.createElement('div');
                    buttonContainer.className = 'import-ai-btn';
                    buttonContainer.style.marginTop = '8px';
                    buttonContainer.innerHTML = `<button onclick="window.importParsedSpaceDataFromAI(JSON.parse(this.getAttribute('data-json')))" data-json='${escapeHtml(JSON.stringify(parsed))}'>Import to Space</button>`;
                    codeBlock.parentElement.parentElement.insertBefore(buttonContainer, codeBlock.parentElement.nextElementSibling);
                }
            } catch (e) {
                // Not JSON
            }
        });

        // Detect and render code diffs (before/after comparisons)
        detectAndRenderCodeDiff(contentSpan);

        scrollChatHistoryToBottom();
    }

    function renderTerminalCommandEvent(payload) {
        const terminalOutput = document.getElementById('ai-terminal-output');
        if (!terminalOutput) return false;

        let commandText = '';
        let displayAsCommand = false;

        if (payload && typeof payload === 'object') {
            if (typeof payload.text === 'string') {
                commandText = payload.text;
            }
            displayAsCommand = payload.display_as_command === true || payload.display_as_command === 'true';
        } else if (typeof payload === 'string') {
            commandText = payload;
            displayAsCommand = commandText.startsWith('$ ') || commandText.startsWith('# ');
        }

        commandText = commandText.trim();
        if (!commandText) return false;

        terminalOutput.textContent = commandText;
        terminalOutput.dataset.hasOutput = 'true';
        if (displayAsCommand) {
            terminalOutput.classList.remove('terminal-processing');
        } else {
            terminalOutput.classList.remove('terminal-processing');
        }
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
        return true;
    }

    function renderChatCommandPreview(payload, streamState) {
        clearActiveChatCommandPreview();

        let contentSpan = streamState && streamState.currentContentSpan ? streamState.currentContentSpan : null;
        if (!contentSpan) {
            const block = createAssistantContentBlock();
            if (!block) return false;
            contentSpan = block.contentSpan;
            if (streamState) {
                streamState.currentContentSpan = contentSpan;
            }

        preview.className = 'chat-command-preview is-active';
