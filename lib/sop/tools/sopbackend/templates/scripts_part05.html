{{define "scripts_part05"}}
<script>
    function saveChatState() {
        const widget = document.getElementById('chat-widget');
        if (!widget) return;
        
        const state = {
            width: widget.style.width,
            height: widget.style.height,
            left: widget.style.left,
            top: widget.style.top
        };
        localStorage.setItem('sop_chat_state', JSON.stringify(state));
    }

    function isMobileViewport() {
        return window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    const RUNTIME_SWITCH_ENABLED = {{ .RuntimeSwitchEnabled }};
    const DEFAULT_RUNTIME_MODE = "{{ .DefaultRuntimeMode }}";

    function getUserSubscriptionFeatures() {
        try {
            const stored = localStorage.getItem('sop_subscription_features');
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function hasFeature(featureName) {
        const features = getUserSubscriptionFeatures();
        return features.some(f => String(f).toLowerCase().trim() === featureName.toLowerCase().trim());
    }

    function shouldLocalDaemonOnly() {
        return !RUNTIME_SWITCH_ENABLED;
    }

    function syncRuntimeControlsVisibility() {
        const controls = document.getElementById('chat-runtime-controls');
        if (!controls) return;
        const shouldShow = !shouldLocalDaemonOnly();
        controls.style.display = shouldShow ? 'flex' : 'none';
    }

    function getChatRuntimeMode() {
        const saved = localStorage.getItem('sop_chat_runtime');
        const trimmed = saved ? saved.trim() : '';
        if (shouldLocalDaemonOnly()) {
            return 'local';
        }
        if (trimmed === 'local' || trimmed === 'hq') {
            return trimmed;
        }
        return DEFAULT_RUNTIME_MODE;
    }

    function normalizeDaemonBaseURL(url) {
        const value = (url || '').trim();
        if (!value) {
            return 'http://127.0.0.1:9090';
        }
        return value.replace(/\/$/, '');
    }

    function getDaemonBaseURL() {
        const configured = window.SOP_DAEMON_BASE_URL || localStorage.getItem('sop_daemon_url') || 'http://127.0.0.1:9090';
        const value = normalizeDaemonBaseURL(configured);
        window.SOP_DAEMON_BASE_URL = value;
        return value;
    }

    function setDaemonBaseURL(url) {
        const value = normalizeDaemonBaseURL(url);
        window.SOP_DAEMON_BASE_URL = value;
        localStorage.setItem('sop_daemon_url', value);
        return value;
    }

    function persistChatRuntimeLocalURL() {
        const input = document.getElementById('chat-runtime-local-url');
        if (!input) return;
        setDaemonBaseURL(input.value);
    }

    function setChatRuntimeMode(mode) {
        const runtime = shouldLocalDaemonOnly() ? 'local' : (mode === 'local' ? 'local' : 'hq');
        localStorage.setItem('sop_chat_runtime', runtime);
        const checkbox = document.getElementById('chat-runtime-hq');
        const input = document.getElementById('chat-runtime-local-url');
        const domainSelect = document.getElementById('domain-select');
        const formatSelect = document.getElementById('format-select');
        if (checkbox) checkbox.checked = runtime === 'hq';
        if (input) {
            input.style.display = (!shouldLocalDaemonOnly() || runtime === 'hq') ? 'none' : 'inline-block';
            if (runtime === 'local' && !input.value) {
                input.value = getDaemonBaseURL();
            }
        }
        if (domainSelect) {
            const hasOptions = Array.from(domainSelect.options).some(option => option.value && option.value !== '' && option.getAttribute('data-dynamic') === 'true');
            domainSelect.style.display = hasOptions ? 'inline-block' : 'none';
            if (hasOptions) {
                domainSelect.removeAttribute('aria-hidden');
            } else {
                domainSelect.setAttribute('aria-hidden', 'true');
            }
        }
        if (formatSelect) {
            formatSelect.style.display = 'inline-block';
        }
        updateLocalAgentControls();
        updateChatFloaterButton();
        if (typeof window.syncEnvironmentManagerVisibility === 'function') {
            window.syncEnvironmentManagerVisibility();
        }
        localStorage.removeItem('sop_current_database');
        localStorage.removeItem('sop_current_store');
        if (typeof window !== 'undefined') {
            window.currentDatabase = null;
            window.currentStore = null;
        }

        // Reload dashboard to reflect new runtime
        if (typeof window.reloadDatabases === 'function') {
            window.reloadDatabases(true, runtime).catch(err => {
                console.error('[RuntimeToggle] reloadDatabases failed:', err);
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'position: fixed; top: 10px; right: 10px; background: #f44336; color: white; padding: 12px 20px; border-radius: 4px; z-index: 10000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);';
                errorDiv.textContent = `Runtime switch failed: ${err.message || 'Unknown error'}`;
                document.body.appendChild(errorDiv);
                setTimeout(() => errorDiv.remove(), 4000);
            });
        }

        void requestRuntimeWelcomeContext(runtime);

        return runtime;
    }

    function applyChatRuntimeSelection() {
        const checkbox = document.getElementById('chat-runtime-hq');
        const input = document.getElementById('chat-runtime-local-url');
        const domainSelect = document.getElementById('domain-select');
        const formatSelect = document.getElementById('format-select');
        const runtime = getChatRuntimeMode();
        if (checkbox) checkbox.checked = runtime === 'hq';
        if (input) {
            input.value = getDaemonBaseURL();
            input.style.display = (!shouldLocalDaemonOnly() || runtime === 'hq') ? 'none' : 'inline-block';
        }
        if (domainSelect) {
            const hasOptions = Array.from(domainSelect.options).some(option => option.value && option.value !== '' && option.getAttribute('data-dynamic') === 'true');
            domainSelect.style.display = hasOptions ? 'inline-block' : 'none';
            if (hasOptions) {
                domainSelect.removeAttribute('aria-hidden');
            } else {
                domainSelect.setAttribute('aria-hidden', 'true');
            }
        }
        if (formatSelect) {
            formatSelect.style.display = 'inline-block';
        }
        updateLocalAgentControls();
        updateChatFloaterButton();
        if (typeof window.syncEnvironmentManagerVisibility === 'function') {
            window.syncEnvironmentManagerVisibility();
        }
        return runtime;
    }

    function updateChatFloaterButton() {
        const button = document.getElementById('chat-floater-btn');
        const resetButton = document.getElementById('chat-reset-btn');
        const minimizeButton = document.getElementById('chat-minimize-btn');
        if (!button) return;
        const isFloaterMode = isChatFloaterMode();
        const isLocalRuntime = getChatRuntimeMode() === 'local';
        button.style.display = isFloaterMode ? 'none' : (isLocalRuntime ? 'inline-flex' : 'none');
        button.disabled = false;
        button.title = 'Open AI chat in a floating window';
        button.style.opacity = '1';
        button.textContent = '⧉';
        if (resetButton) {
            resetButton.style.display = isFloaterMode ? 'none' : 'inline-flex';
        }
        if (minimizeButton) {
            minimizeButton.style.display = isFloaterMode ? 'none' : 'inline-flex';
        }
    }

    function getDaemonAskURL() {
        return getDaemonBaseURL().replace(/\/$/, '') + '/api/ask';
    }

    function getDaemonHandoffURL() {
        return getDaemonBaseURL().replace(/\/$/, '') + '/api/handoff';
    }

    async function daemonFetch(endpoint, options = {}) {
        if (window.daemonAuth && typeof window.daemonAuth.request === 'function') {
            return window.daemonAuth.request(endpoint, options);
        }

        return fetch(endpoint, options);
    }

    async function requestRuntimeWelcomeContext(runtimeMode) {
        try {
            if (runtimeMode === 'local') {
                const response = await daemonFetch('/api/handoff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildLocalDaemonHandoffPayload('connect'))
                });
                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    throw new Error(text || 'Unable to connect to local daemon');
                }
                const data = await response.json().catch(() => null);
                if (data && data.welcome_context) {
                    replaceWelcomeContextMessage(data.welcome_context);
                }
                return data;
            }

            const response = await authFetch('/api/ai/test-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider: 'openai', model: 'gpt-4o-mini', handshake: true })
            });
            if (!response.ok) {
                const text = await response.text().catch(() => '');
                throw new Error(text || 'Unable to connect to HQ');
            }
            const data = await response.json().catch(() => null);
            if (data && data.welcome_context) {
                replaceWelcomeContextMessage(data.welcome_context);
            }
            return data;
        } catch (err) {
            console.warn(`[requestRuntimeWelcomeContext] Failed to get welcome context for ${runtimeMode === 'local' ? 'local daemon' : 'HQ'} runtime:`, err.message || err);
            // Don't show error in chat for local daemon - auth failures are handled gracefully
            if (runtimeMode !== 'local') {
                appendChatMessage('ai', `Welcome context unavailable for ${runtimeMode === 'local' ? 'local daemon' : 'HQ'} runtime: ${err.message || 'unknown error'}`);
            }
            return null;
        }
    }

    function replaceWelcomeContextMessage(text) {
        const history = document.getElementById('chat-history');
        if (!history) return;

        history.innerHTML = '';
        currentAiMsgId = null;

        const div = document.createElement('div');
        div.className = 'chat-message ai';
        div.dataset.welcomeContext = 'true';
        div.innerHTML = text.replace(/\n/g, '<br>');
        history.appendChild(div);

        requestAnimationFrame(() => {
            history.scrollTop = history.scrollHeight;
        });
    }

    function clearChatHistory() {
        const history = document.getElementById('chat-history');
        if (!history) return;

        history.innerHTML = '';
        currentAiMsgId = null;

        const input = document.getElementById('chat-input');
        if (input) {
            input.value = '';
        }

        requestAnimationFrame(() => {
            history.scrollTop = 0;
        });
    }

    function getDefaultThinkingLevelForCurrentConfig() {
        const chatAIConfig = typeof getStoredAIConfig === 'function' ? getStoredAIConfig() : {};
        const providerConfig = typeof normalizeProviderConfig === 'function'
            ? normalizeProviderConfig(chatAIConfig.brain_provider || '', chatAIConfig.brain_model || '')
            : { provider: chatAIConfig.brain_provider || '', model: (chatAIConfig.brain_model || '').trim() };

        const provider = (providerConfig.provider || '').trim().toLowerCase();
        const model = (providerConfig.model || '').trim().toLowerCase();
        const normalizedProvider = provider === 'openai' ? 'chatgpt' : provider;

        if (normalizedProvider === 'anthropic') {
            if (model.includes('opus') || model.includes('sonnet')) return 'high';
            if (model.includes('haiku')) return 'medium';
        } else if (normalizedProvider === 'gemini') {
            if (model.includes('flash-lite')) return 'low';
            if (model.includes('flash')) return 'medium';
            if (model.includes('pro')) return 'high';
        } else if (normalizedProvider === 'chatgpt') {
            if (model.includes('mini') || model.includes('nano')) return 'low';
            if (model.includes('pro')) return 'high';
            return 'medium';
        }

        return '';
    }

    function syncChatThinkingMenuSelection(selectedValue) {
        const menu = document.getElementById('chat-thinking-menu');
        if (!menu) return;

        const input = document.getElementById('chat-thinking-select');
        const trigger = document.getElementById('chat-thinking-trigger');
        const currentValue = (selectedValue ?? input?.value ?? '').trim().toLowerCase();
        const resolvedValue = currentValue && currentValue !== 'auto' ? currentValue : getDefaultThinkingLevelForCurrentConfig();

        menu.querySelectorAll('.chat-thinking-option').forEach((button) => {
            const value = (button.getAttribute('data-value') || '').trim().toLowerCase();
            const isActive = value === (resolvedValue || '');
            button.classList.toggle('active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        if (trigger) {
            if (resolvedValue) {
                trigger.title = `Reasoning level: ${resolvedValue}`;
                trigger.setAttribute('data-level', resolvedValue);
            } else {
                trigger.title = 'Reasoning level override';
                trigger.setAttribute('data-level', 'auto');
            }
        }
    }

    function closeChatThinkingMenu() {
        const menu = document.getElementById('chat-thinking-menu');
        if (menu) {
            menu.classList.remove('show');
        }
    }

    function toggleChatThinkingMenu(event) {
        event?.preventDefault();
        event?.stopPropagation();
        const menu = document.getElementById('chat-thinking-menu');
        if (!menu) return;

        const shouldOpen = !menu.classList.contains('show');
        closeChatThinkingMenu();
        if (shouldOpen) {
            syncChatThinkingMenuSelection();
            menu.classList.add('show');
        }

        if (!window.__sopChatThinkingMenuBound) {
            document.addEventListener('click', (clickEvent) => {
                if (!clickEvent.target.closest('.chat-thinking-dropdown')) {
                    closeChatThinkingMenu();
                }
            });
            window.__sopChatThinkingMenuBound = true;
        }
    }

    function selectChatThinkingLevel(value) {
        const input = document.getElementById('chat-thinking-select');
        const trigger = document.getElementById('chat-thinking-trigger');
        if (input) {
            input.value = value || '';
        }
        syncChatThinkingMenuSelection(value || '');
        closeChatThinkingMenu();
        updateComposerState();
    }

    function getSelectedThinkingLevel() {
        const input = document.getElementById('chat-thinking-select');
        const value = (input?.value || '').trim().toLowerCase();
        return value === 'auto' || value === '' ? '' : value;
    }

    function updateComposerState() {
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send-btn');
        if (!sendBtn) return;

        const hasText = (input?.value || '').trim() !== '';
        const isBusy = !!chatAbortController;
        sendBtn.disabled = !isBusy && !hasText;
        sendBtn.title = isBusy ? 'Abort request' : (hasText ? 'Send message' : 'Type a message to send');
        sendBtn.setAttribute('aria-label', isBusy ? 'Abort request' : 'Send message');

        const icon = sendBtn.querySelector('.chat-send-icon');
        if (icon) {
            icon.innerHTML = isBusy
                ? '<path d="M6 6 18 18"></path><path d="M6 18 18 6"></path>'
                : '<path d="M4 12h12"></path><path d="m12 4 8 8-8 8"></path>';
        }
    }

    function buildLocalDaemonHandoffPayload(query) {
        const token = typeof getStoredSessionToken === 'function' ? getStoredSessionToken() : '';
        const refreshToken = typeof getStoredRefreshToken === 'function' ? getStoredRefreshToken() : '';
        const chatAIConfig = typeof getStoredAIConfig === 'function' ? getStoredAIConfig() : {};
        const providerConfig = typeof normalizeProviderConfig === 'function'
            ? normalizeProviderConfig(chatAIConfig.brain_provider || '', chatAIConfig.brain_model || '')
            : { provider: chatAIConfig.brain_provider || '', model: (chatAIConfig.brain_model || '').trim() };
        const provider = providerConfig.provider || '';
        const model = providerConfig.model || '';
        const apiKey = chatAIConfig.brain_api_key || '';
        const baseURL = chatAIConfig.brain_url || '';
        return {
            query: query || 'connect',
            auth: {
                access_token: token,
                refresh_token: refreshToken
            },
            hq: {
                base_url: window.location.origin || 'http://127.0.0.1:3000',
                user_id: currentUserID || '',
                session_id: currentSessionID || ''
            },
            llm_provider: provider,
            llm_api_key: apiKey,
            llm_model: model,
            llm_url: baseURL,
            thinking_level: getSelectedThinkingLevel()
        };
    }

    async function ensureLocalAgentReachable() {
        const response = await daemonFetch('/api/handoff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildLocalDaemonHandoffPayload('connect'))
        });
        if (!response.ok) {
            const text = await response.text().catch(() => '');
            throw new Error(text || 'Local agent is unavailable');
        }
        const data = await response.json().catch(() => null);
        if (data && data.welcome_context && !window.__sopLocalWelcomeShown) {
            window.__sopLocalWelcomeShown = true;
            replaceWelcomeContextMessage(data.welcome_context);
        }
        return true;
    }

    function updateLocalAgentControls() {
        return;
    }

    function resetChatPosition(forceDefault) {
        const widget = document.getElementById('chat-widget');
        if (!widget) return;

        widget.classList.remove('pinned');
        document.body.classList.remove('sop-chat-dashboard-hidden');

        if (isChatFloaterMode() && window.location.search.includes('chatFloater=1')) {
            widget.style.width = '100%';
            widget.style.height = '100%';
            widget.style.left = '0';
            widget.style.top = '0';
            widget.style.right = '0';
            widget.style.bottom = '0';
            widget.style.borderRadius = '0';
            widget.style.margin = '0';
            return;
        }

        const isMobile = isMobileViewport();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        if (isMobile) {
            widget.style.width = '';
            widget.style.height = '';
            widget.style.left = '';
            widget.style.top = '';
            widget.style.right = '';
            widget.style.bottom = '';
            widget.style.borderRadius = '';
            widget.style.margin = '';
            return;
        }

        if (forceDefault) {
            localStorage.removeItem('sop_chat_state');
        }

        if (!forceDefault) {
            const savedStateJson = localStorage.getItem('sop_chat_state');
            if (savedStateJson) {
                try {
                    const state = JSON.parse(savedStateJson);
                    const maxWidth = viewportWidth * 0.9;
                    const maxHeight = viewportHeight * 0.9;
                    const isValidPixelValue = (value) => {
                        if (value === null || value === undefined || value === '') return false;
                        if (typeof value === 'number') return Number.isFinite(value) && value >= 0;
                        const str = String(value).trim();
                        if (!str || /%|vw|vh|em|rem|calc/i.test(str)) return false;
                        return /^-?\d+(?:\.\d+)?(?:px)?$/i.test(str);
                    };
                    const widthNum = parseFloat(state.width);
                    const heightNum = parseFloat(state.height);
                    const leftNum = parseFloat(state.left);
                    const topNum = parseFloat(state.top);
                    const hasValidSavedState = isValidPixelValue(state.width) &&
                        isValidPixelValue(state.height) &&
                        isValidPixelValue(state.left) &&
                        isValidPixelValue(state.top) &&
                        Number.isFinite(widthNum) && Number.isFinite(heightNum) &&
                        Number.isFinite(leftNum) && Number.isFinite(topNum) &&
                        widthNum < maxWidth && heightNum < maxHeight;

                    if (hasValidSavedState) {
                        widget.style.width = state.width;
                        widget.style.height = state.height;
                        widget.style.left = state.left;
                        widget.style.top = state.top;
                        widget.style.right = 'auto';
                        widget.style.bottom = 'auto';

                        const rect = widget.getBoundingClientRect();
                        if (rect.left > viewportWidth - 50) widget.style.left = (viewportWidth - rect.width - 20) + 'px';
                        if (rect.top > viewportHeight - 50) widget.style.top = (viewportHeight - rect.height - 20) + 'px';

                        return;
                    }

                    localStorage.removeItem('sop_chat_state');
                } catch (e) {
                    console.error('Failed to load chat state', e);
                    localStorage.removeItem('sop_chat_state');
                }
            }
        }

        const width = 550;
        const height = 555;
        widget.style.width = width + 'px';
        widget.style.height = height + 'px';
        widget.style.left = '57px';
        widget.style.top = (viewportHeight - height + 2) + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
        widget.style.borderRadius = '8px';
        widget.style.margin = '';
    }

    // Handle resize events to adjust chat position if needed
    window.addEventListener('resize', function() {
        const widget = document.getElementById('chat-widget');
        if (widget && widget.classList.contains('active')) {
            resetChatPosition();
        }
    });

    function setDashboardVisibility(visible) {
        document.body.classList.toggle('sop-chat-dashboard-hidden', !visible);
    }

    function handleChatInput(event) {
        const input = event && event.target ? event.target : document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send-btn');
        const value = input && typeof input.value === 'string' ? input.value : '';
        if (sendBtn) {
            sendBtn.disabled = value.trim() === '';
        }
    }

    function isChatFloaterMode() {
        const params = new URLSearchParams(window.location.search);
        return params.get('chatOnly') === '1' || params.get('chatFloater') === '1';
    }

    function requestMainWindowRefreshOnClose() {
        const cleanupSignal = 'sop_chat_floater_cleanup';
        const persistCleanupSignal = () => {
            try {
                localStorage.setItem(cleanupSignal, String(Date.now()));
            } catch (err) {
                console.warn('[chatFloater] Unable to persist the cleanup signal:', err);
            }
        };

        const cleanupAndRefresh = () => {
            persistCleanupSignal();
        };

        window.addEventListener('pagehide', cleanupAndRefresh);
        window.addEventListener('beforeunload', cleanupAndRefresh);
    }

    function registerMainWindowFloaterCleanupListener() {
        const cleanupSignal = 'sop_chat_floater_cleanup';
        window.addEventListener('storage', (event) => {
            if (event.key !== cleanupSignal || !event.newValue) {
                return;
            }
            try {
                localStorage.removeItem(cleanupSignal);
            } catch (err) {
                console.warn('[chatFloater] Unable to clear the cleanup signal:', err);
            }
            window.location.reload();
        });
    }

    function initializeChatFloaterMode() {
        if (!isChatFloaterMode()) {
            return;
        }

        if (window.location.search.includes('chatFloater=1')) {
            requestMainWindowRefreshOnClose();
            document.body.classList.add('sop-chat-floater-mode');
            setTimeout(() => {
                applyChatRuntimeSelection();
                toggleChatWidget(true);
                resetChatPosition();
                handleChatInput();
                void hydrateRuntimeWelcomeContext();
            }, 150);
        }
    }

    async function openChatPiP() {
        if (getChatRuntimeMode() !== 'local') {
            console.warn('[openChatPiP] Floater is only available in local runtime');
            return;
        }

        const widget = document.getElementById('chat-widget');
        if (widget) {
            widget.classList.remove('active');
            widget.style.display = 'none';
        }

        const floaterUrl = new URL('/app', window.location.origin);
        floaterUrl.searchParams.set('chatFloater', '1');

        if (window && window.documentPictureInPicture && typeof window.documentPictureInPicture.requestWindow === 'function') {
            try {
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 420,
                    height: 650
                });
                const targetDocument = pipWindow.document;
                targetDocument.open();
                targetDocument.write(`<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>SOP AI Chat</title><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1f1f1f;overflow:hidden;}iframe{border:0;width:100%;height:100%;}</style></head><body><iframe src="${floaterUrl.toString()}" allow="clipboard-write"></iframe></body></html>`);
                targetDocument.close();
                return;
            } catch (err) {
                console.warn('[openChatPiP] PiP failed, falling back to the current tab:', err);
            }
        }

        console.warn('[openChatPiP] Opening the chat route in a fresh tab instead.');
        window.open(floaterUrl.toString(), '_blank', 'noopener,noreferrer');
    }

    function handleChatMinimize() {
        toggleChatWidget();
    }

    function toggleChatWidget(forceOpen) {
        const widget = document.getElementById('chat-widget');
        const btn = document.getElementById('chat-toggle-btn');
        const input = document.getElementById('chat-input');
        
        if (isChatFloaterMode() && window.location.search.includes('chatFloater=1')) {
            widget.classList.add('active');
            widget.style.display = 'flex';
            handleChatInput();
            if (input) {
                setTimeout(() => input.focus(), 100);
            }
            return;
        }

        if (widget.classList.contains('active') && !forceOpen) {
            widget.classList.remove('active');
        } else {
            // Always reset position when opening to ensure it is visible and accessible
            resetChatPosition();
            
            widget.classList.add('active');

            // Mobile-specific input optimization
            if (window.innerWidth <= 768) {
                if (input) {
                    input.setAttribute('inputmode', 'search');
                    input.setAttribute('enterkeyhint', 'send');
                    input.name = 'sop_ai_chat_prompt_unique_id'; // Prevent history
                }
            } else {
                // Reset for desktop
                if (input) {
                    input.removeAttribute('inputmode');
                    input.removeAttribute('enterkeyhint');
                    input.name = 'sop_ai_chat_prompt';
                }
            }

            // Focus input when opening
            handleChatInput();
            setTimeout(() => input.focus(), 100);
        }
    }

    async function hydrateRuntimeWelcomeContext() {
        const runtime = applyChatRuntimeSelection();
        const history = document.getElementById('chat-history');
        const hasWelcome = history && Array.from(history.children).some(el => el.dataset && el.dataset.welcomeContext === 'true');
        if (!hasWelcome) {
            await requestRuntimeWelcomeContext(runtime);
        }
    }

    // --- Draggable Chat Widget Logic ---
    document.addEventListener('DOMContentLoaded', function() {
        const widget = document.getElementById('chat-widget');
        const header = widget.querySelector('.chat-header');
        registerMainWindowFloaterCleanupListener();

        header.addEventListener('mousedown', function(e) {
            // Ignore if clicking controls or select
            if (e.target.closest('.chat-controls') || e.target.closest('select')) return;
            
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            
            // Change cursor style globally to indicate dragging
            document.body.style.cursor = 'move';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;
            
            // Use top/left for positioning
            const rect = widget.getBoundingClientRect();
            widget.style.left = (rect.left + deltaX) + 'px';
            widget.style.top = (rect.top + deltaY) + 'px';
            
            // Clear right/bottom if they exist to avoid conflicts
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
            
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = 'default';
                saveChatState();
            }
        });

        // --- Resize Logic ---
        let isResizing = false;
        let resizeDir = '';
        let resizeStartX, resizeStartY, startWidth, startHeight, startLeft, startTop;

        const handles = widget.querySelectorAll('.resize-handle');
        handles.forEach(handle => {
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation(); // Prevent drag
                e.preventDefault(); // Prevent selection
                isResizing = true;
                resizeDir = handle.getAttribute('data-dir');
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                
                const rect = widget.getBoundingClientRect();
                startWidth = rect.width;
                startHeight = rect.height;
                startLeft = rect.left;
                startTop = rect.top;
                
                document.body.style.cursor = window.getComputedStyle(handle).cursor;
            });
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            e.preventDefault();
            
            const deltaX = e.clientX - resizeStartX;
            const deltaY = e.clientY - resizeStartY;
            const minW = 300;
            const minH = 300;
            
            if (resizeDir.includes('e')) {
                widget.style.width = Math.max(minW, startWidth + deltaX) + 'px';
            }
            if (resizeDir.includes('s')) {
                widget.style.height = Math.max(minH, startHeight + deltaY) + 'px';
            }
            if (resizeDir.includes('w')) {
                let newWidth = startWidth - deltaX;
                if (newWidth < minW) {
                    newWidth = minW;
                    widget.style.left = (startLeft + startWidth - minW) + 'px';
                } else {
                    widget.style.left = (startLeft + deltaX) + 'px';
                }
                widget.style.width = newWidth + 'px';
            }
            if (resizeDir.includes('n')) {
                let newHeight = startHeight - deltaY;
                if (newHeight < minH) {
                    newHeight = minH;
                    widget.style.top = (startTop + startHeight - minH) + 'px';
                } else {
                    widget.style.top = (startTop + deltaY) + 'px';
                }
                widget.style.height = newHeight + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                saveChatState();
            }
        });
    });

    function jsonToCSV(input) {
        try {
            let items;
            if (typeof input === 'string') {
                items = JSON.parse(input);
            } else {
                items = input;
            }

            if (!Array.isArray(items) || items.length === 0) {
                return typeof input === 'string' ? input : JSON.stringify(input);
            }

            // Check if items have the specific SOP 'key'/'value' structure
            const isSopStructure = items.some(item => 
                (item && typeof item === 'object') && ('key' in item || 'value' in item));

            let headers = [];
            let csv = "";

            if (!isSopStructure) {
                // Handle generic JSON array (e.g. Script steps)
                let fields = new Set();
                items.forEach(item => {
                    if (item && typeof item === 'object') {
                        Object.keys(item).forEach(k => fields.add(k));
                    }
                });
                headers = Array.from(fields);
                csv = headers.join(", ") + "\n";
                
                items.forEach(item => {
                    let row = [];
                    headers.forEach(h => {
                        let val = item[h];
                         if (typeof val === 'object' && val !== null) {
                            val = JSON.stringify(val).replace(/"/g, '""'); 
                            val = `"${val}"`;
                        } else if (typeof val === 'string') {
                             if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                                val = val.replace(/"/g, '""');
                                val = `"${val}"`;
                             }
                        } else if (val === undefined || val === null) {
                            val = "";
                        }
                        row.push(val);
                    });
                    csv += row.join(", ") + "\n";
                });
                return csv;
            }

            // Existing SOP Structure Logic
            let keyIsMap = false;
            let valueIsMap = false;
            let keyFields = new Set();
            let valueFields = new Set();

            // Check if all keys are null (e.g. projection query)
            const allKeysNull = items.every(item => item.key == null);
            // Check if all values are null (e.g. key-only query)
            const allValuesNull = items.every(item => item.value == null);

            items.forEach(item => {
                if (typeof item.key === 'object' && item.key !== null) {
                    keyIsMap = true;
                    Object.keys(item.key).forEach(k => keyFields.add(k));
                }
                if (typeof item.value === 'object' && item.value !== null) {
                    valueIsMap = true;
                    Object.keys(item.value).forEach(k => valueFields.add(k));
                }
            });

            // Use Set insertion order (which matches server order), do NOT sort.
            let kFieldsArr = Array.from(keyFields);
            let vFieldsArr = Array.from(valueFields);

            if (keyIsMap) {
                kFieldsArr.forEach(k => headers.push(k.charAt(0).toUpperCase() + k.slice(1)));
            } else if (!allKeysNull) {
                headers.push("Key");
            }

            if (valueIsMap) {
                vFieldsArr.forEach(v => headers.push(v.charAt(0).toUpperCase() + v.slice(1)));
            } else if (!allValuesNull) {
                headers.push("Value");
            }

            csv = headers.join(", ") + "\n";

            items.forEach(item => {
                let row = [];
                if (keyIsMap) {
                    kFieldsArr.forEach(k => {
                        let val = "";
                        if (item.key && typeof item.key === 'object') {
                            val = item.key[k] !== undefined ? item.key[k] : "";
                        }
                        row.push(val);
                    });
                } else if (!allKeysNull) {
                    row.push(item.key !== null && item.key !== undefined ? item.key : "");
                }

                if (valueIsMap) {
                    vFieldsArr.forEach(v => {
                        let val = "";
                        if (item.value && typeof item.value === 'object') {
                            val = item.value[v] !== undefined ? item.value[v] : "";
                        }
                        row.push(val);
                    });
                } else if (!allValuesNull) {
                    row.push(item.value !== null && item.value !== undefined ? item.value : "");
                }
                csv += row.join(", ") + "\n";
            });

            return csv;
        } catch (e) {
            console.error("Failed to convert JSON to CSV", e);
            return typeof input === 'string' ? input : JSON.stringify(input);
        }
    }

    function processMacroTrace(trace, format) {
        let output = "";
        
        trace.forEach((step, index) => {
            if (step.type === 'command') {
                // Optionally show the command being executed
                // output += `> ${step.command}\n`;
                
                if (step.result) {
                    let resultDisplay = step.result;
                    
                    // Handle object/array results (from new streaming logic)
                    let parsedResult = step.result;
                    let isObject = typeof step.result === 'object' && step.result !== null;

                    if (!isObject && typeof step.result === 'string') {
                        try {
                            // Try to parse if it's a string
                            if (step.result.trim().startsWith('[') || step.result.trim().startsWith('{')) {
                                parsedResult = JSON.parse(step.result);
                                isObject = true;
                            }
                        } catch (e) {
                            // Not JSON
                        }
                    }

                    if (format === 'csv') {
                        try {
                            if (isObject && Array.isArray(parsedResult)) {
                                const csv = jsonToCSV(parsedResult);
                                if (csv.includes(',')) {
                                    resultDisplay = csv;
                                }
                            }
                        } catch (e) {
                            console.error(`Step ${index} CSV conversion error:`, e);
                        }
                    } else {
                        // JSON format
                        if (isObject) {
                            resultDisplay = JSON.stringify(parsedResult, null, 2);
                        }
                    }
                    
                    // Ensure we don't print [object Object]
                    if (typeof resultDisplay === 'object') {
                        resultDisplay = JSON.stringify(resultDisplay, null, 2);
                    }

                    output += resultDisplay + "\n";
                }
            } else if (step.type === 'say') {
                output += step.result + "\n";
            } else if (step.type === 'error') {
                output += `Error: ${step.error}\n`;
            } else if (step.type === 'ask') {
                output += `${step.prompt}\n`;
            }
        });
        
        return output.trim();
    }

    async function appendAssistantTextPayload(contentSpan, textPayload) {
        if (!contentSpan || textPayload === undefined || textPayload === null) {
            return;
        }

        let payload = String(textPayload);

        const avatarRegex = /^Avatar\s+([a-zA-Z0-9_-]+)\s+completed task:\s*([\s\S]*)/i;
        const avatarMatch = payload.match(avatarRegex);
        if (avatarMatch && contentSpan) {
            const subAvatarName = avatarMatch[1];
            payload = avatarMatch[2] || (payload.replace(avatarMatch[0], ''));

            const parentDiv = contentSpan.parentElement;
            if (parentDiv && !parentDiv.classList.contains('avatar-handoff-applied')) {
                parentDiv.classList.add('avatar-handoff-applied');
                const badge = document.createElement('div');
                badge.innerHTML = `<span style="display: inline-block; font-size: 0.75rem; background: #6366f1; color: white; padding: 3px 8px; border-radius: 12px; font-weight: bold; margin-bottom: 8px; font-family: monospace; box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);">🔀 Routed to specialised agent: ${subAvatarName}</span>`;
                parentDiv.insertBefore(badge, contentSpan);
                parentDiv.style.borderLeft = "4px solid #6366f1";
            }
        }

        const kbResultsRegex = /===\s*Results from KB:\s*([a-zA-Z0-9_-]+)\s*===/gi;
        if (kbResultsRegex.test(payload) && contentSpan) {
            payload = payload.replace(/===\s*Results from KB:\s*([a-zA-Z0-9_-]+)\s*===/gi,
                '<div style="margin-top: 10px; margin-bottom: 5px; font-size: 0.8rem; background: #10b981; color: white; padding: 3px 8px; border-radius: 4px; display: inline-block; font-weight: bold; font-family: monospace;">📚 Searched Knowledge Base: $1</div>\n'
            );
        }

        const switchDbRegex = /\[\[SWITCH_DATABASE:\s*([a-zA-Z0-9_-]+)\]\]/;
        const match = payload.match(switchDbRegex);

        if (match) {
            const newDbName = match[1];
            if (typeof reloadDatabases === 'function') {
                await reloadDatabases(false);
            }
            await selectDatabase(newDbName, true);

            const dbSelect = document.getElementById('database-select');
            if (dbSelect) dbSelect.value = newDbName;

            const chipLabel = document.getElementById('db-chip-label');
            if (chipLabel) chipLabel.textContent = newDbName;

            const dbObj = availableDatabases.find(d => d.name === newDbName);
            const icon = document.getElementById('db-chip-icon');
            if (icon) {
                icon.style.display = (dbObj && dbObj.is_system) ? 'inline' : 'none';
            }

            payload = payload.replace(match[0], '');
            if (!payload.trim()) {
                payload = `Switched database context to **${newDbName}**.`;
            }
        }

        const refreshSpacesRegex = /\[\[REFRESH_SPACES(?::\s*([^\]]+))?\]\]/;
        const refreshSpacesMatch = payload.match(refreshSpacesRegex);
        if (refreshSpacesMatch) {
            const targetSpaceName = refreshSpacesMatch[1] ? refreshSpacesMatch[1].trim() : currentStore;
            if (typeof refreshSpacesList === 'function' && currentDatabase) {
                await refreshSpacesList(currentDatabase, targetSpaceName);
            } else if (typeof selectDatabase === 'function' && currentDatabase) {
                await selectDatabase(currentDatabase, true, targetSpaceName);
            }
            payload = payload.replace(refreshSpacesRegex, '');
        }

        const clearPendingConfirmationRegex = /\[\[CLEAR_PENDING_CONFIRMATION\]\]/;
        if (clearPendingConfirmationRegex.test(payload)) {
            removePendingConfirmationPrompt();
            payload = payload.replace(clearPendingConfirmationRegex, '');
        }

        const refreshSpaceViewRegex = /\[\[REFRESH_SPACE_VIEW:\s*([a-zA-Z0-9_-]+)\s*\]\]/;
        const refreshSpaceViewMatch = payload.match(refreshSpaceViewRegex);
        if (refreshSpaceViewMatch) {
            const targetSpaceName = refreshSpaceViewMatch[1];
            const activeSpaceName = currentStore ? currentStore.replace('/data', '') : '';
            if (activeSpaceName === targetSpaceName && typeof selectSpace === 'function') {
                const targetLi = Array.from(document.querySelectorAll('#kb-list li')).find(li => li.title === targetSpaceName);
                await selectSpace(targetSpaceName, targetLi || document.querySelector('#sidebar li.active'), true);
            }
            payload = payload.replace(refreshSpaceViewRegex, '');
        }

        contentSpan.innerHTML += renderStreamContent(payload);

        const parentDiv = contentSpan.parentElement;
        if (parentDiv) {
            const accumulatedText = contentSpan.textContent || contentSpan.innerText || '';
            if (isPendingDeleteConfirmationText(accumulatedText)) {
                parentDiv.classList.add('pending-confirmation-message');
            } else {
                parentDiv.classList.remove('pending-confirmation-message');
            }
        }

        const preBlocks = contentSpan.querySelectorAll('pre code.language-json');
        preBlocks.forEach(codeBlock => {
            if (codeBlock.parentElement.nextElementSibling && codeBlock.parentElement.nextElementSibling.classList.contains('import-ai-btn')) {
                return;
            }

            try {
                const jsonText = codeBlock.innerText || codeBlock.textContent;
                const parsed = JSON.parse(jsonText);

                if (parsed && typeof parsed === 'object' && Array.isArray(parsed.categories) && Array.isArray(parsed.items) && !codeBlock.classList.contains('auto-imported')) {
                    codeBlock.classList.add('auto-imported');
                    const buttonContainer = document.createElement('div');
                    buttonContainer.className = 'import-ai-btn';
                    buttonContainer.style.marginTop = '8px';
                    buttonContainer.innerHTML = `<button onclick="window.importParsedSpaceDataFromAI(JSON.parse(this.getAttribute('data-json')))" data-json='${escapeHtml(JSON.stringify(parsed))}'>Import to Space</button>`;
                    codeBlock.parentElement.parentElement.insertBefore(buttonContainer, codeBlock.parentElement.nextElementSibling);
                }
            } catch (e) {
                // Not JSON
            }
        });

        scrollChatHistoryToBottom();
    }

    async function renderStreamEvent(event, streamState) {
        if (!streamState) {
            return;
        }

        if (event === null || event === undefined) {
            return;
        }

        const normalizedEvent = { ...event };
        if (normalizedEvent.payload === undefined) {
            if (normalizedEvent.record !== undefined) normalizedEvent.payload = normalizedEvent.record;
            else if (normalizedEvent.result !== undefined) normalizedEvent.payload = normalizedEvent.result;
        }

        if (normalizedEvent.type === 'result') {
            normalizedEvent.type = 'content';
        }

        let handled = false;
        const flushRecords = () => {
            if (streamState.currentTableRecords.length > 0) {
                renderDataResults(streamState.currentTableRecords, streamState.format, streamState.currentTableType);
                streamState.currentTableRecords = [];
                streamState.currentContentSpan = null;
                scrollChatHistoryToBottom();
            }
        };

        if (normalizedEvent.type === 'content') {
            handled = true;
            flushRecords();
            if (!streamState.currentContentSpan) {
                const block = createAssistantContentBlock();
                if (block) {
                    streamState.currentContentSpan = block.contentSpan;
                }
            }
            const textPayload = String(normalizedEvent.payload ?? '');
            if (textPayload) {
                await appendAssistantTextPayload(streamState.currentContentSpan, textPayload);
            }
        } else if (normalizedEvent.type === 'record' || normalizedEvent.type === 'kv') {
            handled = true;
            streamState.currentTableRecords.push(normalizedEvent.payload);
            streamState.currentTableType = normalizedEvent.type;
        } else if (normalizedEvent.type === 'result_stream') {
            handled = true;
            flushRecords();
            streamState.currentContentSpan = null;
        } else if (normalizedEvent.type === 'tool_call') {
            handled = true;
        } else if (normalizedEvent.type === 'tool_error') {
            handled = true;
            const fallbackText = typeof normalizedEvent.payload === 'string'
                ? normalizedEvent.payload
                : (normalizedEvent.payload && normalizedEvent.payload.error ? String(normalizedEvent.payload.error) : JSON.stringify(normalizedEvent.payload, null, 2));
            if (fallbackText) {
                const fallbackSpan = ensureAssistantContentBlock();
                await appendAssistantTextPayload(fallbackSpan, fallbackText);
            }
        } else if (normalizedEvent.type === 'action_required') {
            handled = true;
            flushRecords();
            try {
                const result = await showActionApprovalModal(normalizedEvent.payload);
                if (result.approved) {
                    await executeApprovedAction(result.payload, result.autoApproved, result.executionMode || 'background');
                } else {
                    appendChatMessage('ai', '❌ Action denied by user.');
                }
            } catch (err) {
                console.error('[UI approval] approval modal error', err);
                appendChatMessage('ai', `⚠️ Approval process failed: ${err.message}`);
            }
        }

        if (!handled && normalizedEvent.type !== 'message' && normalizedEvent.payload !== undefined) {
            const fallbackText = typeof normalizedEvent.payload === 'string' ? normalizedEvent.payload : JSON.stringify(normalizedEvent.payload, null, 2);
            if (fallbackText) {
                const fallbackSpan = ensureAssistantContentBlock();
                await appendAssistantTextPayload(fallbackSpan, fallbackText);
            }
        }
    }

    function streamChatText(role, text, options = {}) {
        const history = document.getElementById('chat-history');
        if (!history) return null;

        const normalized = String(text ?? '');
        if (!normalized) {
            return null;
        }

        const container = document.createElement('div');
        container.className = `chat-message ${role}`;
        const msgId = 'msg-' + generateUUID();
        container.id = msgId;
        if (role === 'ai') currentAiMsgId = msgId;

        const contentEl = document.createElement('div');
        contentEl.style.whiteSpace = 'pre-wrap';
        contentEl.style.wordBreak = 'break-word';
        container.appendChild(contentEl);
        history.appendChild(container);
        pruneChatHistory();
        history.scrollTop = history.scrollHeight;

        const chunkSize = options.chunkSize || 140;
        const delayMs = options.delayMs || 18;
        const chunks = [];
        let start = 0;
        while (start < normalized.length) {
            let end = Math.min(start + chunkSize, normalized.length);
            if (end < normalized.length) {
                const newlineBoundary = normalized.lastIndexOf('\n', end);
                if (newlineBoundary > start) {
                    end = newlineBoundary;
                } else {
                    const spaceBoundary = normalized.lastIndexOf(' ', end);
                    if (spaceBoundary > start + Math.floor(chunkSize / 2)) {
                        end = spaceBoundary;
                    }
                }
            }
            chunks.push(normalized.slice(start, end));
            start = end;
        }

        let index = 0;
        const renderNextChunk = () => {
            if (index >= chunks.length) {
                return;
            }
            contentEl.textContent += chunks[index++];
            history.scrollTop = history.scrollHeight;
            if (index < chunks.length) {
                window.setTimeout(renderNextChunk, delayMs);
            }
        };

        renderNextChunk();
        return msgId;
    }

    function buildRuntimeRequestConfig(message, runtimeMode, options = {}) {
        const chatAIConfig = getStoredAIConfig();
        const provider = buildProviderValue(chatAIConfig.brain_provider, chatAIConfig.brain_model);
        const formatSelect = document.getElementById('format-select');
        const format = formatSelect ? formatSelect.value : 'csv';
        const domainSelect = document.getElementById('domain-select');
        const domain = domainSelect ? domainSelect.value : '';
        let payloadDomain = domain;
        if (domain === 'custom' && window.customKBs && window.customKBs.length > 0) {
            payloadDomain = window.customKBs.join(',');
        }

        if (runtimeMode === 'local') {
            return {
                endpoint: '/api/ask',
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: message,
                    ...buildLocalDaemonHandoffPayload(message)
                }),
                fetcher: daemonFetch,
                runtimeMode: 'local'
            };
        }

        return {
            endpoint: '/api/ai/chat',
            method: 'POST',
            headers: applyAIConfigHeaders({ 'Content-Type': 'application/json' }, chatAIConfig),
            body: JSON.stringify({
                message: message,
                database: currentDatabase,
                store: currentStore,
                agent: options.agent || 'db_admin',
                provider: provider,
                format: format,
                runtime: runtimeMode,
                verbose: true,
                session_id: currentSessionID,
                user_id: currentUserID,
                domain: payloadDomain,
                thinking_level: getSelectedThinkingLevel()
            }),
            fetcher: authFetch,
            runtimeMode: 'hq'
        };
    }

    async function executeRuntimeRequest(message, runtimeMode, options = {}) {
        const runtimeRequest = buildRuntimeRequestConfig(message, runtimeMode, options);
        const response = await runtimeRequest.fetcher(runtimeRequest.endpoint, {
            method: runtimeRequest.method,
            headers: runtimeRequest.headers,
            body: runtimeRequest.body,
            signal: options.signal
        });
        return { response, runtimeMode: runtimeRequest.runtimeMode };
    }

    async function handleRuntimeResponse(response, loadingId, runtimeMode) {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        if (!response.ok) {
            const text = await response.text();
            appendChatMessage('ai', `${runtimeMode === 'local' ? 'Local RAG' : 'HTTP'} Error: ${response.status} - ${text}`);
            return false;
        }

        const formatSelect = document.getElementById('format-select');
        const format = formatSelect ? formatSelect.value : 'csv';

        if (runtimeMode === 'local') {
            const responseText = await response.text();
            let data;
            try {
                data = JSON.parse(responseText);
            } catch (parseErr) {
                console.error('[UI runtime response] failed to parse local JSON', parseErr, responseText);
                appendChatMessage('ai', 'Local RAG Error: invalid JSON response.');
                return false;
            }
            const streamState = {
                format,
                currentContentSpan: null,
                currentTableRecords: [],
                currentTableType: null
            };
            await renderStreamEvent({ type: 'content', payload: data.answer || data.error || 'No response from local RAG.' }, streamState);
            return true;
        }

        if (!response.body) {
            console.error('[AI stream] response body is null; stream will not start');
            appendChatMessage('ai', 'Stream start failed: response body is unavailable.');
            return false;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const streamState = {
            format,
            currentContentSpan: null,
            currentTableRecords: [],
            currentTableType: null
        };
        let pendingChunk = '';
        const yieldToBrowser = () => new Promise(resolve => requestAnimationFrame(() => resolve()));

        while (true) {
            const { done, value } = await reader.read();
            if (done) {
                break;
            }

            const chunk = pendingChunk + decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');
            pendingChunk = lines.pop() || '';

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                try {
                    const event = (() => {
                        try {
                            return JSON.parse(trimmed);
                        } catch (parseErr) {
                            const start = Math.min(trimmed.indexOf('{'), trimmed.indexOf('['));
                            if (start >= 0) {
                                const candidate = trimmed.slice(start);
                                try {
                                    return JSON.parse(candidate);
                                } catch (candidateErr) {
                                    throw parseErr;
                                }
                            }
                            throw parseErr;
                        }
                    })();

                    if (event.payload === undefined) {
                        if (event.record !== undefined) event.payload = event.record;
                        else if (event.result !== undefined) event.payload = event.result;
                    }

                    if (event.type === 'result') {
                        event.type = 'content';
                    }

                    await renderStreamEvent(event, streamState);
                } catch (parseErr) {
                    console.warn('[UI runtime response] failed to parse event line', parseErr, trimmed);
                }
            }
        }

        return true;
    }

    async function sendChatMessage() {
        updateHeaderFeedbackVisibility(false);
        currentAiMsgId = null;
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send-btn');
        
        // Check if we are in "Stop" mode
        if (chatAbortController) {
            chatAbortController.abort();
            chatAbortController = null;
            updateComposerState();
            appendChatMessage('ai', 'Request cancelled by user.');
            return;
        }

        const message = input.value.trim();
        const agentSelect = document.getElementById('agent-select');
        const agent = agentSelect ? agentSelect.value : 'db_admin';

        if (!message) return;

        if (/^\/clear(?:\s|$)/i.test(message)) {
            clearChatHistory();
            return;
        }

        if (/^(yes|no)$/i.test(message) && findLatestPendingConfirmationMessage()) {
            removePendingConfirmationPrompt();
        }

        // Save to history
        chatHistory.push(message);
        historyIndex = -1; // Reset index

        // Add User Message
        appendChatMessage('user', message);
        input.value = '';
        input.style.height = '40px'; 
        if (sendBtn) sendBtn.disabled = true;
        
        // Show Loading
        const loadingId = appendChatMessage('ai', 'Thinking...');
        // Setup AbortController
        chatAbortController = new AbortController();
        updateComposerState();

        try {
            const runtimeMode = getChatRuntimeMode();
            if (runtimeMode === 'local') {
                try {
                    await ensureLocalAgentReachable();
                } catch (err) {
                    const loadingEl = document.getElementById(loadingId);
                    if (loadingEl) loadingEl.remove();
                    appendChatMessage('ai', 'Local agent unavailable: ' + (err.message || 'unknown error'));
                    return;
                }
                console.debug('[UI runtime adapter] sending local request', {
                    runtimeMode
                });
            }

            const { response, runtimeMode: resolvedRuntimeMode } = await executeRuntimeRequest(message, runtimeMode, {
                agent,
                signal: chatAbortController.signal
            });

            if (resolvedRuntimeMode === 'local') {
                console.debug('[UI local daemon] received response', {
                    ok: response.ok,
                    status: response.status,
                    contentType: response.headers.get('content-type')
                });
            }

            if (resolvedRuntimeMode === 'local') {
                await handleRuntimeResponse(response, loadingId, 'local');
            } else {
                await handleRuntimeResponse(response, loadingId, 'hq');
            }
            return;

        } catch (err) {
             const loadingEl = document.getElementById(loadingId);
             if (loadingEl) loadingEl.remove();

             if (err.name === 'AbortError') {
                 // Ignore
             } else {
                 appendChatMessage('ai', 'Error: ' + err.message);
             }
        } finally {
             chatAbortController = null;
             updateComposerState();
             if (currentAiMsgId) {
                 updateHeaderFeedbackVisibility(true);
             }
        }
    }

    let _currentApprovalPayload = null;
    let _currentApprovalResolve = null;
    let _currentApprovalReject = null;
    let _sessionApprovals = {}; // Track auto-approvals: { action_type: true }

    function isSessionApproved(actionType) {
        return _sessionApprovals[actionType] === true;
    }

    function setSessionApproval(actionType, approved) {
        if (approved) {
            _sessionApprovals[actionType] = true;
            console.log(`[Session Approvals] Auto-approve enabled for: ${actionType}`);
        } else {
            delete _sessionApprovals[actionType];
            console.log(`[Session Approvals] Auto-approve disabled for: ${actionType}`);
        }
        updateSessionApprovalIndicator();
    }

    window.clearSessionApprovals = function() {
        _sessionApprovals = {};
        console.log('[Session Approvals] All auto-approvals cleared');
        updateSessionApprovalIndicator();
        appendChatMessage('ai', '🔄 Session approvals cleared. You will be prompted for all sensitive operations again.');
    };

    window.showSessionApprovalStatus = function() {
        const types = Object.keys(_sessionApprovals);
        if (types.length === 0) {
            appendChatMessage('ai', 'ℹ️ No session approvals are currently active.');

        }
        
        const typeLabels = types.map(t => {

    function updateSessionApprovalIndicator() {
        const types = Object.keys(_sessionApprovals);

        if (types.length > 0) {
            if (indicator) {

    function shouldUseTerminal(command) {
        const lower = command.toLowerCase().trim();
        const interactivePatterns = [
            'sudo', 'su ', 'ssh', 'scp', 'vim', 'vi ', 'nano', 'emacs',
            'less', 'more', 'top', 'htop', 'tail -f', 'watch',
            'docker exec -it', 'kubectl exec -it', 'python -i',
            'psql', 'mysql', 'redis-cli'
        ];
        return interactivePatterns.some(pattern => lower.includes(pattern));
    }

    function getTerminalSuggestion(command) {
        const lower = command.toLowerCase();
        if (lower.includes('sudo') || lower.includes('su ')) {
            return 'This command requires password input - terminal window recommended';
        }
        if (lower.includes('ssh') || lower.includes('scp')) {
            return 'SSH commands may require password or interaction';
        }
        if (lower.includes('vim') || lower.includes('nano') || lower.includes('emacs')) {
            return 'Text editors require interactive terminal window';
        }
        if (lower.includes('less') || lower.includes('more')) {
            return 'Pagers work better in terminal window';
        }
        if (lower.includes('top') || lower.includes('htop') || lower.includes('watch')) {
            return 'Monitoring tools work better in terminal window';
        }
        if (lower.includes('tail -f')) {
            return 'Log following is easier to view in terminal window';
        }
        return 'This command may work better in a terminal window';
    }

    async function showActionApprovalModal(payload) {
        const actionType = payload.action_type || 'action';
        
        // Check if this action type is auto-approved for this session
        if (isSessionApproved(actionType)) {
            console.log(`[Session Approvals] Auto-approving ${actionType}`);
            return { approved: true, payload, autoApproved: true };
        }
        return new Promise((resolve, reject) => {
            _currentApprovalPayload = payload;
            _currentApprovalResolve = resolve;
            _currentApprovalReject = reject;

            const modal = document.getElementById('action-approval-modal');
            const reasonEl = document.getElementById('action-approval-reason');
            const commandEl = document.getElementById('action-approval-command');
            const detailsEl = document.getElementById('action-approval-details');
            const passwordNoteEl = document.getElementById('action-approval-password-note');
            const allowBtn = document.getElementById('action-approval-allow-btn');
            const denyBtn = document.getElementById('action-approval-deny-btn');
            const sessionCheckbox = document.getElementById('action-approval-session-checkbox');
            const typeLabelEl = document.getElementById('action-approval-type-label');
            const workingDirSection = document.getElementById('action-approval-working-dir-section');
            const workingDirHelp = document.getElementById('action-approval-working-dir-help');
            const workingDirSelect = document.getElementById('action-approval-working-dir-select');
            const workingDirInput = document.getElementById('action-approval-working-dir-input');
            const terminalModeRadio = document.getElementById('execution-mode-terminal');
            const backgroundModeRadio = document.getElementById('execution-mode-background');
            const suggestionBox = document.getElementById('execution-mode-suggestion');
            const suggestionText = document.getElementById('execution-mode-suggestion-text');
            const executionModeSection = document.getElementById('action-approval-execution-mode');

            // Populate modal content
            const command = payload.command || payload.statement || payload.action || '';
            const reasoning = payload.reasoning || payload.approval_reason || 'This action requires your approval.';
            const requiresPassword = payload.requires_password_prompt || false;
            const workingDir = payload.working_dir || '';
            const workingDirCandidates = Array.isArray(payload.working_dir_candidates) ? payload.working_dir_candidates : [];
            const promptForWorkingDir = payload.working_dir_prompt_required === true;
            
            // Set type-specific label
            let typeLabel = 'these actions';
            if (actionType === 'local_shell_execution') {
                typeLabel = 'shell commands';
            } else if (actionType === 'coding_workflow_patch') {
                typeLabel = 'code patches';
            }
            typeLabelEl.textContent = typeLabel;

            reasonEl.textContent = reasoning;
            commandEl.textContent = command;

            if (workingDir) {
                detailsEl.style.display = 'block';
                detailsEl.innerHTML = `<strong>Working Directory:</strong> ${workingDir}`;
            } else {
                detailsEl.style.display = 'none';
            }

            if (requiresPassword) {
                passwordNoteEl.style.display = 'block';
            } else {
                passwordNoteEl.style.display = 'none';
            }

            if (promptForWorkingDir) {
                workingDirSection.style.display = 'block';
                workingDirHelp.textContent = workingDirCandidates.length > 1
                    ? 'Multiple repositories were detected. Choose the one you want to use.'
                    : 'No repository was inferred. Choose or enter the folder to use.';
                workingDirSelect.innerHTML = '<option value="">Select a repository...</option>';
                if (workingDirCandidates.length > 0) {
                    workingDirCandidates.forEach((candidate) => {
                        const option = document.createElement('option');
                        option.value = candidate;
                        option.textContent = candidate;
                        if (candidate === workingDir) {
                            option.selected = true;
                        }
                        workingDirSelect.appendChild(option);
                    });
                    workingDirSelect.style.display = 'block';
                } else {
                    workingDirSelect.style.display = 'none';
                }
                workingDirInput.value = workingDir;
                workingDirInput.placeholder = workingDirCandidates.length > 0 ? 'Or enter a different folder path' : 'Enter the repository folder path';
            } else {
                workingDirSection.style.display = 'none';
            }
            
            // Show/hide execution mode section (only for shell commands)
            if (actionType === 'local_shell_execution' && command) {
                executionModeSection.style.display = 'block';
                
                // Smart default: suggest terminal for interactive commands
                const needsTerminal = shouldUseTerminal(command);
                if (needsTerminal) {
                    terminalModeRadio.checked = true;
                    backgroundModeRadio.checked = false;
                    suggestionBox.style.display = 'block';
                    suggestionText.textContent = getTerminalSuggestion(command);
                } else {
                    terminalModeRadio.checked = false;
                    backgroundModeRadio.checked = true;
                    suggestionBox.style.display = 'none';
                }
            } else {
                executionModeSection.style.display = 'none';
            }
            
            // Reset session checkbox state
            sessionCheckbox.checked = false;

            // Wire up buttons
            const handleAllow = () => {
                const rememberForSession = sessionCheckbox.checked;
                const executionMode = terminalModeRadio.checked ? 'terminal' : 'background';
                if (promptForWorkingDir) {
                    const chosenWorkingDir = (workingDirSelect.value || workingDirInput.value || '').trim();
                    if (!chosenWorkingDir) {
                        alert('Please choose or enter the repository folder before continuing.');
                        return;
                    }
                    payload.working_dir = chosenWorkingDir;
                }
                
                if (rememberForSession) {
                    setSessionApproval(actionType, true);
                }
                
                modal.style.display = 'none';
                allowBtn.removeEventListener('click', handleAllow);
                denyBtn.removeEventListener('click', handleDeny);
                document.removeEventListener('keydown', handleKeydown);
                if (_currentApprovalResolve) {
                    _currentApprovalResolve({ 
                        approved: true, 
                        payload, 
                        sessionApproval: rememberForSession,
                        executionMode: executionMode
                    });
                }
            };

            const handleDeny = () => {
                modal.style.display = 'none';
                allowBtn.removeEventListener('click', handleAllow);
                denyBtn.removeEventListener('click', handleDeny);
                document.removeEventListener('keydown', handleKeydown);
                if (_currentApprovalResolve) {
                    _currentApprovalResolve({ approved: false, payload });
                }
            };

            const handleKeydown = (e) => {
                if (e.key === 'Escape') {
                    handleDeny();
                } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    handleAllow();
                }
            };

            allowBtn.addEventListener('click', handleAllow);
            denyBtn.addEventListener('click', handleDeny);
            document.addEventListener('keydown', handleKeydown);

            modal.style.display = 'flex';
        });
    }

    async function executeApprovedAction(payload, autoApproved = false, executionMode = 'background') {
        const actionType = payload.action_type || '';
        const command = payload.command || payload.statement || '';
        
        if (actionType === 'local_shell_execution') {
            try {
                const req = {
                    command: command,
                    reasoning: payload.reasoning || '',
                    working_dir: payload.working_dir || '',
                    timeout_seconds: payload.timeout_seconds || 600,
                    execution_mode: executionMode
                };

                const res = await fetch(getDaemonBaseURL().replace(/\/$/, '') + '/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(req)
                });
                
                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error("HTTP " + res.status + ": " + txt);
                }
                
                const data = await res.json();
                
                // Handle terminal launch
                if (data.launched_in_terminal) {
                    const approvalBadge = autoApproved ? ' 🚀 *(auto-approved)*' : '';
                    const modeLabel = executionMode === 'terminal' ? '🖥️ Terminal' : '⚡ Background';
                    let outputMsg = `✅ **Command Launched in Terminal** ${modeLabel}${approvalBadge}\n\nCommand: \`${command}\`\n\n`;
                    outputMsg += 'The command is running in a visible terminal window. Check your system for the terminal window to see output and provide input if needed.';
                    if (data.suggestion) {
                        outputMsg += `\n\n💡 *${data.suggestion}*`;
                    }
                    appendChatMessage('ai', outputMsg);
                    return data;
                }
                
                // Handle background execution
                const approvalBadge = autoApproved ? ' 🚀 *(auto-approved)*' : '';
                const modeLabel = executionMode === 'terminal' ? '🖥️ Terminal' : '⚡ Background';
                let outputMsg = `✅ **Local Command Executed** ${modeLabel}${approvalBadge}\n\nCommand: \`${command}\`\n`;
                if (data.stdout) outputMsg += `\n**Output:**\n\`\`\`\n${data.stdout}\n\`\`\`\n`;
                if (data.stderr) outputMsg += `\n**Errors:**\n\`\`\`\n${data.stderr}\n\`\`\`\n`;
                if (data.error) outputMsg += `\n**Error:** ${data.error}\n`;
                outputMsg += `\nExit Code: ${data.exit_code}`;
                if (data.suggestion) {
                    outputMsg += `\n\n💡 **Tip:** ${data.suggestion}`;
                }
                
                appendChatMessage('ai', outputMsg);
                return data;
            } catch (err) {
                const errorMsg = `❌ **Command Execution Failed**\n\nCommand: \`${command}\`\n\nError: ${err.message}\n\nIs the SOP Desktop Daemon running on port 9090?`;
                appendChatMessage('ai', errorMsg);
                throw err;
            }
        } else {
            const approvalBadge = autoApproved ? ' 🚀 *(auto-approved)*' : '';
            appendChatMessage('ai', `Action approved${approvalBadge} but execution handler not implemented for type: ${actionType}`);
        }
    }

    window.approveLocalCommand = async function(encodedCommand, btn) {
        const command = decodeURIComponent(encodedCommand);
        const container = btn.parentElement.parentElement;
        container.innerHTML = '<span style="color: #eab308;">⏳ Executing locally via SOP Daemon...</span>';
        
        try {
            const res = await fetch(getDaemonBaseURL().replace(/\/$/, '') + '/api/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: command })
            });
            
            if (!res.ok) {
                const txt = await res.text();
                throw new Error("HTTP " + res.status + ": " + txt);
            }
            
            const data = await res.json();
            container.innerHTML = `<span style="color: #10b981;">✅ Executed locally.</span>`;
            
            // Format daemon output back into the chat context as the user's response
            let outputMsg = `[Local Daemon Execution Result for \`${command}\`]\n`;
            if (data.stdout) outputMsg += `\n**Stdout:**\n\`\`\`\n${data.stdout}\n\`\`\``;
            if (data.stderr) outputMsg += `\n**Stderr:**\n\`\`\`\n${data.stderr}\n\`\`\``;
            if (data.error) outputMsg += `\n**Error:** ${data.error}`;
            outputMsg += `\n\nExit Code: ${data.exit_code}`;
            
            // Auto-send the result back to the chat so the LLM knows what happened
            const input = document.getElementById('chat-input');
            input.value = outputMsg;
            sendAIChatMessage();
            
        } catch (err) {
            container.innerHTML = `<span style="color: #ef4444;">❌ Daemon Error: Is the SOP Desktop Daemon running on port 9090?</span><br><br><span style="color:#a1a1aa; font-size:0.8rem">${err.message}</span>`;
            
            const input = document.getElementById('chat-input');
            input.value = `The local execution failed because the SOP Desktop Daemon was not reachable. Error: ${err.message}`;
            sendAIChatMessage();
        }
    };
