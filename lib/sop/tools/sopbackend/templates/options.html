{{define "llmOptions"}}
<option value="openai:gpt-5.4">GPT-5.4 (Default)</option>
{{range .ModelCatalog.LLM}}
<optgroup label="{{.Label}}">
    {{range .Options}}
    <option value="{{.Value}}">{{.Label}}</option>
    {{end}}
</optgroup>
{{end}}
{{end}}

{{define "embedderOptions"}}
{{range .ModelCatalog.Embedder}}
<optgroup label="{{.Label}}">
    {{range .Options}}
    <option value="{{.Value}}" {{if eq .Value "kelindar:nomic-embed-text-v1.5-q8_0"}}selected{{end}}>{{.Label}}</option>
    {{end}}
</optgroup>
{{end}}
{{end}}
