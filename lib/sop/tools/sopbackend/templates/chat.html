<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        
        .chat-header {
            background: #252526;
            padding: 12px 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        
        .chat-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #cccccc;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        
        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 90%;
        }
        
        .message.user {
            align-self: flex-end;
        }
        
        .message.assistant {
            align-self: flex-start;
        }
        
        .message-header {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            padding: 0 8px;
        }
        
        .message.user .message-header {
            text-align: right;
            color: #4ec9b0;
        }
        
        .message.assistant .message-header {
            color: #569cd6;
        }
        
        .message-content {
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #094771;
            color: #ffffff;
        }
        
        .message.assistant .message-content {
            background: #2d2d30;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
        }
        
        .chat-input-area {
            padding: 16px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            flex-shrink: 0;
        }

        
        .input-container {
            display: flex;
            gap: 8px;
        }
        
        #chat-input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #cccccc;
            padding: 10px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 400;
            resize: none;
            min-height: 40px;
            max-height: 120px;
        }
        
        #chat-input:focus {
            outline: none;
            border-color: #007acc;
        }
        
        #send-button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        #send-button:hover {
            background: #1177bb;
        }
        
        #send-button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #569cd6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #f48771;
            font-size: 12px;
            padding: 8px 12px;
            background: rgba(244, 135, 113, 0.1);
            border-radius: 4px;
            margin-top: 8px;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>🤖 SOP AI Chat</h1>
    </div>
    
    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <div class="message assistant">
                <div class="message-header">Assistant</div>
                <div class="message-content">Hello! I'm your SOP AI assistant. How can I help you today?</div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <div class="input-container">
                <textarea 
                    id="chat-input" 
                    placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
                    rows="1"
                ></textarea>
                <button id="send-button">Send</button>
            </div>
            <div id="error-display"></div>
        </div>
    </div>
    
    {{template "scripts_daemon" .}}
    
    <script>
        const messagesContainer = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const errorDisplay = document.getElementById('error-display');
        
        let isProcessing = false;
        
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';
            headerDiv.textContent = role === 'user' ? 'You' : 'Assistant';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(headerDiv);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function showError(message) {
            errorDisplay.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => {
                errorDisplay.innerHTML = '';
            }, 5000);
        }
        
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isProcessing) return;
            
            // Add user message
            addMessage('user', message);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            isProcessing = true;
            sendButton.disabled = true;
            sendButton.innerHTML = '<span class="loading"></span>';
            
            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        context: {
                            store: 'default',
                            database: 'default'
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                addMessage('assistant', data.response || 'I apologize, but I could not generate a response.');
                
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to send message. Please try again.');
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
                chatInput.focus();
            }
        }
        
        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        // Enter to send, Shift+Enter for new line
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendButton.addEventListener('click', sendMessage);
        
        // Focus input on load
        chatInput.focus();
    </script>
</body>
</html>
