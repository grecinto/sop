{{define "federation_model_catalog"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .PageTitle}}{{.PageTitle}}{{else}}Model Catalog{{end}}</title>
    {{template "styles" .}}
</head>
<body>
{{template "sidebar" .}}
<div id="main" style="padding: 20px; overflow: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;">
        <div>
            <h1 style="margin: 0;">Model Catalog</h1>
            <div id="federation-summary" style="margin-top: 6px; color: var(--text-muted); font-size: 0.95em;"></div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button id="federation-refresh-btn" onclick="refreshFederationCatalog()" style="padding: 8px 12px; border: 1px solid var(--border-color); background: var(--active-bg); color: white; border-radius: 4px; cursor: pointer;">Fetch latest prices</button>
            <button id="federation-share-btn" onclick="shareFederationCatalog()" style="padding: 8px 12px; border: 1px solid var(--border-color); background: var(--sidebar-bg); color: var(--text-color); border-radius: 4px; cursor: pointer;">Federate out to copilots</button>
        </div>
    </div>
    <div id="federation-status" style="margin-bottom: 10px; color: var(--text-muted);">Loading…</div>
    <div style="overflow-x: auto; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.95em;">
            <thead>
                <tr style="background: var(--sidebar-bg);">
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Provider</th>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Model</th>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Catalog Value</th>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Input / 1M</th>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Output / 1M</th>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color);">Last Known</th>
                </tr>
            </thead>
            <tbody id="federation-model-catalog-body"></tbody>
        </table>
    </div>
</div>
<script>
function formatNumber(value) {
    if (typeof value === 'number') {
        return value.toFixed(2);
    }
    return 'n/a';
}

async function loadFederationModelCatalog() {
    const statusEl = document.getElementById('federation-status');
    const summaryEl = document.getElementById('federation-summary');
    const bodyEl = document.getElementById('federation-model-catalog-body');
    const refreshBtn = document.getElementById('federation-refresh-btn');
    const shareBtn = document.getElementById('federation-share-btn');
    if (!statusEl || !summaryEl || !bodyEl || !refreshBtn || !shareBtn) {
        return;
    }
    statusEl.textContent = 'Loading model catalog...';
    refreshBtn.disabled = true;
    shareBtn.disabled = true;
    try {
        const response = await authFetch('/api/federation/model-catalog', {headers: {'Accept': 'application/json'}});
        const payload = await parseFederationJSONResponse(response, 'Failed to load model catalog');
        if (!response.ok) {
            throw new Error(payload.error || 'Failed to load model catalog');
        }
        renderFederationModelCatalog(payload);
    } catch (err) {
        statusEl.textContent = err.message || 'Unable to load model catalog';
        summaryEl.innerHTML = '<span style="color: var(--danger-bg);">Unable to load federation data.</span>';
    }
}

function renderFederationModelCatalog(payload) {
    const statusEl = document.getElementById('federation-status');
    const summaryEl = document.getElementById('federation-summary');
    const bodyEl = document.getElementById('federation-model-catalog-body');
    const refreshBtn = document.getElementById('federation-refresh-btn');
    const shareBtn = document.getElementById('federation-share-btn');
    if (!statusEl || !summaryEl || !bodyEl || !refreshBtn || !shareBtn) {
        return;
    }
    const rows = payload.rows || [];
    const revision = payload.revision || 'n/a';
    const refreshed = payload.last_refreshed_at || 'n/a';
    const shared = payload.last_shared_at || 'n/a';
    summaryEl.innerHTML = `Revision: <strong>${revision.slice(0, 12)}</strong> &nbsp;•&nbsp; Last refreshed: <strong>${refreshed}</strong> &nbsp;•&nbsp; Last shared: <strong>${shared}</strong>`;
    statusEl.textContent = rows.length > 0 ? 'Showing current catalog entries.' : 'No catalog entries were returned.';
    if (!rows.length) {
        bodyEl.innerHTML = '<tr><td colspan="6" style="padding: 12px;">No model catalog rows found.</td></tr>';
    } else {
        bodyEl.innerHTML = rows.map((row) => {
            const input = formatNumber(row.input_cost_per_1m_tokens);
            const output = formatNumber(row.output_cost_per_1m_tokens);
            const lastKnown = `${formatNumber(row.last_known_input_cost_usd)}/${formatNumber(row.last_known_output_cost_usd)}`;
            return `<tr><td>${row.provider || ''}</td><td>${row.model || ''}</td><td>${row.value || ''}</td><td>${input}</td><td>${output}</td><td>${lastKnown}</td></tr>`;
        }).join('');
    }
    refreshBtn.disabled = false;
    shareBtn.disabled = !payload.can_federate;
    shareBtn.title = payload.can_federate ? 'Share the current catalog to copilots' : 'The catalog must be refreshed before it can be federated again';
}

async function refreshFederationCatalog() {
    const statusEl = document.getElementById('federation-status');
    const refreshBtn = document.getElementById('federation-refresh-btn');
    const shareBtn = document.getElementById('federation-share-btn');
    if (!statusEl || !refreshBtn || !shareBtn) {
        return;
    }
    refreshBtn.disabled = true;
    shareBtn.disabled = true;
    statusEl.textContent = 'Refreshing pricing metadata...';
    try {
        const response = await authFetch('/api/federation/model-catalog/refresh', {method: 'POST', headers: {'Accept': 'application/json'}});
        const payload = await parseFederationJSONResponse(response, 'Failed to refresh model catalog');
        if (!response.ok) {
            throw new Error(payload.error || 'Failed to refresh model catalog');
        }
        renderFederationModelCatalog(payload);
    } catch (err) {
        statusEl.textContent = err.message || 'Unable to refresh catalog';
    }
}

async function shareFederationCatalog() {
    const statusEl = document.getElementById('federation-status');
    const refreshBtn = document.getElementById('federation-refresh-btn');
    const shareBtn = document.getElementById('federation-share-btn');
    if (!statusEl || !refreshBtn || !shareBtn) {
        return;
    }
    if (shareBtn.disabled) {
        return;
    }
    refreshBtn.disabled = true;
    shareBtn.disabled = true;
    statusEl.textContent = 'Sharing catalog to copilots...';
    try {
        const response = await authFetch('/api/federation/model-catalog/share', {method: 'POST', headers: {'Accept': 'application/json'}});
        const payload = await parseFederationJSONResponse(response, 'Failed to share model catalog');
        if (!response.ok) {
            throw new Error(payload.error || 'Failed to share model catalog');
        }
        renderFederationModelCatalog(payload);
        statusEl.textContent = 'Catalog shared to copilots.';
    } catch (err) {
        statusEl.textContent = err.message || 'Unable to share catalog';
    }
}

async function parseFederationJSONResponse(response, fallbackMessage) {
    const contentType = response.headers.get('content-type') || '';
    const raw = await response.text();
    if (!contentType.includes('application/json')) {
        if (!response.ok) {
            throw new Error(`${fallbackMessage} (${response.status})`);
        }
        throw new Error('Unexpected non-JSON response while loading Model Catalog');
    }
    try {
        return JSON.parse(raw);
    } catch (err) {
        throw new Error('Invalid JSON response while loading Model Catalog');
    }
}

document.addEventListener('DOMContentLoaded', loadFederationModelCatalog);
</script>
</body>
</html>
{{end}}
