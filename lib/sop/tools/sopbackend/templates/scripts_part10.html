{{define "scripts_part10"}}
<script>
    const setupWizardAIConfigDefaults = {{.SetupWizardAIConfigJSON}};
    const setupWizardModelCatalog = {{.ModelCatalogJSON}};
    const AI_POOL_SYNC_META_STORAGE_KEY = 'sop_ai_pool_sync_meta';
    const AI_POOL_SYNC_NODE_ID_STORAGE_KEY = 'sop_ai_pool_sync_node_id';

    function getStoredAISecrets() {
        const raw = localStorage.getItem('sop_ai_secrets');
        if (!raw) return {};
        try {
            return JSON.parse(raw) || {};
        } catch (e) {
            return {};
        }
    }

    function getStoredAIConfigRecord() {
        const raw = localStorage.getItem('sop_ai_config');
        if (!raw) return {};
        try {
            const parsed = JSON.parse(raw) || {};
            const split = splitAIConfigAndSecrets(parsed);
            if (Object.keys(split.secrets).length > 0) {
                const mergedSecrets = Object.assign({}, split.secrets, getStoredAISecrets());
                localStorage.setItem('sop_ai_config', JSON.stringify(split.config || {}));
                localStorage.setItem('sop_ai_secrets', JSON.stringify(mergedSecrets));
            }
            return split.config || {};
        } catch (e) {
            return {};
        }
    }

    function getStoredAIConfig() {
        const merged = Object.assign({}, getStoredAIConfigRecord(), getStoredAISecrets());
        return hydrateLegacyAISecretsFromProviderPool(merged);
    }

    function normalizeProviderSecretKey(provider) {
        const key = (provider || '').trim().toLowerCase();
        if (key === 'chatgpt') return 'openai';
        if (key === 'google') return 'gemini';
        return key;
    }

    function providerSecretField(provider) {
        const normalized = normalizeProviderSecretKey(provider);
        if (!normalized) return '';
        if (normalized === 'openai' || normalized === 'anthropic' || normalized === 'gemini') {
            return `${normalized}_api_key`;
        }
        return '';
    }

    function hydrateLegacyAISecretsFromProviderPool(aiConfig) {
        const cfg = Object.assign({}, aiConfig || {});

        const primarySecretField = providerSecretField(cfg.brain_provider);
        if (!cfg.brain_api_key && primarySecretField && cfg[primarySecretField]) {
            cfg.brain_api_key = cfg[primarySecretField];
        }

        const fallbackSecretField = providerSecretField(cfg.fallback_provider);
        if (!cfg.fallback_api_key && fallbackSecretField && cfg[fallbackSecretField]) {
            cfg.fallback_api_key = cfg[fallbackSecretField];
        }

        return cfg;
    }

    function splitAIConfigAndSecrets(aiConfig) {
        const nextConfig = Object.assign({}, aiConfig || {});
        const nextSecrets = {};
        ['brain_api_key', 'embedder_api_key', 'fallback_api_key', 'openai_api_key', 'anthropic_api_key', 'gemini_api_key'].forEach((key) => {
            if (Object.prototype.hasOwnProperty.call(nextConfig, key)) {
                if (nextConfig[key]) {
                    nextSecrets[key] = nextConfig[key];
                }
                delete nextConfig[key];
            }
        });
        return { config: nextConfig, secrets: nextSecrets };
    }

    function setStoredAIConfig(aiConfig) {
        const split = splitAIConfigAndSecrets(aiConfig || {});
        localStorage.setItem('sop_ai_config', JSON.stringify(split.config || {}));
        localStorage.setItem('sop_ai_secrets', JSON.stringify(split.secrets || {}));
    }

    function getLLMPoolSyncNodeID() {
        let nodeID = localStorage.getItem(AI_POOL_SYNC_NODE_ID_STORAGE_KEY);
        if (nodeID) {
            return nodeID;
        }
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            nodeID = window.crypto.randomUUID();
        } else {
            nodeID = `client-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }
        localStorage.setItem(AI_POOL_SYNC_NODE_ID_STORAGE_KEY, nodeID);
        return nodeID;
    }

    function getStoredLLMPoolSyncMeta() {
        const fallback = {
            pool_version: 0,
            pool_updated_at_ms: 0,
            pool_updated_by: getLLMPoolSyncNodeID(),
            providers: {}
        };
        const raw = localStorage.getItem(AI_POOL_SYNC_META_STORAGE_KEY);
        if (!raw) {
            return fallback;
        }
        try {
            const parsed = JSON.parse(raw) || {};
            return {
                pool_version: Number(parsed.pool_version) > 0 ? Number(parsed.pool_version) : 0,
                pool_updated_at_ms: Number(parsed.pool_updated_at_ms) > 0 ? Number(parsed.pool_updated_at_ms) : 0,
                pool_updated_by: (parsed.pool_updated_by || '').trim() || getLLMPoolSyncNodeID(),
                providers: parsed.providers && typeof parsed.providers === 'object' ? parsed.providers : {}
            };
        } catch (e) {
            return fallback;
        }
    }

    function setStoredLLMPoolSyncMeta(meta) {
        const next = meta || {};
        localStorage.setItem(AI_POOL_SYNC_META_STORAGE_KEY, JSON.stringify({
            pool_version: Number(next.pool_version) > 0 ? Number(next.pool_version) : 0,
            pool_updated_at_ms: Number(next.pool_updated_at_ms) > 0 ? Number(next.pool_updated_at_ms) : 0,
            pool_updated_by: (next.pool_updated_by || '').trim() || getLLMPoolSyncNodeID(),
            providers: next.providers && typeof next.providers === 'object' ? next.providers : {}
        }));
    }

    function providerModelAndURLFromConfig(aiConfig, provider) {
        const cfg = aiConfig || {};
        const normalizedProvider = normalizeProviderSecretKey(provider);
        const primaryProvider = normalizeProviderSecretKey(cfg.brain_provider);
        if (primaryProvider === normalizedProvider) {
            return {
                model: (cfg.brain_model || '').trim(),
                url: (cfg.brain_url || '').trim()
            };
        }
        const fallbackProvider = normalizeProviderSecretKey(cfg.fallback_provider);
        if (fallbackProvider === normalizedProvider) {
            return {
                model: (cfg.fallback_model || '').trim(),
                url: (cfg.fallback_url || '').trim()
            };
        }
        return { model: '', url: '' };
    }

    function buildLLMCredentialsPoolForSync(aiConfig) {
        const cfg = aiConfig || {};
        const meta = getStoredLLMPoolSyncMeta();
        const credentials = {};
        ['openai', 'anthropic', 'gemini'].forEach(provider => {
            const keyName = `${provider}_api_key`;
            const apiKey = (cfg[keyName] || '').trim();
            const providerMeta = (meta.providers && meta.providers[provider]) || {};
            const updatedAt = Number(providerMeta.updated_at_ms) > 0 ? Number(providerMeta.updated_at_ms) : 0;
            const deletedAt = Number(providerMeta.deleted_at_ms) > 0 ? Number(providerMeta.deleted_at_ms) : 0;
            if (!apiKey && !deletedAt) {
                return;
            }
            const routing = providerModelAndURLFromConfig(cfg, provider);
            credentials[provider] = {
                api_key: apiKey,
                model: routing.model,
                url: routing.url,
                updated_at_ms: updatedAt,
                deleted_at_ms: deletedAt
            };
        });
        return credentials;
    }

    function updateLLMPoolSyncMeta(previousConfig, nextConfig) {
        const prev = previousConfig || {};
        const next = nextConfig || {};
        const meta = getStoredLLMPoolSyncMeta();
        const providers = Object.assign({}, meta.providers || {});
        const now = Date.now();
        let changed = false;

        ['openai', 'anthropic', 'gemini'].forEach(provider => {
            const keyName = `${provider}_api_key`;
            const prevValue = (prev[keyName] || '').trim();
            const nextValue = (next[keyName] || '').trim();
            if (prevValue === nextValue) {
                return;
            }
            changed = true;
            const providerMeta = Object.assign({}, providers[provider] || {});
            if (nextValue) {
                providerMeta.updated_at_ms = now;
                providerMeta.deleted_at_ms = 0;
            } else {
                providerMeta.deleted_at_ms = now;
                if (!(Number(providerMeta.updated_at_ms) > 0)) {
                    providerMeta.updated_at_ms = now;
                }
            }
            providers[provider] = providerMeta;
        });

        if (changed) {
            setStoredLLMPoolSyncMeta({
                pool_version: (Number(meta.pool_version) > 0 ? Number(meta.pool_version) : 0) + 1,
                pool_updated_at_ms: now,
                pool_updated_by: getLLMPoolSyncNodeID(),
                providers: providers
            });
        }
    }

    function buildLLMPoolSyncPayload(aiConfig) {
        const meta = getStoredLLMPoolSyncMeta();
        return {
            llm_credentials: buildLLMCredentialsPoolForSync(aiConfig),
            llm_pool_version: Number(meta.pool_version) > 0 ? Number(meta.pool_version) : 0,
            llm_pool_updated_at_ms: Number(meta.pool_updated_at_ms) > 0 ? Number(meta.pool_updated_at_ms) : 0,
            llm_pool_updated_by: (meta.pool_updated_by || '').trim() || getLLMPoolSyncNodeID()
        };
    }

    function applyDaemonLLMPoolSnapshotToLocalConfig(snapshot) {
        const cfg = getStoredAIConfig();
        const incoming = snapshot && snapshot.llm_credentials && typeof snapshot.llm_credentials === 'object' ? snapshot.llm_credentials : null;
        if (!incoming) {
            return cfg;
        }

        const nextConfig = Object.assign({}, cfg);
        ['openai', 'anthropic', 'gemini'].forEach(provider => {
            const entry = incoming[provider];
            if (!entry || typeof entry !== 'object') {
                return;
            }
            const keyName = `${provider}_api_key`;
            const deletedAt = Number(entry.deleted_at_ms) > 0 ? Number(entry.deleted_at_ms) : 0;
            const apiKey = (entry.api_key || '').trim();
            nextConfig[keyName] = deletedAt > 0 ? '' : apiKey;

            const normalizedBrainProvider = normalizeProviderSecretKey(nextConfig.brain_provider);
            if (normalizedBrainProvider === provider) {
                nextConfig.brain_model = (entry.model || '').trim() || nextConfig.brain_model || '';
                nextConfig.brain_url = (entry.url || '').trim() || nextConfig.brain_url || '';
            }
            const normalizedFallbackProvider = normalizeProviderSecretKey(nextConfig.fallback_provider);
            if (normalizedFallbackProvider === provider) {
                nextConfig.fallback_model = (entry.model || '').trim() || nextConfig.fallback_model || '';
                nextConfig.fallback_url = (entry.url || '').trim() || nextConfig.fallback_url || '';
            }
        });

        setStoredAIConfig(nextConfig);
        const providerMeta = {};
        ['openai', 'anthropic', 'gemini'].forEach(provider => {
            const entry = incoming[provider];
            if (!entry || typeof entry !== 'object') {
                return;
            }
            providerMeta[provider] = {
                updated_at_ms: Number(entry.updated_at_ms) > 0 ? Number(entry.updated_at_ms) : 0,
                deleted_at_ms: Number(entry.deleted_at_ms) > 0 ? Number(entry.deleted_at_ms) : 0
            };
        });
        setStoredLLMPoolSyncMeta({
            pool_version: Number(snapshot.llm_pool_version) > 0 ? Number(snapshot.llm_pool_version) : 0,
            pool_updated_at_ms: Number(snapshot.llm_pool_updated_at_ms) > 0 ? Number(snapshot.llm_pool_updated_at_ms) : 0,
            pool_updated_by: (snapshot.llm_pool_updated_by || '').trim() || getLLMPoolSyncNodeID(),
            providers: providerMeta
        });

        return getStoredAIConfig();
    }

    function mergeStoredAIConfig(partialConfig) {
        const nextConfig = Object.assign({}, getStoredAIConfig(), partialConfig || {});
        setStoredAIConfig(nextConfig);
        return nextConfig;
    }

    function isEncryptedAISecretValue(value) {
        return typeof value === 'string' && value.indexOf('enc:v1:') === 0;
    }

    function clearEncryptedAISecretsForDisplay(aiConfig) {
        const nextConfig = Object.assign({}, aiConfig || {});
        ['brain_api_key', 'embedder_api_key', 'fallback_api_key', 'openai_api_key', 'anthropic_api_key', 'gemini_api_key'].forEach((key) => {
            if (isEncryptedAISecretValue(nextConfig[key])) {
                nextConfig[key] = '';
            }
        });
        return nextConfig;
    }

    function encryptAISecretValueForStorage(value) {
        const trimmed = typeof value === 'string' ? value.trim() : '';
        if (!trimmed || isEncryptedAISecretValue(trimmed)) {
            return trimmed;
        }
        const runtimeMode = (typeof getCurrentRuntimeMode === 'function' ? getCurrentRuntimeMode() : 'hq');
        if (runtimeMode !== 'local') {
            return trimmed;
        }
        const response = apiCallSync('/api/daemon/secrets/encrypt', 'POST', { value: trimmed });
        if (response && typeof response.encrypted_value === 'string' && response.encrypted_value) {
            return response.encrypted_value;
        }
        throw new Error('Daemon did not return an encrypted secret');
    }

    function prepareAIConfigForSecureStorage(nextConfig, existingConfig) {
        const prepared = Object.assign({}, nextConfig || {});
        const current = existingConfig || {};
        const resolveProviderSecret = (secretKey) => {
            const existingValue = (current[secretKey] || '').trim();
            const nextValue = (prepared[secretKey] || '').trim();
            if (nextValue) {
                prepared[secretKey] = encryptAISecretValueForStorage(nextValue);
                return;
            }
            prepared[secretKey] = existingValue;
        };
        const resolveSecret = (secretKey, providerKey) => {
            const provider = (prepared[providerKey] || '').trim();
            const existingValue = (current[secretKey] || '').trim();
            const nextValue = (prepared[secretKey] || '').trim();
            if (!provider || isLocalProviderValue(provider)) {
                prepared[secretKey] = '';
                return;
            }
            if (nextValue) {
                prepared[secretKey] = encryptAISecretValueForStorage(nextValue);
                return;
            }
            prepared[secretKey] = existingValue;
        };

        // Provider-keyed pool secrets are retained independent of active selection.
        resolveProviderSecret('openai_api_key');
        resolveProviderSecret('anthropic_api_key');
        resolveProviderSecret('gemini_api_key');

        // Migrate legacy provider-slotted values into provider-keyed pool when possible.
        const primaryField = providerSecretField(prepared.brain_provider);
        if (primaryField && !prepared[primaryField] && (prepared.brain_api_key || current.brain_api_key)) {
            prepared[primaryField] = encryptAISecretValueForStorage((prepared.brain_api_key || current.brain_api_key || '').trim());
        }
        const fallbackField = providerSecretField(prepared.fallback_provider);
        if (fallbackField && !prepared[fallbackField] && (prepared.fallback_api_key || current.fallback_api_key)) {
            prepared[fallbackField] = encryptAISecretValueForStorage((prepared.fallback_api_key || current.fallback_api_key || '').trim());
        }

        // Hydrate legacy slots from provider-keyed secrets to keep existing consumers stable.
        if (primaryField && !prepared.brain_api_key && prepared[primaryField]) {
            prepared.brain_api_key = prepared[primaryField];
        }
        if (fallbackField && !prepared.fallback_api_key && prepared[fallbackField]) {
            prepared.fallback_api_key = prepared[fallbackField];
        }

        resolveSecret('brain_api_key', 'brain_provider');
        resolveSecret('embedder_api_key', 'embedder_provider');
        resolveSecret('fallback_api_key', 'fallback_provider');
        return prepared;
    }

    function mergeStoredAIConfigSecure(partialConfig) {
        const existingConfig = getStoredAIConfig();
        const nextConfig = Object.assign({}, existingConfig, partialConfig || {});
        const prepared = prepareAIConfigForSecureStorage(nextConfig, existingConfig);
        setStoredAIConfig(prepared);
        updateLLMPoolSyncMeta(existingConfig, prepared);
        return prepared;
    }

    function toggleEnterpriseBrain() {
        // Legacy function, kept for safety if referenced elsewhere, but effectively superseded by toggleManualEnterpriseBrain
    }

    function setupProviderLabel(provider) {
        switch ((provider || '').toLowerCase()) {
            case 'openai':
                return 'OpenAI';
            case 'anthropic':
                return 'Anthropic';
            case 'gemini':
                return 'Gemini';
            case 'ollama':
                return 'Ollama';
            default:
                return provider || 'Provider';
        }
    }

    function describeProviderSelection(provider, model, fallbackLabel) {
        if (!provider) {
            return fallbackLabel;
        }

        const providerLabel = setupProviderLabel(provider);
        if (!model) {
            return providerLabel;
        }

        return `${providerLabel} (${model})`;
    }

    function capitalizeSummaryLabel(value) {
        if (!value) {
            return value;
        }
        return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function describeAISummarySelection(aiConfig) {
        const cfg = aiConfig || {};
        const llm = capitalizeSummaryLabel(cfg.brain_model || cfg.brain_provider || 'GPT-5.4');
        const embedder = capitalizeSummaryLabel(cfg.embedder_model || cfg.embedder_provider || 'text-embedding-3-small');
        const embedderNeedsSuffix = !/(embed|embedding)/i.test(embedder);
        return `${llm} * ${embedder}${embedderNeedsSuffix ? ' emb' : ''}`;
    }

    function getSelectedProviderOptionSource(selectId) {
        const select = document.getElementById(selectId);
        if (!select || select.selectedIndex < 0) return 'catalog';
        const option = select.options[select.selectedIndex];
        return option?.dataset?.injected === 'env' ? 'env' : 'catalog';
    }

    function isLocalProviderValue(value) {
        const raw = (value || '').trim();
        const parts = splitProviderValue(raw);
        const normalizedValue = `${parts.provider || ''}:${parts.model || ''}`.toLowerCase();
        const localGroup = Array.isArray(setupWizardModelCatalog?.embedder)
            ? setupWizardModelCatalog.embedder.find(group => (group.label || '').toLowerCase() === 'local')
            : null;
        const isCatalogLocal = !!localGroup?.options?.some(option => {
            return (option.value || '').toLowerCase() === normalizedValue || (option.value || '').toLowerCase() === (parts.provider || '').toLowerCase();
        });

        return raw.toLowerCase().startsWith('ollama') || raw.toLowerCase().startsWith('local') || raw.toLowerCase().startsWith('kelindar') || isCatalogLocal;
    }

    function isKelindarLocalEmbedderValue(value) {
        const parts = splitProviderValue(value || '');
        const normalizedValue = `${parts.provider || ''}:${parts.model || ''}`.toLowerCase();
        const localGroup = Array.isArray(setupWizardModelCatalog?.embedder)
            ? setupWizardModelCatalog.embedder.find(group => (group.label || '').toLowerCase() === 'local')
            : null;
        return !!localGroup?.options?.some(option => (option.value || '').toLowerCase() === normalizedValue);
    }

    function isEmbeddedEmbedderValue(value) {
        const normalized = (value || '').trim().toLowerCase();
        if (!normalized) {
            return false;
        }

        if (normalized.includes('embedded') || normalized.includes('kelindar')) {
            return true;
        }

        const parts = splitProviderValue(value || '');
        const normalizedValue = `${parts.provider || ''}:${parts.model || ''}`.toLowerCase();
        const localGroup = Array.isArray(setupWizardModelCatalog?.embedder)
            ? setupWizardModelCatalog.embedder.find(group => (group.label || '').toLowerCase() === 'local')
            : null;
        const matchedOption = localGroup?.options?.find(option => {
            const candidateValue = (option.value || '').trim().toLowerCase();
            return candidateValue === normalized || candidateValue === normalizedValue;
        });

        const optionLabel = (matchedOption?.label || '').toLowerCase();
        return optionLabel.includes('embedded') || optionLabel.includes('kelindar');
    }

    function selectProviderOption(select, value, source) {
        if (!select) return;

        const preferEnv = source === 'env';
        const options = Array.from(select.options);
        const matchingOption = options.find(option => {
            if (option.value !== value) return false;
            const isEnv = option.dataset.injected === 'env';
            return preferEnv ? isEnv : !isEnv;
        }) || options.find(option => option.value === value);

        if (matchingOption) {
            options.forEach(option => {
                option.selected = option === matchingOption;
            });
        }
    }

    function ensureEnvironmentOptgroup(select) {
        if (!select) return null;

        let envGroup = Array.from(select.children).find(child => {
            return child.tagName === 'OPTGROUP' && child.dataset.injectedGroup === 'env';
        });
        if (envGroup) {
            return envGroup;
        }

        envGroup = document.createElement('optgroup');
        envGroup.label = 'Local Storage';
        envGroup.dataset.injectedGroup = 'env';

        const insertBeforeNode = Array.from(select.children).find((child, index) => {
            return index > 0;
        }) || null;

        if (insertBeforeNode) {
            select.insertBefore(envGroup, insertBeforeNode);
        } else {
            select.appendChild(envGroup);
        }

        return envGroup;
    }

    function ensureSetupProviderOption(selectId, provider, model, source = 'catalog', shouldSelect = true) {
        const select = document.getElementById(selectId);
        if (!select || !provider) return;

        const value = model ? `${provider}:${model}` : provider;
        const options = Array.from(select.options);
        const existingCatalog = options.find(option => option.value === value && option.dataset.injected !== 'env');

        if (!existingCatalog && source !== 'env') {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = model ? `${setupProviderLabel(provider)} (${model})` : `${setupProviderLabel(provider)}`;
            select.appendChild(option);
        }

        if (source === 'env') {
            if (shouldSelect) {
                selectProviderOption(select, value, source);
            }
            return;
        }

        if (shouldSelect) {
            selectProviderOption(select, value, source);
        }
    }

    function getEnvProviderOptions() {
        const cfg = setupWizardAIConfigDefaults || {};
        if (Array.isArray(cfg.env_providers) && cfg.env_providers.length) {
            return cfg.env_providers;
        }
        if (cfg.brain_provider) {
            return [{
                provider: cfg.brain_provider,
                model: cfg.brain_model,
                url: cfg.brain_url,
                api_key: cfg.brain_api_key
            }];
        }
        return [];
    }

    function findEnvProviderOption(provider, model) {
        const exactMatch = getEnvProviderOptions().find(option => {
            if (!option || option.provider !== provider) {
                return false;
            }
            return (option.model || '') === (model || '');
        });
        if (exactMatch) {
            return exactMatch;
        }

        const providerMatches = getEnvProviderOptions().filter(option => {
            return option && option.provider === provider;
        });
        if (providerMatches.length === 1) {
            return providerMatches[0];
        }
        return providerMatches.find(option => !option.model) || null;
    }

    function getCatalogProviderSelection(selectId, provider) {
        const select = document.getElementById(selectId);
        if (!select || !provider) return null;

        const matchingOption = Array.from(select.options).find(option => {
            if (option.dataset.injected === 'env') {
                return false;
            }
            const parts = splitProviderValue(option.value || '');
            return parts.provider === provider;
        });
        if (!matchingOption) {
            return null;
        }

        const parts = splitProviderValue(matchingOption.value || '');
        if (!parts.provider) {
            return null;
        }

        return parts;
    }

    function selectedProviderUsesURL(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return false;

        const value = select.value || '';
        if (!value) {
            return false;
        }
        if (isLocalProviderValue(value)) {
            return true;
        }
        if (getSelectedProviderOptionSource(selectId) !== 'env') {
            return false;
        }

        const parts = splitProviderValue(value);
        const envOption = findEnvProviderOption(parts.provider, parts.model);
        return !!(envOption && envOption.url);
    }

    function shouldOverwriteWithEnvValue(currentValue, fieldName) {
        if (!currentValue) {
            return true;
        }

        return getEnvProviderOptions().some(option => {
            return (option?.[fieldName] || '') === currentValue;
        });
    }

    function getProviderPoolInputIdForSelect(selectElement) {
        if (!selectElement) return '';
        const prefix = (selectElement.id || '').startsWith('chat-settings-') ? 'chat-settings' : 'setup';
        const parts = splitProviderValue(selectElement.value || '');
        const provider = normalizeProviderSecretKey(parts.provider);
        if (!provider || (provider !== 'openai' && provider !== 'anthropic' && provider !== 'gemini')) {
            return '';
        }
        return `${prefix}-${provider}-api-key`;
    }

    function applyEnvSelectionDefaults(selectId, apiKeyInputId, urlInputId) {
        const select = document.getElementById(selectId);
        if (!select) return;

        const source = getSelectedProviderOptionSource(selectId);
        if (source !== 'env') return;

        const parts = splitProviderValue(select.value || '');
        const envOption = findEnvProviderOption(parts.provider, parts.model);
        if (!envOption) return;

        const apiKeyInput = apiKeyInputId ? document.getElementById(apiKeyInputId) : null;
        const urlInput = document.getElementById(urlInputId);
        const poolInput = document.getElementById(getProviderPoolInputIdForSelect(select));

        if (apiKeyInput && shouldOverwriteWithEnvValue(apiKeyInput.value.trim(), 'api_key')) {
            apiKeyInput.value = envOption.api_key || '';
        } else if (poolInput && shouldOverwriteWithEnvValue(poolInput.value.trim(), 'api_key')) {
            poolInput.value = envOption.api_key || '';
        }
        if (urlInput && shouldOverwriteWithEnvValue(urlInput.value.trim(), 'url')) {
            urlInput.value = envOption.url || '';
        }
    }

    function handleSetupBrainProviderChange() {
        applyEnvSelectionDefaults('setup-brain-provider', null, 'setup-brain-url');
        toggleProviderAuth();
    }

    function handleChatSettingsProviderChange() {
        applyEnvSelectionDefaults('chat-settings-provider-overlay', null, 'chat-settings-url');
        toggleChatSettingsFields();

    async function submitDaemonProvisionRequest(endpoint, payload) {
        const loadingModal = document.getElementById('setup-loading-modal');
        const pb = document.getElementById('setup-progress-bar');
        const pbDetails = document.getElementById('setup-loading-details');

        if (loadingModal) {
            loadingModal.style.display = 'flex';
            closeUIModal('setup-wizard');
            pb.style.width = '20%';
            pbDetails.innerHTML = '- Preparing daemon provisioning...<br>';
        }

        try {
            const response = await localRuntimeRequest(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                cache: 'no-store',
                credentials: 'omit'
            });
            if (!response.ok) {
                let message = `Provisioning failed (${response.status})`;
                try {
                    const body = await response.json();
                    message = body.error || body.message || message;
                } catch (_) {
                    const text = await response.text().catch(() => '');
                    if (text) message = text;
                }
                const normalized = (message || '').toLowerCase();
                const authRelated = normalized.includes('authorization') || normalized.includes('unauthorized') || normalized.includes('forbidden') || normalized.includes('auth');
                if (authRelated) {
                    message = 'Local daemon authentication could not be established. Confirm the local daemon is running and that the current HQ URL is available and you sign in to HQ before provisioning.';
                }
                throw new Error(message);
            }
            const result = await response.json().catch(() => ({}));
            if (loadingModal) loadingModal.style.display = 'none';
            resetSetupForm();
            configureDaemonProvisioningWizard(false);
            runtimeRefreshPayload = null;
            if (result && result.restart_required) {
                showAlert('Daemon provisioning completed. Restart the local daemon to finish setup.');
                return;
            }
            await window.reloadDatabases(true);
        } catch (err) {
            if (loadingModal) loadingModal.style.display = 'none';
            openUIModal('setup-wizard');
            console.error(err);
            showAlert(err && err.message ? err.message : String(err));
        }
    }

    function finishDaemonSystemSetup() {
        const port = parseInt(document.getElementById('setup-port').value) || 9090;
        const sysType = document.getElementById('setup-sys-type').value;
        const sysConn = document.getElementById('setup-sys-conn').value.trim();
        const regPath = document.getElementById('setup-reg-path').value.trim();
        const sysHashMod = parseInt(document.getElementById('setup-sys-registry-hash-mod').value || '0', 10) || 0;
        const sysStoresFoldersRaw = document.getElementById('setup-sys-stores-folders').value.trim();
        const sysStoresFolders = sysStoresFoldersRaw ? sysStoresFoldersRaw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean) : [];

        if (!regPath) {
            showAlert('Please enter a system database path');
            return;
        }
        if (sysType === 'clustered' && !sysConn) {
            showAlert('Redis URL is required when clustered mode is selected');
            return;
        }

        const convertToDaemonEcMap = (arr) => {
            const m = {};
            if (!arr || arr.length === 0) return null;
            arr.forEach(item => {
                let key = item.key || 'default';
                if (key === '""') key = '';
                m[key] = {
                    data_shards_count: item.data_chunks,
                    parity_shards_count: item.parity_chunks,
                    base_folder_paths_across_drives: item.base_paths
                };
            });
            return m;
        };

        const sysEcConfigs = collectEcConfigs('setup-sys-ec-container');
        const effectiveSysEcConfigs = (sysEcConfigs && sysEcConfigs.length > 0)
            ? sysEcConfigs
            : (regPath ? [{ key: '', data_chunks: 1, parity_chunks: 0, base_paths: [regPath] }] : []);

        submitDaemonProvisionRequest('/api/daemon/provision/system', {
            port: port,
            system_db: {
                path: regPath,
                mode: sysType,
                redis_url: sysConn,
                registry_hash_mod: sysHashMod,
                stores_folders: sysStoresFolders,
                erasure_config: convertToDaemonEcMap(effectiveSysEcConfigs)
            }
        });
    }

    function populateStep1Defaults() {
        // Auto-populate System DB Manual Fields from User DB
        document.getElementById('setup-sys-type').value = document.getElementById('setup-db-type').value;
        document.getElementById('setup-sys-conn').value = document.getElementById('setup-db-conn').value;
        document.getElementById('setup-sys-registry-hash-mod').value = document.getElementById('setup-db-registry-hash-mod').value;

        // Build a system database path from the configured system DB name.
        const systemDbName = (typeof SYSTEM_DB_NAME === 'string' && SYSTEM_DB_NAME.trim()) ? SYSTEM_DB_NAME : 'system';
        const buildSystemDbPath = (path) => {
            if (!path) return `./.sop-data/${systemDbName}`;
            const isWin = path.includes('\\');
            const sep = isWin ? '\\' : '/';
            const parts = path.split(sep).filter(p => p.length > 0);
            if (parts.length === 0) return `./.sop-data/${systemDbName}`;
            parts.pop();
            parts.push(systemDbName);
            return (path.startsWith(sep) ? sep : '') + parts.join(sep);
        };

        const dbStores = document.getElementById('setup-db-stores-folders').value;
        if (dbStores) {
            const paths = dbStores.split(',').map(s => s.trim());
            const sysPaths = paths.map(p => buildSystemDbPath(p));
            document.getElementById('setup-sys-stores-folders').value = sysPaths.join(', ');
        }

        const dbPath = document.getElementById('setup-db-path').value;
        // Only auto-populate if NOT using Enterprise Brain (Auto or Manual)
        const entToggle = document.getElementById('setup-sys-use-enterprise');
        const manualEntToggle = document.getElementById('setup-sys-use-manual-enterprise');
        const isUsingEnterprise = (entToggle && entToggle.checked) || (manualEntToggle && manualEntToggle.checked);

        if (!isUsingEnterprise) {
            document.getElementById('setup-reg-path').value = buildSystemDbPath(dbPath || document.getElementById('setup-reg-path').value);
        }

        toggleSetupConnectionField('sys');

        // Auto-populate System DB EC Container from User DB (Max 4)
        const dbErasureConfigs = collectEcConfigs('setup-db-ec-container');
        const sysContainer = document.getElementById('setup-sys-ec-container');
        // Clear existing EC entries (keep helper text)
        sysContainer.querySelectorAll('.ec-entry').forEach(e => e.remove());

        if (dbErasureConfigs && dbErasureConfigs.length > 0) {
            const limit = 4;
            const toAdd = dbErasureConfigs.slice(0, limit);
            toAdd.forEach(item => {
                addErasureConfigRow('setup-sys-ec-container');
                const newEntry = sysContainer.lastElementChild;
                if (newEntry) {
                    newEntry.querySelector('.ec-key').value = item.key;
                    newEntry.querySelector('.ec-data').value = item.data_chunks;
                    newEntry.querySelector('.ec-parity').value = item.parity_chunks;
                    if (item.base_paths) {
                        // Copy base paths directly without modification (User Request)
                        const sysBasePaths = item.base_paths;
                        newEntry.querySelector('.ec-paths').value = sysBasePaths.join(', ');
                    }
                }
            });
        } else {
            // Ensure at least one empty row if none exists?
            // No, user might not want EC. But generally System DB might need it if matched.
            if (sysContainer.querySelectorAll('.ec-entry').length === 0) {
                addErasureConfigRow('setup-sys-ec-container');
            }
        }
    }

    function wizardSkipUserDb() {

            populateStep1Defaults();
            currentWizardStep++;
            updateWizardStep();

    function wizardNext() {
        if (daemonProvisioningWizardActive) {
            if (currentWizardStep <= 2) {
                const sysType = document.getElementById('setup-sys-type').value;
                const sysConn = document.getElementById('setup-sys-conn').value.trim();
                const regPath = document.getElementById('setup-reg-path').value.trim();

                if (!regPath) {
                    showAlert('Please enter a system database path');
                    return;
                }
                if (sysType === 'clustered' && !sysConn) {
                    showAlert('Redis URL is required when clustered mode is selected');
                    return;
                }

                currentWizardStep = 3;
                updateWizardStep();
                return;
            }

            const bProviderValue = document.getElementById('setup-brain-provider') ? document.getElementById('setup-brain-provider').value : "";
            const bParts = splitProviderValue(bProviderValue);
            let bApiKey = '';
            const bProviderPoolId = providerSecretField(bParts.provider);
            if (!bApiKey && bProviderPoolId) {
                const poolInputId = `setup-${bProviderPoolId.replace(/_/g, '-')}`;
                bApiKey = document.getElementById(poolInputId)?.value.trim() || '';
            }
            if (bProviderValue && !isLocalProviderValue(bProviderValue) && !bApiKey) {
                return showAlert("API Key is required for the selected LLM provider");
            }

            const eProviderValue = document.getElementById('setup-embedder-provider') ? document.getElementById('setup-embedder-provider').value : "";
            const eApiKey = document.getElementById('setup-embedder-api-key') ? document.getElementById('setup-embedder-api-key').value.trim() : "";
            if (eProviderValue && !isLocalProviderValue(eProviderValue) && !eApiKey) {
                return showAlert("API Key is required for the selected Embedder provider");
            }

            const bProvider = bParts.provider;
            const bModel = bParts.model || (document.getElementById('setup-brain-model') ? document.getElementById('setup-brain-model').value.trim() : "");
            const bUrl = document.getElementById('setup-brain-url') ? document.getElementById('setup-brain-url').value.trim() : "";
            const openAIProviderKey = document.getElementById('setup-openai-api-key') ? document.getElementById('setup-openai-api-key').value.trim() : "";
            const anthropicProviderKey = document.getElementById('setup-anthropic-api-key') ? document.getElementById('setup-anthropic-api-key').value.trim() : "";
            const geminiProviderKey = document.getElementById('setup-gemini-api-key') ? document.getElementById('setup-gemini-api-key').value.trim() : "";
            const eParts = splitProviderValue(eProviderValue);
            const eProvider = eParts.provider;
            const eModel = eParts.model || (document.getElementById('setup-embedder-model') ? document.getElementById('setup-embedder-model').value.trim() : "");
            const eUrl = document.getElementById('setup-embedder-url') ? document.getElementById('setup-embedder-url').value.trim() : "";

            mergeStoredAIConfigSecure({
                brain_provider: bProvider,
                brain_model: bModel,
                brain_url: bUrl,
                brain_api_key: bApiKey,
                embedder_provider: eProvider,
                embedder_model: eModel,
                embedder_url: eUrl,
                embedder_api_key: eApiKey,
                openai_api_key: openAIProviderKey || (normalizeProviderSecretKey(bProvider) === 'openai' ? bApiKey : ''),
                anthropic_api_key: anthropicProviderKey || (normalizeProviderSecretKey(bProvider) === 'anthropic' ? bApiKey : ''),
                gemini_api_key: geminiProviderKey || (normalizeProviderSecretKey(bProvider) === 'gemini' ? bApiKey : ''),
            });

            syncChatControlsFromAIConfig(getStoredAIConfig());
            syncSetupWizardControlsFromAIConfig(getStoredAIConfig());
            finishDaemonSystemSetup();
            return;
        }

        if (currentWizardStep < 3) {
            // Validation
            if (currentWizardStep === 1) { // Was 2: User DB
                skipUserDbProvisioning = false;

                // Unified Validation
                const err = validateDbForm('setup-db');
                if (err) return showAlert(err);

                populateStep1Defaults();

            } else if (currentWizardStep === 2) { // Was 1: System Config
                 const manualEntToggle = document.getElementById('setup-sys-use-manual-enterprise');
                 const isShared = manualEntToggle && manualEntToggle.checked;
                 const path = document.getElementById('setup-reg-path').value;
                 
                 if (!path) return showAlert("Please enter a system database path");

                 // If Shared Brain (Reuse Existing): Strict Validation
                 if (isShared) {
                    apiCall(`/api/config/validate-path?path=${encodeURIComponent(path)}&t=${Date.now()}`)
                    .then(data => {
                        if (!data.exists) return showAlert("Path does not exist on server.");
                        if (!data.isDir) return showAlert("Path is not a directory.");
                        // Must have valid system DB files
                        if (!data.hasDBOptions) return showAlert("Invalid Shared System DB: 'dboptions.json' not found.");
                        if (!data.hasRegHashMod) return showAlert("Invalid Shared System DB: Registry config 'reghashmod.txt' not found.");

                        currentWizardStep++;
                        updateWizardStep();
                    })
                    .catch(err => {
                        // Alerted by apiCall
                    });
                    return;
                 }
                 
                 // If NOT Shared Brain (Create New): Skip validation, User handles "Advanced" or Default
                 // We don't block for writability here (let Init fail if so), effectively restoring old behavior.
                 currentWizardStep++;
                 updateWizardStep();
                 return;
            }
            currentWizardStep++;
            updateWizardStep();
        } else {
            const rootPassword = document.getElementById('setup-root-password')?.value || '';
            if (!rootPassword.trim()) {
                return showAlert("Root password is required to finish setup.");
            }

            const systemAdminBootstrapSecret = (document.getElementById('setup-system-admin-bootstrap-secret')?.value || '').trim();
            if (systemAdminBootstrapSecret) {
                // The server will validate the secret against the environment variable.
                // If it matches, the initial root user will be created as SystemAdmin.
                // If it does not match, the default Admin role will be used.
            }

            // Step 3: Validate AI Configuration before finishing
            const bProviderValue = document.getElementById('setup-brain-provider') ? document.getElementById('setup-brain-provider').value : "";
            let bApiKey = '';
            const bParts = splitProviderValue(bProviderValue);
            const bProviderPoolId = providerSecretField(bParts.provider);
            if (!bApiKey && bProviderPoolId) {
                const poolInputId = `setup-${bProviderPoolId.replace(/_/g, '-')}`;
                bApiKey = document.getElementById(poolInputId)?.value.trim() || '';
            }
            
            // Check if provider is selected and requires API key (not local/ollama)
            if (bProviderValue && !isLocalProviderValue(bProviderValue) && !bApiKey) {
                return showAlert("API Key is required for the selected LLM provider");
            }
            
            finishSetup();
        }
    }

    let wizardCancelLocked = false;
    function wizardCancel() {
        if (wizardCancelLocked) return;
        wizardCancelLocked = true;

        if (daemonProvisioningWizardActive) {
            closeUIModal('setup-wizard');
            wizardCancelLocked = false;
            return;
        }
        
        console.log("Wizard Cancel triggered");

        confirmAsync("Are you sure you want to cancel the setup process? Any unsaved changes will be lost.", "Cancel Setup")
        .then(isConfirmed => {
             if (isConfirmed) {
                 let promise = Promise.resolve();

                 let targetConfig = "config.json";
                 if (typeof CURRENT_CONFIG_FILE !== 'undefined' && CURRENT_CONFIG_FILE && CURRENT_CONFIG_FILE.trim() !== "") {
                     targetConfig = CURRENT_CONFIG_FILE;
                 }

                 promise = apiCall('/api/config/environments/switch', 'POST', { filename: targetConfig })
                 .catch(err => console.error("Error reverting environment:", err));

                 promise.finally(() => {
                     sessionStorage.setItem('sop_suppress_wizard_once', 'true');
                     sessionStorage.setItem('sop_open_env_manager', 'true');
                     window.location.href = "/";
                 });
             } else {
                 wizardCancelLocked = false;
             }
        })
        .catch(err => {
            console.error(err);
            wizardCancelLocked = false;
        });
    }

    function submitProvisioningRequest(endpoint, finalPayload, options) {
        const rootPassword = options.rootPassword;
        const port = options.port;
        const regPath = options.regPath;
        const validationRegPath = options.validationRegPath;
        const populateDemo = Boolean(options.populateDemo);
        const dbName = options.dbName || '';
        const selectedTemplateCount = options.selectedTemplateCount || 0;

        const loadingModal = document.getElementById('setup-loading-modal');
        const pb = document.getElementById('setup-progress-bar');
        const pbDetails = document.getElementById('setup-loading-details');

        if (loadingModal) {
            loadingModal.style.display = 'flex';
            closeUIModal('setup-wizard');
            pb.style.width = '10%';
            pbDetails.innerHTML = '- Initializing config save...<br>';

            let pTicks = 0;
            const progressItl = setInterval(() => {
                pTicks++;
                if (pTicks === 2) {
                    pb.style.width = '30%';
                    pbDetails.innerHTML += '- Creating System & User Data Stores...<br>';
                } else if (pTicks === 4 && (populateDemo || selectedTemplateCount > 0)) {
                    pb.style.width = '50%';
                    pbDetails.innerHTML += '- Pre-loading specified template datasets...<br>';
                    document.getElementById('setup-loading-message').innerText = 'Loading templates - this may take a bit...';
                } else if (pTicks === 7 && selectedTemplateCount > 0) {
                    pb.style.width = '70%';
                    pbDetails.innerHTML += '- Compiling semantic models...<br>';
                } else if (pTicks === 8 && populateDemo) {
                    pb.style.width = '85%';
                    pbDetails.innerHTML += '- Inserting demo & medical domains concurrently...<br>';
                } else if (pTicks >= 10) {
                    pb.style.width = '95%';
                    pbDetails.innerHTML += '- Waiting for final DB persistence sync...<br>';
                    clearInterval(progressItl);
                }
            }, 1500);

            window._setupProgressItl = progressItl;
        }

        apiCall(endpoint, 'POST', finalPayload)
        .then(async (result) => {
            if (window._setupProgressItl) clearInterval(window._setupProgressItl);

            if (!rootPassword) {
                throw new Error('Root password is required to complete setup.');
            }
            try {
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'root', password: rootPassword })
                });
                const loginBody = await loginRes.json().catch(() => null);
                if (!loginRes.ok) {
                    const text = loginBody && (loginBody.error || loginBody.message)
                        ? (loginBody.error || loginBody.message)
                        : await loginRes.text();
                    throw new Error(text || 'auto-login failed');
                }
                if (!storeSessionTokens(loginBody)) {
                    throw new Error('Auto-login succeeded but did not return an access token.');
                }
            } catch (e) {
                throw new Error(`Auto-login after setup failed: ${e.message || e}`);
            }

            let sopTaskId = null;
            let medTaskId = null;
            const effectiveRegPath = (result && result.registry_path) ? result.registry_path : (regPath || validationRegPath);
            const systemDbNameForPreload = (() => {
                const pathToUse = effectiveRegPath;
                if (!pathToUse) return 'system';
                const parts = pathToUse.split(/[\\/]/).filter(Boolean);
                return parts[parts.length - 1] || 'system';
            })();

            try {
                const sopRes = await authFetch('/api/spaces/preload', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        template_id: 'core_playbook',
                        database_name: systemDbNameForPreload
                    })
                });
                if (sopRes.ok) {
                    const data = await sopRes.json();
                    sopTaskId = data.task_id;
                } else {
                    const text = await sopRes.text();
                    alert('Critical Error: Missing Core Playbook KB JSON! Core Playbook Space failed to initialize: ' + text);
                    console.error('Critical Core Playbook KB missing:', text);
                }
            } catch (e) {
                console.error('Failed to trigger Core Playbook preload:', e);
                alert('Critical Error: Failed to trigger Core Playbook preload. ' + e.message);
            }

            if (populateDemo && dbName) {
                try {
                    const medRes = await authFetch('/api/spaces/preload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            template_id: 'medical',
                            database_name: dbName
                        })
                    });
                    if (medRes.ok) {
                        const data = await medRes.json();
                        medTaskId = data.task_id;
                    }
                } catch (e) {
                    console.error('Failed to trigger Medical preload:', e);
                }
            }

            try {
                const msg = document.getElementById('setup-loading-message');
                if (msg) msg.innerText = 'Preloading spaces...';

                const pollPromises = [];
                if (sopTaskId) pollPromises.push(pollLongRunningTask(sopTaskId, null, null, 'Core Playbook', false));
                if (medTaskId) pollPromises.push(pollLongRunningTask(medTaskId, null, null, 'Medical', false));

                const results = await Promise.allSettled(pollPromises);
                const errors = results.filter(r => r.status === 'rejected').map(r => r.reason.message || r.reason);
                if (errors.length > 0) {
                    throw new Error(errors.join(' | '));
                }
            } catch (e) {
                console.error('Error during space preloading:', e);
                alert('Critical Error: Failed to preload Knowledge Base JSON: ' + e);
                const details = document.getElementById('setup-loading-details');
                if (details) details.innerHTML += `<span style="color: var(--text-red);">- Preload Error: ${e.message}</span><br>`;
                await new Promise(r => setTimeout(r, 2000));
            }

            if (loadingModal) {
                loadingModal.style.display = 'none';
            }

            try {
                localStorage.setItem('sop_provisioning_done', '1');
                sessionStorage.setItem('sop_provisioning_done', '1');
            } catch (e) {
                console.warn('Unable to cache provisioning completion flag', e);
            }

            resetSetupForm();

            const currentPort = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
            if (port && port != parseInt(currentPort)) {
                const hostname = window.location.hostname;
                const newUrl = `${window.location.protocol}//${hostname}:${port}/app`;
                showAlert(`Setup Complete! IMPORTANT: You changed the port to ${port}. Please RESTART the server manually, then open: ${newUrl}`, null);
                window.location.assign(newUrl);
            } else {
                window.location.reload();
            }
        })
        .catch(err => {
            if (window._setupProgressItl) clearInterval(window._setupProgressItl);
            const loadingModal = document.getElementById('setup-loading-modal');
            if (loadingModal) loadingModal.style.display = 'none';
            openUIModal('setup-wizard');
            console.error(err);
            const nextBtn = document.getElementById('wizard-next');
            nextBtn.disabled = false;
            nextBtn.textContent = 'Finish';
            nextBtn.title = 'Click "Finish" to create the configuration and initialize the databases.';
        });
    }

    function finishSetup() {
        // Collect DB Settings
        let dbName = document.getElementById('setup-db-name').value;
        let dbPath = document.getElementById('setup-db-path').value;
        
        // --- explicit validation ---
        if (!dbName || !dbName.trim()) return showAlert("Database Name is required");
        if (!dbPath || !dbPath.trim()) return showAlert("Database Path is required");
        
        const manualDBToggle = document.getElementById('setup-db-use-manual');
        if (manualDBToggle && manualDBToggle.checked) {
             // If manual/shared, user entered FULL PATH in the PATH field
             // We need to split it into path (parent) and name (folder)
             let cleanPath = dbPath;
             while (cleanPath.length > 0 && (cleanPath.endsWith('/') || cleanPath.endsWith('\\'))) {
                 cleanPath = cleanPath.slice(0, -1);
             }
             
             // Find last separator
             const idxSlash = cleanPath.lastIndexOf('/');
             const idxBackslash = cleanPath.lastIndexOf('\\');
             const idx = Math.max(idxSlash, idxBackslash);

             if (idx >= 0) {
                 dbName = cleanPath.substring(idx + 1);
                 dbPath = cleanPath.substring(0, idx);
                 // If path is empty (e.g. /name), make it /
                 if (dbPath === "") dbPath = "/";
             } else {
                 // No separator? Assume it's just a name in current dir? 
                 // Or treat as relative path.
                 dbName = cleanPath;
                 dbPath = ".";
             }
        }

        // 1. Determine User DB settings from the visible storage controls.
        const dbAdvToggle = document.getElementById('setup-db-advanced-toggle');
        const isDbAdvanced = dbAdvToggle && dbAdvToggle.checked;
        
        let finalDbStoresFoldersRaw = null;
        let finalDbHashMod = 0;
        let finalDbErasureConfigs = [];
        
        if (isDbAdvanced) {
             finalDbStoresFoldersRaw = document.getElementById('setup-db-stores-folders').value.trim();
             // When expanded storage controls are enabled, reflect the first
             // store folder back into dbPath so downstream validation sees a path.
             if (!finalDbStoresFoldersRaw) return showAlert("In Advanced Mode, at least one Store Folder is required for User DB.");
             dbPath = finalDbStoresFoldersRaw.split(/[\n,]+/).map(s=>s.trim())[0];
             
             finalDbHashMod = document.getElementById('setup-db-registry-hash-mod').value;
             finalDbErasureConfigs = collectEcConfigs('setup-db-ec-container') || [];
        } else {
             // Otherwise, use the direct database path field.
             dbPath = document.getElementById('setup-db-path').value.trim();
             if (!dbPath) return showAlert("Database Path is required");
             // Reset advanced fields
             finalDbStoresFoldersRaw = "";
             finalDbHashMod = 0;
             finalDbErasureConfigs = [];
        }

        const dbType = document.getElementById('setup-db-type').value;
        const dbConn = document.getElementById('setup-db-conn').value;
        const populateDemo = document.getElementById('setup-populate-demo').checked;
        const populateMedical = document.getElementById('setup-populate-medical') ? document.getElementById('setup-populate-medical').checked : false;


        // 2. Determine System DB settings from the visible storage controls.
        const port = parseInt(document.getElementById('setup-port').value);
        const bProviderValue = document.getElementById('setup-brain-provider') ? document.getElementById('setup-brain-provider').value : "";
        const bParts = splitProviderValue(bProviderValue);
        const bProvider = bParts.provider;
        const bModel = bParts.model || (document.getElementById('setup-brain-model') ? document.getElementById('setup-brain-model').value.trim() : "");
        const bUrl = document.getElementById('setup-brain-url') ? document.getElementById('setup-brain-url').value.trim() : "";
        let bApiKey = '';
        const selectedBrainProviderKey = providerSecretField(bProvider);
        if (!bApiKey && selectedBrainProviderKey) {
            const poolInputId = `setup-${selectedBrainProviderKey.replace(/_/g, '-')}`;
            bApiKey = document.getElementById(poolInputId)?.value.trim() || '';
        }

        const openAIProviderKey = document.getElementById('setup-openai-api-key') ? document.getElementById('setup-openai-api-key').value.trim() : "";
        const anthropicProviderKey = document.getElementById('setup-anthropic-api-key') ? document.getElementById('setup-anthropic-api-key').value.trim() : "";
        const geminiProviderKey = document.getElementById('setup-gemini-api-key') ? document.getElementById('setup-gemini-api-key').value.trim() : "";

        const eProviderValue = document.getElementById('setup-embedder-provider') ? document.getElementById('setup-embedder-provider').value : "";
        const eParts = splitProviderValue(eProviderValue);
        const eProvider = eParts.provider;
        const eModel = eParts.model || (document.getElementById('setup-embedder-model') ? document.getElementById('setup-embedder-model').value.trim() : "");
        const eUrl = document.getElementById('setup-embedder-url') ? document.getElementById('setup-embedder-url').value.trim() : "";
        const eApiKey = document.getElementById('setup-embedder-api-key') ? document.getElementById('setup-embedder-api-key').value.trim() : "";
        const sysAdvToggle = document.getElementById('setup-sys-advanced-toggle');
        const isSysAdvanced = sysAdvToggle && sysAdvToggle.checked;

        let regPath = null;
        let sysType = document.getElementById('setup-sys-type').value;
        let sysConn = document.getElementById('setup-sys-conn').value;
        
        let sysHashMod = 0;
        let sysStoresFoldersRaw = null;
        let sysErasureConfigs = [];
        
        let validationRegPath = "";

        if (isSysAdvanced) {
            sysStoresFoldersRaw = document.getElementById('setup-sys-stores-folders').value.trim();
            if (!sysStoresFoldersRaw) return showAlert("In Advanced Mode, at least one Store Folder is required for System DB.");
            
            // When specific store folders are supplied, omit registry_path in
            // the payload to avoid conflicting backend path validation.
            regPath = "";
            // Use the first folder for client-side collision validation
            validationRegPath = sysStoresFoldersRaw.split(/[\n,]+/).map(s=>s.trim())[0];
            
            sysHashMod = document.getElementById('setup-sys-registry-hash-mod').value;
            const manualConfigs = collectEcConfigs('setup-sys-ec-container');
            if (manualConfigs) sysErasureConfigs = manualConfigs;
        } else {
            // Otherwise, use the direct system database path field.
            regPath = document.getElementById('setup-reg-path').value.trim();
            if (!regPath) return showAlert("System Database Path is required");
            validationRegPath = regPath;
            
            // Reset advanced fields
            sysStoresFoldersRaw = "";
            sysHashMod = 0;
            sysErasureConfigs = [];
        }
        
        // Prevent collision
        const normalize = (p) => p.trim().replace(/[/\\]+$/, "");
        if (normalize(dbPath) === normalize(validationRegPath)) {
            return showAlert("User Database Path and System Database Path cannot be the same.");
        }

        // Shared Brain/DB Overrides (if checking "Connect to Existing")
        const manualEntToggle = document.getElementById('setup-sys-use-manual-enterprise');
        if (manualEntToggle && manualEntToggle.checked) {
            // If connecting to existing, we use regPath (simple) but ensure advanced config is ignored
            sysErasureConfigs = [];
            sysStoresFoldersRaw = "";
            sysHashMod = null;
        }
        
        if (manualDBToggle && manualDBToggle.checked) {
             finalDbErasureConfigs = [];
             finalDbStoresFoldersRaw = "";
             finalDbHashMod = null;
        }

        const nextBtn = document.getElementById('wizard-next');
        nextBtn.disabled = true;
        nextBtn.textContent = "Setting up...";
        nextBtn.title = "Creating databases and configuring environments...";

        // --- Helper to Convert Frontend EC Config to SOP Backend Map ---
        const convertToSopEcMap = (arr) => {
             const m = {};
             if (!arr || arr.length === 0) return null;
             arr.forEach(item => {
                 let key = item.key || "default";
                 if (key === '""') key = "";
                 m[key] = {
                     data_shards_count: item.data_chunks,
                     parity_shards_count: item.parity_chunks,
                     base_folder_paths_across_drives: item.base_paths
                 };
             });
             return m;
        };

        // --- Construct System Options (sop.DatabaseOptions) ---
        const systemOptions = {
            type: sysType === 'clustered' ? 1 : 0, // sop.DatabaseType Enum (0=Standalone, 1=Clustered)
            cache_type: sysType === 'clustered' ? 1 : 0,
            registry_hash_mod: sysHashMod ? parseInt(sysHashMod) : 0,
            stores_folders: sysStoresFoldersRaw ? sysStoresFoldersRaw.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0) : null
        };
        if (sysType === 'clustered') {
             systemOptions.redis_config = { address: sysConn || "localhost:6379" };
        }
        const sysEcMap = convertToSopEcMap(sysErasureConfigs);
        if (sysEcMap) {
            systemOptions.erasure_config = sysEcMap;
        }

        // --- Construct User Options (sop.DatabaseOptions) ---
        const userOptions = {
            type: dbType === 'clustered' ? 1 : 0,
            cache_type: dbType === 'clustered' ? 1 : 0,
            registry_hash_mod: finalDbHashMod ? parseInt(finalDbHashMod) : 0,
            stores_folders: finalDbStoresFoldersRaw ? finalDbStoresFoldersRaw.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0) : null
        };
        if (dbType === 'clustered') {
             userOptions.redis_config = { address: dbConn || "localhost:6379" };
        }
        const userEcMap = convertToSopEcMap(finalDbErasureConfigs);
        if (userEcMap) {
            userOptions.erasure_config = userEcMap;
        }

        const databases = [];
        if (!skipUserDbProvisioning) {
            databases.push({
                name: dbName,
                path: dbPath,
                use_shared_db: manualDBToggle ? manualDBToggle.checked : false,
                populate_demo: populateDemo,
                populate_medical: populateMedical,
                options: userOptions
            });
        }

        // --- Save AI config to local browser storage (BYOK) ---
        const aiConfig = {
            brain_provider: bProvider,
            brain_model: bModel,
            brain_url: bUrl,
            brain_api_key: bApiKey,
            embedder_provider: eProvider,
            embedder_model: eModel,
            embedder_url: eUrl,
            embedder_api_key: eApiKey,
            openai_api_key: openAIProviderKey || (normalizeProviderSecretKey(bProvider) === 'openai' ? bApiKey : ''),
            anthropic_api_key: anthropicProviderKey || (normalizeProviderSecretKey(bProvider) === 'anthropic' ? bApiKey : ''),
            gemini_api_key: geminiProviderKey || (normalizeProviderSecretKey(bProvider) === 'gemini' ? bApiKey : '')
        };
        mergeStoredAIConfigSecure(aiConfig);

        // --- Construct Main Payload ---
        const finalPayload = {
            registry_path: regPath,
            port: port,
            root_password: document.getElementById('setup-root-password')?.value || '',
            system_admin_bootstrap_secret: document.getElementById('setup-system-admin-bootstrap-secret')?.value || '',
            vectorization_recovery_storage_path: document.getElementById('setup-vectorization-recovery-storage-path')?.value || '',
            brain_provider: bProvider,
            brain_model: bModel,
            brain_url: bUrl,
            brain_api_key: bApiKey,
            embedder_provider: eProvider,
            embedder_model: eModel,
            embedder_url: eUrl,
            embedder_api_key: eApiKey,
            use_shared_brain: manualEntToggle ? manualEntToggle.checked : false,
            system_options: systemOptions,
            databases: databases
        };

        submitProvisioningRequest('/api/config/save', finalPayload, {
            rootPassword: (document.getElementById('setup-root-password')?.value || '').trim(),
            port: port,
            regPath: regPath,
            validationRegPath: validationRegPath,
            populateDemo: populateDemo,
            dbName: dbName,
            selectedTemplateCount: document.querySelectorAll('input[id^="setup-populate-template-"]:checked').length
        });
    }

    // --- Preferences Logic ---
    function handlePrefEsc(e) {
        if (e.key === 'Escape') closePreferences();
    }

    function showPreferences() {
        const modal = document.getElementById('preferences-modal');
        const mobileMode = localStorage.getItem('sop_ui_mobile_mode') || 'app';
        document.getElementById('pref-mobile-mode').value = mobileMode;
        modal.style.display = 'flex';
        document.addEventListener('keydown', handlePrefEsc);
    }

    function closePreferences() {
        closeUIModal('preferences-modal');
        document.removeEventListener('keydown', handlePrefEsc);
    }

    function savePreferences() {
        const mobileMode = document.getElementById('pref-mobile-mode').value;
        localStorage.setItem('sop_ui_mobile_mode', mobileMode);
        closePreferences();
        applyPreferences();
    }

    function applyPreferences() {
        // Default to 'app' (Auto 2) if not set
        const mobileMode = localStorage.getItem('sop_ui_mobile_mode') || 'app';
        const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        let useAI = false;
        let lockAI = false;

        if (mobileMode === 'app') {
            // Auto 2: AI Only on Mobile
            if (isMobile) {
                useAI = true;
                lockAI = true;
            }
        } else if (mobileMode === 'hybrid') {
            // Auto 1: AI Default on Mobile, but can minimize
            if (isMobile) {
                useAI = true;
                lockAI = false;
            }
        } else if (mobileMode === 'desktop') {
            // Desktop Mode: Manual toggle only
            useAI = false;
            lockAI = false;
        }

        const widget = document.getElementById('chat-widget');
        const minimizeBtn = widget.querySelector('.minimize-btn');
        const resetBtn = widget.querySelector('.reset-btn');

        if (useAI) {
            // Auto-open chat if not already open
            if (!widget.classList.contains('active')) {
                toggleChatWidget(true);
            }
        }

        // On Mobile "App Mode", hide window controls to enforce the "App" feel
        if (lockAI && isMobile) {
            if (minimizeBtn) minimizeBtn.style.display = 'none';
            if (resetBtn) resetBtn.style.display = 'none';
        } else {
            if (minimizeBtn) minimizeBtn.style.display = '';
            if (resetBtn) resetBtn.style.display = '';
        }
    }

    // Apply preferences on load
    document.addEventListener('DOMContentLoaded', applyPreferences);

    // --- Uninstall / Reset System ---
    function showUninstallModal() {
        if(document.getElementById('uninstall-delete-user-dbs')) document.getElementById('uninstall-delete-user-dbs').checked = true;
        if(document.getElementById('uninstall-delete-system-db')) document.getElementById('uninstall-delete-system-db').checked = false;
        openUIModal('uninstall-system-modal', 'block');
    }

    function closeUninstallModal() {
        closeUIModal('uninstall-system-modal');
    }

    function confirmUninstallSystem() {
        const deleteUserDBs = document.getElementById('uninstall-delete-user-dbs').checked;
        const deleteSystemDB = document.getElementById('uninstall-delete-system-db').checked;
        
        apiCall('/api/system/uninstall', 'POST', {
            delete_user_dbs: deleteUserDBs,
            delete_system_db: deleteSystemDB
        })
        .then(() => {
            showAlert('System uninstalled/reset successfully. Reloading...', () => location.reload());
        });
    }

    // --- Erasure Config Helpers ---
    
    function addErasureConfigRow(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        const div = document.createElement('div');
        div.className = 'ec-entry';
        div.style.border = '1px dashed var(--border-color)';
        div.style.padding = '10px';
        div.style.marginBottom = '0px';
        div.style.position = 'relative';
        
        div.innerHTML = `
            <span style="position: absolute; right: 5px; top: 5px; cursor: pointer; color: var(--danger-bg); font-weight: bold;" onclick="removeECItem(this)">&times;</span>
            <div style="margin-bottom: 5px; display: flex; align-items: center; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label style="font-size: 0.9em;">Key:</label>
                    <input type="text" class="ec-key" placeholder="Empty = Default" title="Leave empty to use as the default configuration." style="width: 160px; font-size: 0.9em;">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label style="white-space: nowrap; margin-bottom: 0; font-size: 0.9em;">EC:</label>
                    <label style="margin-bottom: 0; font-size: 0.8em;">Data:</label>
                    <input type="number" class="ec-data" min="0" style="width: 40px; flex: none; font-size: 0.9em;">
                    <label style="margin-bottom: 0; font-size: 0.8em;">Parity:</label>
                    <input type="number" class="ec-parity" min="0" style="width: 40px; flex: none; font-size: 0.9em;">
                </div>
            </div>
            <input type="text" class="ec-paths" placeholder="/mnt/d1, /mnt/d2..." style="width: 100%; box-sizing: border-box; font-size: 0.9em;">
        `;
        container.appendChild(div);
    }

    function removeECItem(span) {
        const entry = span.closest('.ec-entry');
        if (entry) {
             entry.remove();
        }
    }
    
    function addNewDbECItem() {
        addErasureConfigRow('new-db-ec-container');
    }
    
    function addSetupDbECItem() {
        addErasureConfigRow('setup-db-ec-container');
    }

    function addSetupSysECItem() {
        addErasureConfigRow('setup-sys-ec-container');
    }

    function collectEcConfigs(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return null;
        
        const entries = container.querySelectorAll('.ec-entry');
        if (entries.length === 0) return null;
        
        const configs = [];
        let validationError = null;

        entries.forEach(entry => {
             if (validationError) return;

             const key = entry.querySelector('.ec-key').value.trim();
             const data = parseInt(entry.querySelector('.ec-data').value);
             const parity = parseInt(entry.querySelector('.ec-parity').value);
             const pathsRaw = entry.querySelector('.ec-paths').value.trim();
             
             if (!isNaN(data) && !isNaN(parity)) {
                 const item = {
                     key: key,
                     data_chunks: data,
                     parity_chunks: parity,
                     base_paths: [] // Initialize as empty array
                 };
                 if (pathsRaw) {
                     // Updated split regex to include spaces ([\n,\s]+) to handle space-separated paths
                     item.base_paths = pathsRaw.split(/[\n,\s]+/).map(s => s.trim()).filter(s => s.length > 0);
                 }

                 // Validate count matches Data + Parity (User Request: Finish must error if mismatch)
                 const requiredCount = data + parity;
                 if (item.base_paths.length !== requiredCount) {
                     validationError = `Erasure Config Error for '${key}':\nRequired Paths: ${requiredCount} (${data} Data + ${parity} Parity)\nFound Paths: ${item.base_paths.length}\n\nPlease check your path separators (space, comma, or newline).`;
                     return;
                 }

                 configs.push(item);
             }
        });

        if (validationError) {
            showAlert(validationError);
            throw new Error(validationError);
        }
        
        return configs.length > 0 ? configs : null;
    }
