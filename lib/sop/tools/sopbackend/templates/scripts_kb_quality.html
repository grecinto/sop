{{define "scripts_kb_quality"}}
<script>
// KB Quality Dashboard JavaScript

let kbQualityData = null;
let kbJobStatus = null;

function selectKBQuality(element) {
    // Clear the real store selection state used by the main navigation handlers.
    currentStore = null;
    currentStoreInfo = null;
    if (typeof window !== 'undefined') {
        window.currentStore = null;
        window.currentStoreInfo = null;
    }

    // Clear other selections
    document.querySelectorAll('#sidebar li').forEach(li => li.classList.remove('active'));
    if (element) element.classList.add('active');

    // Hide detail panel
    const detailPanel = document.getElementById('detail-panel');
    if (detailPanel) detailPanel.style.display = 'none';

    // Hide toolbar and pagination
    const toolbar = document.getElementById('toolbar');
    if (toolbar) toolbar.style.display = 'none';
    const pagination = document.getElementById('pagination');
    if (pagination) pagination.style.display = 'none';
    const paginationTop = document.getElementById('pagination-top');
    if (paginationTop) paginationTop.style.display = 'none';

    // Update title
    const titleEl = document.getElementById('current-store-title');
    if (titleEl) titleEl.textContent = 'Space Quality';

    // Hide action buttons
    const buttons = ['btn-code-store', 'btn-edit-store', 'btn-edit-kb', 'btn-export-kb', 
                     'btn-import-kb', 'btn-add-kb-category', 'btn-add-space-item', 
                     'btn-delete-kb', 'btn-view-store', 'btn-edit-cel', 'btn-delete-store'];
    buttons.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.style.display = 'none';
    });

    // Render quality dashboard in main pane
    renderKBQualityDashboard();
}

function renderKBQualityDashboard() {
    const dataGrid = document.getElementById('data-grid');
    if (!dataGrid) return;

    dataGrid.innerHTML = `
        <div class="kb-quality-container" style="width: 100%; max-width: none; margin: 0; box-sizing: border-box; padding-right: 8px;">
            <div class="kb-header" style="margin-bottom: 30px;">
                <p style="color: var(--text-muted); font-size: 14px;">Monitor and improve Space effectiveness across all contexts</p>
            </div>

            <div id="kb-quality-loading" class="loading-spinner" style="text-align: center; padding: 40px;">
                <div>Loading quality metrics...</div>
            </div>

            <div id="kb-quality-content" style="display: none;">
                <div class="kb-card-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; margin-bottom: 24px;">
                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Total Spaces Tracked</div>
                        <div style="font-size: 48px; font-weight: 600; color: var(--success-bg); margin: 20px 0 10px 0;" id="stat-total-kbs">0</div>
                        <div style="font-size: 14px; color: var(--text-muted);">Across all task types</div>
                    </div>

                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Average Success Rate</div>
                        <div style="font-size: 48px; font-weight: 600; color: var(--success-bg); margin: 20px 0 10px 0;" id="stat-avg-success">0%</div>
                        <div style="height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin: 10px 0;">
                            <div style="height: 100%; background: var(--success-bg); transition: width 0.3s; width: 0%;" id="progress-avg-success"></div>
                        </div>
                    </div>

                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Critical Issues</div>
                        <div style="font-size: 48px; font-weight: 600; color: #f44336; margin: 20px 0 10px 0;" id="stat-critical">0</div>
                        <div style="font-size: 14px; color: var(--text-muted);">Spaces requiring immediate attention</div>
                    </div>

                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Total Uses (All Time)</div>
                        <div style="font-size: 48px; font-weight: 600; color: var(--success-bg); margin: 20px 0 10px 0;" id="stat-total-uses">0</div>
                        <div style="font-size: 14px; color: var(--text-muted);">Successful + Failed generations</div>
                    </div>
                </div>

                <div class="kb-card-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; margin-bottom: 24px;">
                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Top Performers 🏆</div>
                        <ul style="list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto;" id="top-performers-list">
                            <li style="padding: 12px 0; border-bottom: 1px solid var(--border-color);">No data available</li>
                        </ul>
                    </div>

                    <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); height: 100%; box-sizing: border-box;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Needs Review ⚠️</div>
                        <ul style="list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto;" id="poor-performers-list">
                            <li style="padding: 12px 0; border-bottom: 1px solid var(--border-color);">No data available</li>
                        </ul>
                    </div>
                </div>

                <div class="kb-card" style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);">
                    <div style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-color);">Actions</div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button onclick="triggerQualityCheck()" style="padding: 8px 16px; background: var(--button-bg); color: var(--button-text); border: none; border-radius: 4px; cursor: pointer;">Run Quality Check Now</button>
                        <button onclick="downloadReport()" style="padding: 8px 16px; background: var(--sidebar-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">Download Full Report</button>
                        <button onclick="refreshQualityDashboard()" style="padding: 8px 16px; background: var(--sidebar-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">Refresh Data</button>
                    </div>

                    <div id="job-status" style="display: none; background: var(--pre-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-top: 20px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">Background Job Status</div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span style="color: var(--text-muted); font-size: 13px;">Last Run:</span>
                            <span style="font-weight: 600; color: var(--text-color); font-size: 13px;" id="job-last-run">Never</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted); font-size: 13px;">Next Run:</span>
                            <span style="font-weight: 600; color: var(--text-color); font-size: 13px;" id="job-next-run">Unknown</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;

    // Load dashboard data
    loadKBQualityDashboard();
}

async function loadKBQualityDashboard() {
    const loadingEl = document.getElementById('kb-quality-loading');
    const contentEl = document.getElementById('kb-quality-content');
    
    if (!loadingEl || !contentEl) return;
    
    try {
        loadingEl.style.display = 'block';
        contentEl.style.display = 'none';
        
        // Fetch quality report and job status in parallel
        const [reportData, jobData] = await Promise.all([
            fetchKBQualityReport(),
            fetchJobStatus()
        ]);
        
        kbQualityData = reportData;
        kbJobStatus = jobData;
        
        renderDashboard();
        
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
    } catch (error) {
        console.error('Failed to load KB quality dashboard:', error);
        if (loadingEl) loadingEl.innerHTML = '<div style="color: var(--danger-color);">Failed to load dashboard data: ' + error.message + '</div>';
    }
}

function refreshQualityDashboard() {
    loadKBQualityDashboard().then(() => {
        if (typeof showAlert === 'function') showAlert('Dashboard refreshed');
    });
}

async function fetchKBQualityReport() {
    const url = getRuntimeRequestTarget('/api/kb/quality/report?format=json');
    const headers = { 'Content-Type': 'application/json' };
    applyRuntimeAuthHeaders(headers, '/api/kb/quality/report');
    
    const response = await fetch(url, {
        method: 'GET',
        headers: headers,
        credentials: 'same-origin'
    });
    
    if (!response.ok) {
        throw new Error('Failed to fetch quality report: ' + response.statusText);
    }
    
    return await response.json();
}

async function fetchJobStatus() {
    try {
        const url = getRuntimeRequestTarget('/api/kb/quality/status');
        const headers = { 'Content-Type': 'application/json' };
        applyRuntimeAuthHeaders(headers, '/api/kb/quality/status');
        
        const response = await fetch(url, {
            method: 'GET',
            headers: headers,
            credentials: 'same-origin'
        });
        
        if (!response.ok) {
            return null; // Job status endpoint may not be available if no job configured
        }
        
        return await response.json();
    } catch (error) {
        console.warn('Failed to fetch job status:', error);
        return null;
    }
}

function renderDashboard() {
    if (!kbQualityData) return;
    
    // Render overview stats
    renderOverviewStats();
    
    // Render top performers
    renderTopPerformers();
    
    // Render poor performers
    renderPoorPerformers();
    
    // Render job status if available
    if (kbJobStatus) {
        renderJobStatus();
    }
}

function renderOverviewStats() {
    const data = kbQualityData;
    
    // Total KBs
    const totalKBs = data.total_kbs || 0;
    document.getElementById('stat-total-kbs').textContent = totalKBs;
    
    // Average success rate
    const avgSuccess = data.average_success_rate || 0;
    const avgSuccessPercent = (avgSuccess * 100).toFixed(1);
    const avgSuccessEl = document.getElementById('stat-avg-success');
    avgSuccessEl.textContent = avgSuccessPercent + '%';
    
    // Update color based on performance
    avgSuccessEl.className = 'big-stat';
    if (avgSuccess < 0.5) {
        avgSuccessEl.classList.add('critical');
    } else if (avgSuccess < 0.7) {
        avgSuccessEl.classList.add('warning');
    }
    
    // Progress bar
    document.getElementById('progress-avg-success').style.width = avgSuccessPercent + '%';
    
    // Critical issues (poor performers with success rate < 30%)
    const criticalCount = (data.poor_performers || []).filter(kb => 
        kb.effectiveness_score < 0.3
    ).length;
    document.getElementById('stat-critical').textContent = criticalCount;
    
    // Total uses
    let totalUses = 0;
    if (data.top_performers) {
        totalUses = data.top_performers.reduce((sum, kb) => 
            sum + (kb.success_count || 0) + (kb.failure_count || 0), 0
        );
    }
    if (data.poor_performers) {
        totalUses += data.poor_performers.reduce((sum, kb) => 
            sum + (kb.success_count || 0) + (kb.failure_count || 0), 0
        );
    }
    document.getElementById('stat-total-uses').textContent = totalUses.toLocaleString();
}

function renderTopPerformers() {
    const list = document.getElementById('top-performers-list');
    const topPerformers = kbQualityData.top_performers || [];
    
    if (topPerformers.length === 0) {
        list.innerHTML = '<li class="empty-state">No top performers yet</li>';
        return;
    }
    
    list.innerHTML = '';
    
    // Show top 10
    topPerformers.slice(0, 10).forEach(kb => {
        const li = document.createElement('li');
        li.className = 'kb-item';
        
        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'kb-name';
        name.textContent = kb.kb_name || 'Unknown';
        
        const taskType = document.createElement('div');
        taskType.className = 'kb-task-type';
        taskType.textContent = kb.task_type || 'general';
        
        info.appendChild(name);
        info.appendChild(taskType);
        
        const score = document.createElement('div');
        score.className = 'kb-score';
        const successRate = ((kb.effectiveness_score || 0) * 100).toFixed(0);
        score.textContent = successRate + '%';
        
        const uses = document.createElement('div');
        uses.className = 'stat-description';
        uses.style.fontSize = '12px';
        uses.style.marginTop = '4px';
        const totalUses = (kb.success_count || 0) + (kb.failure_count || 0);
        uses.textContent = totalUses + ' uses';
        
        li.appendChild(info);
        const scoreContainer = document.createElement('div');
        scoreContainer.style.textAlign = 'right';
        scoreContainer.appendChild(score);
        scoreContainer.appendChild(uses);
        li.appendChild(scoreContainer);
        
        list.appendChild(li);
    });
}

function renderPoorPerformers() {
    const list = document.getElementById('poor-performers-list');
    const poorPerformers = kbQualityData.poor_performers || [];
    
    if (poorPerformers.length === 0) {
        list.innerHTML = '<li class="empty-state">No issues found ✓</li>';
        return;
    }
    
    list.innerHTML = '';
    
    // Show all poor performers
    poorPerformers.forEach(kb => {
        const li = document.createElement('li');
        li.className = 'kb-item';
        
        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'kb-name';
        name.textContent = kb.kb_name || 'Unknown';
        
        const taskType = document.createElement('div');
        taskType.className = 'kb-task-type';
        taskType.textContent = (kb.task_type || 'general') + ' • ' + kb.reason;
        
        info.appendChild(name);
        info.appendChild(taskType);
        
        const score = document.createElement('div');
        const successRate = ((kb.effectiveness_score || 0) * 100).toFixed(0);
        
        score.className = 'kb-score';
        if (kb.effectiveness_score < 0.3) {
            score.classList.add('critical');
        } else {
            score.classList.add('warning');
        }
        score.textContent = successRate + '%';
        
        const uses = document.createElement('div');
        uses.className = 'stat-description';
        uses.style.fontSize = '12px';
        uses.style.marginTop = '4px';
        const totalUses = (kb.success_count || 0) + (kb.failure_count || 0);
        uses.textContent = totalUses + ' uses';
        
        li.appendChild(info);
        const scoreContainer = document.createElement('div');
        scoreContainer.style.textAlign = 'right';
        scoreContainer.appendChild(score);
        scoreContainer.appendChild(uses);
        li.appendChild(scoreContainer);
        
        list.appendChild(li);
    });
}

function renderJobStatus() {
    if (!kbJobStatus) return;
    
    const jobStatusEl = document.getElementById('job-status');
    jobStatusEl.style.display = 'block';
    
    // Last run time
    const lastRunEl = document.getElementById('job-last-run');
    if (kbJobStatus.last_run) {
        const lastRun = new Date(kbJobStatus.last_run);
        lastRunEl.textContent = lastRun.toLocaleString();
    } else {
        lastRunEl.textContent = 'Never';
    }
    
    // Next run time
    const nextRunEl = document.getElementById('job-next-run');
    if (kbJobStatus.next_run) {
        const nextRun = new Date(kbJobStatus.next_run);
        nextRunEl.textContent = nextRun.toLocaleString();
    } else {
        nextRunEl.textContent = 'Not scheduled';
    }
}

async function triggerQualityCheck(event) {
    try {
        const btn = event?.target || document.querySelector('.kb-btn-primary');
        if (btn) {
            btn.disabled = true;
            btn.textContent = 'Running check...';
        }
        
        const url = getRuntimeRequestTarget('/api/kb/quality/trigger');
        const headers = { 'Content-Type': 'application/json' };
        applyRuntimeAuthHeaders(headers, '/api/kb/quality/trigger');
        
        const response = await fetch(url, {
            method: 'POST',
            headers: headers,
            credentials: 'same-origin'
        });
        
        if (!response.ok) {
            throw new Error('Failed to trigger quality check: ' + response.statusText);
        }
        
        const result = await response.json();
        
        // Wait a moment for the check to complete
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Reload dashboard data
        await loadKBQualityDashboard();
        
        showAlert('Quality check completed successfully');
    } catch (error) {
        console.error('Failed to trigger quality check:', error);
        showAlert('Failed to trigger quality check: ' + error.message);
    } finally {
        const btn = event?.target || document.querySelector('.kb-btn-primary');
        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Run Quality Check Now';
        }
    }
}

async function downloadReport() {
    try {
        const url = getRuntimeRequestTarget('/api/kb/quality/report?format=text');
        const headers = { 'Content-Type': 'application/json' };
        applyRuntimeAuthHeaders(headers, '/api/kb/quality/report');
        
        const response = await fetch(url, {
            method: 'GET',
            headers: headers,
            credentials: 'same-origin'
        });
        
        if (!response.ok) {
            throw new Error('Failed to download report: ' + response.statusText);
        }
        
        const reportText = await response.text();
        
        // Create download link
        const blob = new Blob([reportText], { type: 'text/plain' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'kb_quality_report_' + new Date().toISOString().split('T')[0] + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
        
        showAlert('Report downloaded successfully');
    } catch (error) {
        console.error('Failed to download report:', error);
        showAlert('Failed to download report: ' + error.message);
    }
}

async function refreshDashboard() {
    await loadKBQualityDashboard();
    showAlert('Dashboard refreshed');
}

function showLoading(show) {
    document.getElementById('kb-quality-loading').style.display = show ? 'block' : 'none';
    document.getElementById('kb-quality-content').style.display = show ? 'none' : 'block';
}

function showError(message) {
    const container = document.querySelector('.kb-quality-container');
    const errorDiv = document.createElement('div');
    errorDiv.className = 'empty-state';
    errorDiv.innerHTML = '<h3>Error</h3><p>' + message + '</p>';
    container.appendChild(errorDiv);
}

// No need for a wrapper - use the global showAlert from scripts_part01 directly
</script>
