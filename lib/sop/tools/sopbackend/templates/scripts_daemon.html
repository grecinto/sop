{{define "scripts_daemon"}}
<script>
/**
 * Daemon Authentication Client
 *
 * Provides bootstrap-based authentication to local SOP daemon.
 * Handles JWT token management, automatic refresh, and authenticated requests.
 */

(function() {
    'use strict';

    const TOKEN_STORAGE_KEY = 'sop_daemon_access_token';
    const REFRESH_TOKEN_STORAGE_KEY = 'sop_daemon_refresh_token';
    const TOKEN_EXPIRY_KEY = 'sop_daemon_token_expiry';
    const LAST_SUBSCRIPTION_CHECK_KEY = 'sop_last_subscription_check_timestamp';
    const SUBSCRIPTION_CHECK_INTERVAL = 14 * 24 * 60 * 60 * 1000; // 14 days in milliseconds
    const DEFAULT_DAEMON_URL = 'http://127.0.0.1:9090';

    function sha256Hex(value) {
        if (typeof crypto === 'undefined' || !crypto.subtle) {
            return '';
        }
        const bytes = new TextEncoder().encode(value);
        return crypto.subtle.digest('SHA-256', bytes).then(buffer => {
            return Array.from(new Uint8Array(buffer), byte => byte.toString(16).padStart(2, '0')).join('');
        });
    }

    function getLocalRuntimeBaseURL() {
        const configured = window.SOP_DAEMON_BASE_URL || localStorage.getItem('sop_daemon_url') || DEFAULT_DAEMON_URL;
        return (configured || DEFAULT_DAEMON_URL).replace(/\/$/, '');
    }

    function getCurrentClientID() {
        const candidates = [
            localStorage.getItem('sop_client_id'),
            sessionStorage.getItem('sop_client_id'),
            localStorage.getItem('sop_daemon_client_id'),
            sessionStorage.getItem('sop_daemon_client_id'),
            localStorage.getItem('client_id'),
            sessionStorage.getItem('client_id')
        ];
        for (const value of candidates) {
            if (typeof value === 'string' && value.trim() !== '') {
                return value.trim();
            }
        }
        return 'sop-ui';
    }

    class DaemonAuthClient {
        constructor() {
            this.accessToken = localStorage.getItem(TOKEN_STORAGE_KEY);
            this.refreshToken = localStorage.getItem(REFRESH_TOKEN_STORAGE_KEY);

            const storedExpiry = localStorage.getItem(TOKEN_EXPIRY_KEY);
            this.tokenExpiry = storedExpiry ? parseInt(storedExpiry, 10) : null;
            this.bootstrapping = false;
            this.lastSubscriptionCheck = localStorage.getItem(LAST_SUBSCRIPTION_CHECK_KEY);
            this.lastBootstrapError = '';
        }

        async bootstrap() {
            if (this.bootstrapping) {
                return false;
            }

            this.bootstrapping = true;
            this.lastBootstrapError = '';

            try {
                const runtimeMode = (typeof getCurrentRuntimeMode === 'function' ? getCurrentRuntimeMode() : 'hq');
                if (runtimeMode !== 'local') {
                    this.bootstrapping = false;
                    return false;
                }

                if (this.hasValidToken()) {
                    this.bootstrapping = false;
                    void this.pingSubscriptionStatus();
                    return true;
                }

                let authPayload;
                let authEndpoint;
                let bootstrapSecret = '';
                const clientID = (typeof getCurrentClientID === 'function' ? getCurrentClientID() : '') || 'sop-ui';

                const daemonBootstrapURL = `${getLocalRuntimeBaseURL()}/api/daemon/bootstrap-secret${clientID ? `?client_id=${encodeURIComponent(clientID)}` : ''}`;
                const secretResponse = await fetch(daemonBootstrapURL);
                if (!secretResponse.ok) {
                    if (secretResponse.status === 404) {
                        throw new Error('Daemon bootstrap secret was not available for this client. Confirm the daemon is running and the UI host can read the bootstrap file.');
                    }
                    throw new Error(`Failed to get bootstrap secret: ${secretResponse.status}`);
                }

                const secretData = await secretResponse.json();
                bootstrapSecret = secretData && secretData.bootstrap_secret;

                if (!bootstrapSecret) {
                    throw new Error('Bootstrap secret is empty');
                }

                authPayload = { bootstrap_secret: bootstrapSecret, client_id: clientID };
                authEndpoint = `${getLocalRuntimeBaseURL()}/api/daemon/auth`;

                const challengeResponse = await fetch(authEndpoint.replace('/api/daemon/auth', '/api/daemon/challenge'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bootstrap_secret: bootstrapSecret, client_id: clientID })
                });

                if (!challengeResponse.ok) {
                    const challengeError = await challengeResponse.json().catch(() => ({}));
                    throw new Error(`Daemon challenge failed: ${challengeError.error || challengeResponse.status}`);
                }

                const challengeData = await challengeResponse.json();
                const challengeID = challengeData && challengeData.challenge_id;
                const challengeSignature = challengeData && challengeData.challenge_signature;
                if (!challengeID || !challengeSignature) {
                    throw new Error('Daemon challenge response was incomplete');
                }

                const signedChallenge = await sha256Hex(`${bootstrapSecret}:${challengeID}`);
                if (!signedChallenge) {
                    throw new Error('Failed to sign bootstrap challenge');
                }

                authPayload = {
                    ...authPayload,
                    bootstrap_challenge_id: challengeID,
                    bootstrap_challenge_signature: signedChallenge,
                    bootstrap_challenge_nonce: challengeID
                };

                const authResponse = await fetch(authEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(authPayload)
                });

                if (!authResponse.ok) {
                    const errorData = await authResponse.json().catch(() => ({}));
                    throw new Error(`Daemon authentication failed: ${errorData.error || authResponse.status}`);
                }

                const authData = await authResponse.json();
                if (!authData || typeof authData.access_token !== 'string' || authData.access_token.trim() === '') {
                    throw new Error('Daemon authentication response did not include an access token.');
                }
                if (!authData || typeof authData.refresh_token !== 'string' || authData.refresh_token.trim() === '') {
                    throw new Error('Daemon authentication response did not include a refresh token.');
                }
                const expiresInSeconds = Number(authData.expires_in);
                if (!Number.isFinite(expiresInSeconds) || expiresInSeconds <= 0) {
                    throw new Error('Daemon authentication response did not include a valid token expiry.');
                }

                this.accessToken = authData.access_token;
                this.refreshToken = authData.refresh_token;
                this.tokenExpiry = Date.now() + (expiresInSeconds * 1000);

                localStorage.setItem(TOKEN_STORAGE_KEY, this.accessToken);
                localStorage.setItem(REFRESH_TOKEN_STORAGE_KEY, this.refreshToken);
                localStorage.setItem(TOKEN_EXPIRY_KEY, this.tokenExpiry);

                this.bootstrapping = false;
                return true;
            } catch (error) {
                console.error('[DaemonAuth] Bootstrap failed:', error);
                this.lastBootstrapError = error && error.message ? error.message : String(error || 'Unknown daemon bootstrap error');
                this.clearTokens();
                this.bootstrapping = false;
                return false;
            }
        }

        getLastBootstrapError() {
            return this.lastBootstrapError || '';
        }

        hasValidToken() {
            if (!this.accessToken || !this.tokenExpiry) {
                return false;
            }

            const expiresIn = this.tokenExpiry - Date.now();
            if (isNaN(expiresIn)) {
                return false;
            }
            return expiresIn > 60000;
        }

        shouldRunSubscriptionCheck() {
            if (!this.lastSubscriptionCheck) {
                return true;
            }

            const lastCheckTime = parseInt(this.lastSubscriptionCheck, 10);
            if (isNaN(lastCheckTime)) {
                return true;
            }

            const timeSinceCheck = Date.now() - lastCheckTime;
            return timeSinceCheck >= SUBSCRIPTION_CHECK_INTERVAL;
        }

        markSubscriptionCheckCompleted() {
            const timestamp = Date.now().toString();
            this.lastSubscriptionCheck = timestamp;
            localStorage.setItem(LAST_SUBSCRIPTION_CHECK_KEY, timestamp);
        }

        async pingSubscriptionStatus() {
            if (!this.shouldRunSubscriptionCheck()) {
                return true;
            }

            try {
                const response = await fetch('/api/ai/test-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider: 'openai', model: 'gpt-4o-mini', handshake: true })
                });

                if (!response.ok) {
                    console.debug('[DaemonAuth] Background subscription ping failed:', response.status);
                    return false;
                }

                this.markSubscriptionCheckCompleted();
                return true;
            } catch (error) {
                console.debug('[DaemonAuth] Background subscription ping error:', error);
                return false;
            }
        }

        async refresh() {
            if (!this.refreshToken) {
                console.debug('[DaemonAuth] No refresh token available');
                return false;
            }

            try {
                const response = await fetch(`${getLocalRuntimeBaseURL()}/api/daemon/refresh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        refresh_token: this.refreshToken
                    })
                });

                if (!response.ok) {
                    console.debug('[DaemonAuth] Token refresh failed (status: ' + response.status + ')');
                    this.clearTokens();
                    return false;
                }

                const data = await response.json();
                this.accessToken = data.access_token;
                this.refreshToken = data.refresh_token;
                this.tokenExpiry = Date.now() + (data.expires_in * 1000);

                localStorage.setItem(TOKEN_STORAGE_KEY, this.accessToken);
                localStorage.setItem(REFRESH_TOKEN_STORAGE_KEY, this.refreshToken);
                localStorage.setItem(TOKEN_EXPIRY_KEY, this.tokenExpiry);

                void this.pingSubscriptionStatus();
                return true;
            } catch (error) {
                console.error('[DaemonAuth] Token refresh error:', error);
                this.clearTokens();
                return false;
            }
        }

        async request(endpoint, options = {}) {
            if (!this.hasValidToken()) {
                const refreshed = await this.refresh();
                if (!refreshed) {
                    const bootstrapped = await this.bootstrap();
                    if (!bootstrapped) {
                        throw new Error('Failed to authenticate with daemon');
                    }
                }
            }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${this.accessToken}`,
            };

            const response = await fetch(`${getLocalRuntimeBaseURL()}${endpoint}`, {
                ...options,
                headers
            });

            if (response.status === 401) {
                const refreshed = await this.refresh();
                if (refreshed) {
                    headers.Authorization = `Bearer ${this.accessToken}`;
                    return fetch(`${getLocalRuntimeBaseURL()}${endpoint}`, {
                        ...options,
                        headers
                    });
                } else {
                    const bootstrapped = await this.bootstrap();
                    if (bootstrapped) {
                        headers.Authorization = `Bearer ${this.accessToken}`;
                        return fetch(`${getLocalRuntimeBaseURL()}${endpoint}`, {
                            ...options,
                            headers
                        });
                    }
                }
            }

            return response;
        }

        clearTokens() {
            this.accessToken = null;
            this.refreshToken = null;
            this.tokenExpiry = null;
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(REFRESH_TOKEN_STORAGE_KEY);
            localStorage.removeItem(TOKEN_EXPIRY_KEY);
        }

        getToken() {
            return this.accessToken;
        }
    }

    window.daemonAuth = new DaemonAuthClient();

    window.ensureDaemonAuth = async function() {
        if (!window.daemonAuth || typeof window.daemonAuth.bootstrap !== 'function') {
            return false;
        }
        if (window.daemonAuth.bootstrapping) {
            return window.daemonAuth.bootstrap();
        }
        return window.daemonAuth.bootstrap();
    };

    window.addEventListener('DOMContentLoaded', () => {
        window.ensureDaemonAuth().catch(err => {
            console.debug('[DaemonAuth] Auto-bootstrap failed:', err);
        });
    });
})();
</script>
{{end}}
